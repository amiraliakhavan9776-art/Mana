<script>
/* ============================================================
   قطعه ۳ — اجرا + مستندات + تحلیل
   ============================================================ */
'use strict';

/* ============ ۱۳. پرسنل و حضور ============ */
var _eqTab = 'personnel';
var WT = { monthly: 'ماهانه', daily: 'روزمزد', contract: 'پیمانکاری' };
function hourlyCost(p){ var s = num(p.salary); return p.wageType === 'monthly' ? s / 30 / 8 : s / 8; }
function recCost(p, a){ return hourlyCost(p) * num(a.hours || 0); }
function isAct(p){ return p.active !== false; }

defRoute('equipment', {
  title: 'پرسنل و حضور',
  sub: function(){ return fmt(DB.personnel.filter(isAct).length) + ' فعال از ' + fmt(DB.personnel.length); },
  render: function(){
    var today = todayISO();
    var todayRecs = DB.attendance.filter(function(a){ return a.date === today; });
    var costToday = sum(todayRecs, function(a){ var p = DB.personnel.find(function(x){ return x.id === a.personId; }); return p ? recCost(p, a) : 0; });
    var h = '<div class="grid g4 mb">';
    h += '<div class="kpi"><div class="lbl">پرسنل فعال / کل</div><div class="val">' + fmt(DB.personnel.filter(isAct).length) + ' / ' + fmt(DB.personnel.length) + '</div></div>';
    h += '<div class="kpi k-info"><div class="lbl">حضور امروز</div><div class="val">' + fmt(todayRecs.length) + '</div></div>';
    h += '<div class="kpi k-ok"><div class="lbl">هزینه امروز</div><div class="val">' + money(costToday) + '</div></div>';
    h += '<div class="kpi"><div class="lbl">کل رکوردها</div><div class="val">' + fmt(DB.attendance.length) + '</div></div></div>';
    h += '<div class="card mb"><div class="row">';
    var tabs = [['personnel', '👥 پرسنل'], ['attendance', '📅 حضور امروز'], ['cost', '💰 گزارش هزینه']];
    tabs.forEach(function(tb){
      h += '<button class="btn sm ' + (_eqTab === tb[0] ? 'p' : '') + '" data-act="eq-tab" data-tab="' + tb[0] + '">' + tb[1] + '</button>';
    });
    h += '<div style="flex:1"></div>';
    if(_eqTab === 'personnel') h += '<button class="btn sm p" data-act="ps-new">+ نفر جدید</button>';
    if(_eqTab === 'attendance') h += '<button class="btn sm g" data-act="att-mark-all">✅ همه حاضران</button>';
    h += '</div></div>';
    if(_eqTab === 'attendance') return h + renderAttendance();
    if(_eqTab === 'cost') return h + renderCost();
    return h + renderPersonnel();
  }
});

function renderPersonnel(){
  if(!DB.personnel.length) return '<div class="card"><div class="muted" style="text-align:center;padding:26px">هنوز پرسنلی ثبت نشده. از «+ نفر جدید» استفاده کنید.</div></div>';
  var h = '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>نام</th><th>سمت</th><th>تلفن</th><th>نوع دستمزد</th><th>حقوق</th><th>وضعیت</th><th></th></tr></thead><tbody>';
  DB.personnel.forEach(function(p){
    var gray = p.active === false;
    h += '<tr' + (gray ? ' style="opacity:.55"' : '') + '>';
    h += '<td><b>' + esc(p.name) + '</b></td>';
    h += '<td>' + esc(p.role || '—') + '</td>';
    h += '<td class="num">' + esc(p.phone || '—') + '</td>';
    h += '<td><span class="badge b-info">' + (WT[p.wageType] || '—') + '</span></td>';
    h += '<td class="num">' + money(p.salary) + '</td>';
    h += '<td>' + (gray ? '<span class="badge b-mut">غیرفعال</span>' : '<span class="badge b-ok">فعال</span>') + '</td>';
    h += '<td class="row" style="gap:4px"><button class="btn sm" data-act="ps-edit" data-id="' + p.id + '">✎</button>';
    h += '<button class="btn sm d" data-act="ps-del" data-id="' + p.id + '">×</button></td></tr>';
  });
  return h + '</tbody></table></div></div>';
}

function renderAttendance(){
  var today = todayISO();
  var recs = DB.attendance.filter(function(a){ return a.date === today; });
  var active = DB.personnel.filter(isAct);
  var h = '<div class="card"><div class="card-h"><h3>حضور ' + jStr(today, true) + '</h3></div>';
  h += '<div class="tbl-wrap"><table><thead><tr><th>نام</th><th>سمت</th><th>حضور</th><th>ساعت</th><th></th></tr></thead><tbody>';
  if(!active.length) h += '<tr><td colspan="5" class="muted" style="text-align:center;padding:26px">ابتدا نفر اضافه کنید.</td></tr>';
  active.forEach(function(p){
    var a = recs.find(function(x){ return x.personId === p.id; });
    h += '<tr><td><b>' + esc(p.name) + '</b></td><td>' + esc(p.role || '—') + '</td>';
    h += '<td>' + (a ? '<span class="badge b-ok">حاضر</span>' : '<span class="badge b-mut">ثبت نشده</span>') + '</td>';
    h += '<td class="num">' + (a ? fmt(a.hours, 1) : '—') + '</td>';
    h += '<td>';
    if(a) h += '<button class="btn sm d" data-act="att-del" data-id="' + a.id + '">حذف</button>';
    else h += '<button class="btn sm g" data-act="att-quick" data-pid="' + p.id + '">ثبت</button>';
    h += '</td></tr>';
  });
  return h + '</tbody></table></div></div>';
}

function renderCost(){
  var byPrj = {};
  DB.attendance.forEach(function(a){
    var p = DB.personnel.find(function(x){ return x.id === a.personId; });
    if(!p) return;
    var k = a.projectId || '_';
    if(!byPrj[k]) byPrj[k] = { days: 0, hours: 0, cost: 0, people: {} };
    byPrj[k].days++;
    byPrj[k].hours += num(a.hours);
    byPrj[k].cost += recCost(p, a);
    byPrj[k].people[a.personId] = 1;
  });
  var keys = Object.keys(byPrj);
  if(!keys.length) return '<div class="card"><div class="muted" style="text-align:center;padding:26px">حضوری ثبت نشده.</div></div>';
  var totalCost = sum(keys, function(k){ return byPrj[k].cost; });
  var totalDays = sum(keys, function(k){ return byPrj[k].days; });
  var h = '<div class="grid g3 mb">';
  h += '<div class="kpi k-ok"><div class="lbl">هزینه کل</div><div class="val">' + money(totalCost) + '</div></div>';
  h += '<div class="kpi k-info"><div class="lbl">کل نفر-روز</div><div class="val">' + fmt(totalDays) + '</div></div>';
  h += '<div class="kpi"><div class="lbl">میانگین روزانه</div><div class="val">' + money(totalDays ? totalCost / totalDays : 0) + '</div></div></div>';
  h += '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>پروژه</th><th>نفر-روز</th><th>نفرات</th><th>هزینه</th></tr></thead><tbody>';
  keys.sort(function(a, b){ return byPrj[b].cost - byPrj[a].cost; }).forEach(function(k){
    var prj = DB.projects.find(function(x){ return x.id === k; });
    var b = byPrj[k];
    h += '<tr><td><b>' + esc(prj ? prj.name : 'بدون پروژه') + '</b></td>';
    h += '<td class="num">' + fmt(b.days) + '</td>';
    h += '<td class="num">' + fmt(Object.keys(b.people).length) + '</td>';
    h += '<td class="num"><b>' + money(b.cost) + '</b></td></tr>';
  });
  return h + '</tbody></table></div></div>';
}

function psForm(p){
  p = p || {};
  return '<div class="grid g2">' +
    '<label class="f"><span>نام *</span><input type="text" name="name" value="' + esc(p.name || '') + '"></label>' +
    '<label class="f"><span>سمت</span><input type="text" name="role" value="' + esc(p.role || '') + '"></label>' +
    '<label class="f"><span>تلفن</span><input type="text" name="phone" value="' + esc(p.phone || '') + '"></label>' +
    '<label class="f"><span>نوع دستمزد</span><select name="wageType">' +
    Object.keys(WT).map(function(k){ return '<option value="' + k + '"' + ((p.wageType || 'daily') === k ? ' selected' : '') + '>' + WT[k] + '</option>'; }).join('') +
    '</select></label>' +
    '<label class="f"><span>حقوق/دستمزد</span><input type="number" name="salary" value="' + num(p.salary || 0) + '"></label>' +
    '<label class="f"><span>وضعیت</span><select name="active"><option value="1"' + (p.active !== false ? ' selected' : '') + '>فعال</option><option value="0"' + (p.active === false ? ' selected' : '') + '>غیرفعال</option></select></label>' +
    '</div>';
}

act('eq-tab', function(t){ _eqTab = t.dataset.tab || 'personnel'; render(); });
act('ps-new', function(){ modal('نفر جدید', psForm(null), '<button class="btn p" data-act="ps-save">ذخیره</button><button class="btn" data-act="close-modal">انصراف</button>'); });
act('ps-edit', function(t){ var p = DB.personnel.find(function(x){ return x.id === t.dataset.id; }); if(!p) return; modal('ویرایش', psForm(p), '<button class="btn p" data-act="ps-save" data-id="' + p.id + '">ذخیره</button><button class="btn" data-act="close-modal">انصراف</button>'); });
act('ps-save', function(t){
  var f = readForm($('#overlay'));
  if(!f.name) return toast('نام الزامی', 'err');
  pushUndo('ps-save');
  var rec = { name: f.name, role: f.role || '', phone: f.phone || '', wageType: f.wageType, salary: num(f.salary), active: String(f.active) === '1' };
  if(t.dataset.id){ var p = DB.personnel.find(function(x){ return x.id === t.dataset.id; }); Object.assign(p, rec); }
  else { rec.id = uid('ps'); DB.personnel.push(rec); }
  save(); closeModal(); render(); toast('ذخیره شد', 'ok');
});
act('ps-del', function(t){ if(!confirm('حذف؟')) return; pushUndo('ps-del'); DB.personnel = DB.personnel.filter(function(x){ return x.id !== t.dataset.id; }); save(); render(); });
act('att-quick', function(t){
  var pid = t.dataset.pid;
  if(DB.attendance.some(function(a){ return a.personId === pid && a.date === todayISO(); })) return toast('قبلاً ثبت شده', 'err');
  pushUndo('att-quick');
  DB.attendance.push({ id: uid('at'), date: todayISO(), personId: pid, projectId: '', hours: 8 });
  save(); render(); toast('ثبت شد', 'ok');
});
act('att-mark-all', function(){
  var today = todayISO();
  var pending = DB.personnel.filter(function(p){ return isAct(p) && !DB.attendance.some(function(a){ return a.personId === p.id && a.date === today; }); });
  if(!pending.length) return toast('همه ثبت شده‌اند', 'err');
  pushUndo('att-mark-all');
  pending.forEach(function(p){ DB.attendance.push({ id: uid('at'), date: today, personId: p.id, projectId: '', hours: 8 }); });
  save(); render(); toast(fmt(pending.length) + ' نفر ثبت شد', 'ok');
});
act('att-del', function(t){ pushUndo('att-del'); DB.attendance = DB.attendance.filter(function(x){ return x.id !== t.dataset.id; }); save(); render(); });

/* ============ ۱۴. گزارش روزانه ============ */
defRoute('daily', {
  title: 'گزارش روزانه',
  sub: function(){ return fmt(DB.dailies.length) + ' گزارش'; },
  render: function(){
    var rows = DB.dailies.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; });
    var h = '<div class="card"><div class="card-h"><h3>گزارش‌ها</h3><div class="sp"></div><button class="btn sm p" data-act="daily-new">+ گزارش</button></div>';
    h += '<div class="tbl-wrap"><table><thead><tr><th>تاریخ</th><th>پروژه</th><th>آب‌وهوا</th><th>نفرات</th><th></th></tr></thead><tbody>';
    if(!rows.length) h += '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">گزارشی ثبت نشده.</td></tr>';
    rows.forEach(function(r){
      var p = DB.projects.find(function(x){ return x.id === r.projectId; });
      h += '<tr><td class="num">' + jStr(r.date) + '</td><td>' + esc(p ? p.name : '—') + '</td>';
      h += '<td>' + esc(r.weather || '—') + '</td><td class="num">' + fmt(r.manpower || 0) + '</td>';
      h += '<td class="row" style="gap:4px"><button class="btn sm" data-act="daily-view" data-id="' + r.id + '">نمایش</button>';
      h += '<button class="btn sm d" data-act="daily-del" data-id="' + r.id + '">×</button></td></tr>';
    });
    return h + '</tbody></table></div></div>';
  }
});

act('daily-new', function(){
  if(!DB.projects.length) return toast('ابتدا پروژه تعریف کنید', 'err');
  var body = '<div class="grid g2">' +
    '<label class="f"><span>تاریخ</span>' + jInput('date', todayISO()) + '</label>' +
    '<label class="f"><span>پروژه</span><select name="projectId">' +
    DB.projects.map(function(p){ return '<option value="' + p.id + '">' + esc(p.name) + '</option>'; }).join('') +
    '</select></label>' +
    '<label class="f"><span>آب‌وهوا</span><input type="text" name="weather"></label>' +
    '<label class="f"><span>نفرات</span><input type="number" name="manpower" value="0"></label></div>' +
    '<label class="f"><span>شرح کارها</span><textarea name="work"></textarea></label>' +
    '<label class="f"><span>موارد و موانع</span><textarea name="issues"></textarea></label>';
  modal('گزارش جدید', body, '<button class="btn p" data-act="daily-save">ذخیره</button><button class="btn" data-act="close-modal">انصراف</button>', 'wide');
});
act('daily-save', function(){ var f = readForm($('#overlay')); pushUndo('daily-save'); DB.dailies.push(Object.assign({ id: uid('dl') }, f)); save(); closeModal(); render(); toast('ذخیره شد', 'ok'); });
act('daily-view', function(t){
  var r = DB.dailies.find(function(x){ return x.id === t.dataset.id; });
  if(!r) return;
  var p = DB.projects.find(function(x){ return x.id === r.projectId; });
  var body = '<div class="grid g3 mb"><div><div class="small muted">تاریخ</div><b>' + jStr(r.date, true) + '</b></div>';
  body += '<div><div class="small muted">پروژه</div><b>' + esc(p ? p.name : '—') + '</b></div>';
  body += '<div><div class="small muted">آب‌وهوا</div><b>' + esc(r.weather || '—') + '</b></div></div>';
  body += '<div class="card" style="box-shadow:none;border:1px solid var(--line)"><h4>شرح کارها</h4><p style="white-space:pre-wrap">' + esc(r.work || '—') + '</p></div>';
  if(r.issues) body += '<div class="card mt" style="box-shadow:none;border:1px solid var(--line)"><h4>موانع</h4><p style="white-space:pre-wrap">' + esc(r.issues) + '</p></div>';
  modal('گزارش ' + jStr(r.date), body, '<button class="btn" data-act="close-modal">بستن</button>', 'wide');

act('daily-del', function(t){ if(!confirm('حذف؟')) return; pushUndo('daily-del'); DB.dailies = DB.dailies.filter(function(x){ return x.id !== t.dataset.id; }); save(); render(); });

/* ============ ۱۵. کانبان ============ */
var KSTATUS = [{ k: 'todo', t: 'انجام نشده' }, { k: 'doing', t: 'در حال انجام' }, { k: 'review', t: 'بازبینی' }, { k: 'done', t: 'انجام‌شده' }];
defRoute('kanban', {
  title: 'کانبان وظایف',
  sub: function(){ return fmt(DB.tasks.length) + ' وظیفه'; },
  render: function(){
    var h = '<div class="card mb"><div class="card-h"><h3>وظایف</h3><div class="sp"></div><button class="btn sm p" data-act="task-new">+ وظیفه</button></div>';
    h += '<div class="kb" style="display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto">';
    KSTATUS.forEach(function(st){
      var items = DB.tasks.filter(function(t){ return (t.status || 'todo') === st.k; });
      h += '<div class="kb-col" data-status="' + st.k + '" style="background:#eef1f5;border-radius:13px;padding:10px;min-height:200px">';
      h += '<h4 style="font-size:12.5px;margin-bottom:8px">' + st.t + ' <span class="badge b-mut">' + fmt(items.length) + '</span></h4>';
      items.forEach(function(t){
        var p = DB.projects.find(function(x){ return x.id === t.projectId; });
        h += '<div class="kb-card" style="background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line)">';
        h += '<div style="font-size:13px;font-weight:600">' + esc(t.title) + '</div>';
        h += '<div class="small muted" style="margin-top:4px">' + (t.assignee ? '👤 ' + esc(t.assignee) : '') + (p ? ' 🏗 ' + esc(p.name) : '') + (t.due ? ' 📅 ' + jStr(t.due) : '') + '</div>';
        h += '<div class="row" style="gap:4px;margin-top:6px">';
        h += '<button class="btn sm" data-act="task-edit" data-id="' + t.id + '">✎</button>';
        h += '<button class="btn sm d" data-act="task-del" data-id="' + t.id + '">×</button></div></div>';
      });
      h += '</div>';
    });
    return h + '</div></div>';
  }
});

function taskForm(t){
  t = t || {};
  return '<div class="grid g2">' +

defRoute('risks', {

  sub: function(){ return fmt(DB.risks.length) + ' ریسک'; },
  render: function(){
    var h = '<div class="card mb"><div class="card-h"><h3>ریسک‌ها</h3><div class="sp"></div><button class="btn sm p" data-act="risk-new">+ ریسک</button></div>';

      h += '<td><span class="badge ' + cls + '">' + fmt(sc) + '</span></td><td>' + esc(r.status || 'باز') + '</td>';
      h += '<td><button class="btn sm d" data-act="risk-del" data-id="' + r.id + '">×</button></td></tr>';
    });
    h += '</tbody></table></div></div>';
    h += '<div class="card"><div class="card-h"><h3>رخدادهای HSE</h3><div class="sp"></div><button class="btn sm p" data-act="hse-new">+ رخداد</button></div>';

    if(!DB.hse.length) h += '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">رخدادی ثبت نشده.</td></tr>';
    DB.hse.slice().reverse().forEach(function(e){

      h += '<tr><td class="num">' + jStr(e.date) + '</td><td>' + esc(e.type || '') + '</td>';

      h += '<td><button class="btn sm d" data-act="hse-del" data-id="' + e.id + '">×</button></td></tr>';

act('rep-csv', function(t){
  var data = DB[t.dataset.k] || [];
  if(!data.length) return toast('داده‌ای نیست', 'err');
  var keys = Object.keys(data[0]);
  var lines = [keys.join(',')];
  data.forEach(function(row){
    lines.push(keys.map(function(k){ return '"' + String(row[k] == null ? '' : row[k]).replace(/"/g, '""') + '"'; }).join(','));
  });
  var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mana-' + t.dataset.k + '-' + todayISO() + '.csv';

/* ============ FEAT-6 — ضمیمه IndexedDB ============ */
(function(){
  if(window.__block6Installed) return;
  window.__block6Installed = true;
  if(window.ManaAttach) return;

  var DB_NAME = 'mana-attach', DB_VER = 1, STORE = 'files';
  var _dbPromise = null;

  function openDb(){
    if(_dbPromise) return _dbPromise;
    _dbPromise = new Promise(function(resolve, reject){
      try{
        var rq = indexedDB.open(DB_NAME, DB_VER);
        rq.onupgradeneeded = function(e){
          var db = e.target.result;
          if(!db.objectStoreNames.contains(STORE)){
            var st = db.createObjectStore(STORE, { keyPath: 'id' });
            st.createIndex('ownerKey', 'ownerKey', { unique: false });
          }
        };
        rq.onsuccess = function(e){ resolve(e.target.result); };
        rq.onerror = function(){ reject(rq.error); };
      }catch(e){ reject(e); }
    });
    return _dbPromise;
  }

  function compress(file){
    if(!file || !file.type || file.type.indexOf('image/') !== 0) return Promise.resolve(file);
    if(file.type === 'image/gif' || file.size < 250 * 1024) return Promise.resolve(file);
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          try{
            var mx = 1600, w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            var scale = 1;
            if(w > mx || h > mx) scale = Math.min(mx / w, mx / h);
            var nw = Math.round(w * scale), nh = Math.round(h * scale);
            var cv = document.createElement('canvas');
            cv.width = nw; cv.height = nh;
            cv.getContext('2d').drawImage(img, 0, 0, nw, nh);
            cv.toBlob(function(blob){
              if(!blob){ resolve(file); return; }
              try{
                var nf = new File([blob], file.name || 'photo.jpg', { type: 'image/jpeg', lastModified: Date.now() });
                resolve(nf.size < file.size ? nf : file);
              }catch(e){ resolve(file); }
            }, 'image/jpeg', 0.82);
          }catch(e){ resolve(file); }
        };
        img.onerror = function(){ resolve(file); };
        img.src = ev.target.result;
      };
      reader.onerror = function(){ resolve(file); };
      reader.readAsDataURL(file);
    });
  }

  function save(ownerKey, file, extra){
    return compress(file).then(function(blob){
      return new Promise(function(resolve, reject){
        var fr = new FileReader();
        fr.onload = function(){
          openDb().then(function(db){
            try{
              var rec = { id: uid('att'), ownerKey: ownerKey, name: (blob && blob.name) || file.name || 'file', mime: (blob && blob.type) || file.type || 'application/octet-stream', size: (blob && blob.size) || file.size || 0, data: fr.result, t: Date.now() };
              if(extra) for(var k in extra) if(extra.hasOwnProperty(k)) rec[k] = extra[k];
              var tx = db.transaction(STORE, 'readwrite');
              tx.objectStore(STORE).put(rec);
              tx.oncomplete = function(){ resolve(rec); };
              tx.onerror = function(){ reject(tx.error); };
            }catch(e){ reject(e); }
          }).catch(reject);
        };
        fr.onerror = function(){ reject(new Error('read failed')); };
        fr.readAsDataURL(blob);
      });
    });
  }

  function byOwner(ownerKey){
    return new Promise(function(resolve, reject){
      openDb().then(function(db){
        var tx = db.transaction(STORE, 'readonly');
        var rq = tx.objectStore(STORE).index('ownerKey').getAll(ownerKey);
        rq.onsuccess = function(){
          var arr = (rq.result || []).slice().sort(function(a, b){ return (a.t || 0) - (b.t || 0); });
          resolve(arr);
        };
        rq.onerror = function(){ reject(rq.error); };
      }).catch(reject);
    });
  }

  function removeAtt(id){
    return new Promise(function(resolve, reject){
      openDb().then(function(db){
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      }).catch(reject);
    });
  }

  window.ManaAttach = {
    db: { save: save, byOwner: byOwner, remove: removeAtt },
    humanSize: function(b){
      b = Number(b) || 0;
      if(b < 1024) return b + ' B';
      if(b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(2) + ' MB';
    },
    iconFor: function(type){
      type = String(type || '');
      if(type.indexOf('image/') === 0) return '🖼';
      if(type.indexOf('pdf') > -1) return '📕';
      return '📎';
    }
  };

  function renderGallery(host, oid){
    if(!host) return;
    var key = 'daily:' + oid;
    byOwner(key).then(function(list){
      var h = '<div class="row mb"><b>📎 پیوست‌ها</b><div style="flex:1"></div>';
      h += '<button class="btn sm p" data-act="att-add" data-owner="' + esc(key) + '">+ افزودن</button></div>';
      if(!list.length){
        h += '<div class="small muted" style="padding:10px;text-align:center;background:#f8fafc;border-radius:8px;border:1px dashed var(--line)">پیوستی ثبت نشده.</div>';
      } else {
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px">';
        list.forEach(function(a){
          var thumb = (a.mime || '').indexOf('image/') === 0
            ? '<img src="' + a.data + '" style="width:100%;height:80px;object-fit:cover;border-radius:8px">'
            : '<div style="height:80px;display:grid;place-items:center;font-size:32px">' + window.ManaAttach.iconFor(a.mime) + '</div>';
          h += '<div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative">';
          h += '<a href="' + a.data + '" download="' + esc(a.name) + '" target="_blank">' + thumb + '</a>';
          h += '<div style="padding:5px 7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(a.name) + '</div>';
          h += '<div class="small muted" style="padding:0 7px 5px">' + window.ManaAttach.humanSize(a.size) + '</div>';
          h += '<button class="btn sm d" style="position:absolute;top:4px;left:4px;padding:2px 6px" data-act="att-del" data-id="' + a.id + '" data-oid="' + esc(oid) + '">×</button>';
          h += '</div>';
        });
        h += '</div>';
      }
      host.innerHTML = h;
    }).catch(function(){
      host.innerHTML = '<div class="small muted">خطا در خواندن.</div>';
    });
  }

  window.__manaRenderGallery = renderGallery;

  var _origDailyView = ACT['daily-view'];
  ACT['daily-view'] = function(t){
    var res = _origDailyView.apply(this, arguments);
    setTimeout(function(){
      var b = document.querySelector('#overlay .modal-b');
      if(!b) return;
      var host = document.createElement('div');
      host.className = 'mt';
      host.setAttribute('data-attach-host', t.dataset.id);
      b.appendChild(host);
      renderGallery(host, t.dataset.id);
    }, 100);
    return res;
  };

  act('att-add', function(t){
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*,application/pdf';
    inp.style.display = 'none';
    inp.multiple = true;
    inp.addEventListener('change', function(){
      var files = Array.prototype.slice.call(inp.files || []);
      try{ if(inp.parentNode) inp.parentNode.removeChild(inp); }catch(e){}
      if(!files.length) return;
      Promise.all(files.map(function(f){ return save(t.dataset.owner, f); })).then(function(){
        toast(files.length + ' فایل افزوده شد', 'ok');
        var oid = t.dataset.owner.replace('daily:', '');
        var host = document.querySelector('[data-attach-host="' + oid + '"]');
        if(host) renderGallery(host, oid);
      }).catch(function(e){
        toast('خطا: ' + (e && e.message || e), 'err');
      });
    }, { once: true });
    document.body.appendChild(inp);
    inp.click();
    setTimeout(function(){ try{ if(inp.parentNode) inp.parentNode.removeChild(inp); }catch(e){} }, 60000);
  });

  act('att-del', function(t){
    if(!confirm('حذف این ضمیمه؟')) return;
    removeAtt(t.dataset.id).then(function(){
      toast('حذف شد', 'ok');
      var oid = t.dataset.oid;
      var host = document.querySelector('[data-attach-host="' + oid + '"]');
      if(host) renderGallery(host, oid);
    });
  });

  console.log('%c[FEAT-6 ATTACH] ok', 'color:#2fa88f;font-weight:bold');
})();

/* ============ FEAT-7 — دوربین + GPS ============ */
(function(){
  if(window.__block7Installed) return;
  window.__block7Installed = true;

  function getGPS(){
    return new Promise(function(resolve){
      if(!navigator.geolocation) return resolve(null);
      var done = false;
      var timer = setTimeout(function(){ if(!done){ done = true; resolve(null); } }, 8000);
      try{
        navigator.geolocation.getCurrentPosition(
          function(pos){ if(done) return; done = true; clearTimeout(timer); resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }); },
          function(err){ if(done) return; done = true; clearTimeout(timer); if(err && err.code === 1) toast('دسترسی GPS رد شد', 'err'); resolve(null); },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      }catch(e){ if(!done){ done = true; clearTimeout(timer); resolve(null); } }
    });
  }

  function camSnap(oid, ownerKey){
    if(!window.ManaAttach) return toast('ماژول ضمیمه نصب نیست', 'err');
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    try{ inp.capture = 'environment'; }catch(e){}
    inp.style.display = 'none';
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0];
      try{ if(inp.parentNode) inp.parentNode.removeChild(inp); }catch(e){}
      if(!f) return;
      toast('در حال ذخیره عکس...');
      getGPS().then(function(gps){
        var rec = { t: Date.now() };
        if(gps) rec.gps = gps;
        window.ManaAttach.db.save(ownerKey, f, rec).then(function(){
          toast('عکس ذخیره شد' + (gps ? ' 📍' : ''), 'ok');
          var host = document.querySelector('[data-attach-host="' + oid + '"]');
          if(host && window.__manaRenderGallery) window.__manaRenderGallery(host, oid);
        }).catch(function(e){
          toast('خطا: ' + (e && e.message || e), 'err');
        });
      });
    }, { once: true });
    document.body.appendChild(inp);
    inp.click();
    setTimeout(function(){ try{ if(inp.parentNode) inp.parentNode.removeChild(inp); }catch(e){} }, 60000);
  }

  act('cam-snap', function(t){
    var oid = t.dataset.oid;
    if(!oid) return toast('شناسه نامعتبر', 'err');
    camSnap(oid, 'daily:' + oid);
  });

  var _origDailyView2 = ACT['daily-view'];
  ACT['daily-view'] = function(t){
    var res = _origDailyView2.apply(this, arguments);
    setTimeout(function(){
      var host = document.querySelector('[data-attach-host="' + t.dataset.id + '"]');
      if(!host) return;
      var bar = host.querySelector('.row');
      if(!bar || bar.querySelector('[data-act="cam-snap"]')) return;
      var cb = document.createElement('button');
      cb.className = 'btn sm';
      cb.type = 'button';
      cb.setAttribute('data-act', 'cam-snap');
      cb.dataset.oid = t.dataset.id;
      cb.textContent = '📷 دوربین';
      bar.appendChild(cb);
    }, 150);
    return res;
  };

  console.log('%c[FEAT-7 CAMERA] ok', 'color:#2fa88f;font-weight:bold');
})();

(function(){

      if(!raw) return null;

  }

(function(){
  if(window.__block22Installed) return;
  window.__block22Installed = true;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return console.log('VOICE: پشتیبانی نمی‌شود');

  var rec = null, busy = false;
  var CMDS = [
    { re: /(صورت\s?وضعیت|فاکتور)\s?(جدید|بساز)/, act: 'inv-new' },
    { re: /(چک)\s?(جدید|بساز)/, act: 'chk-new', hash: '#/checks' },
    { re: /(وظیفه)\s?(جدید|بساز)/, act: 'task-new', hash: '#/kanban' },
    { re: /(پروژه)\s?(جدید|بساز)/, act: 'prj-new', hash: '#/projects' },
    { re: /برو\s+به\s+(داشبورد|خانه)/, hash: '#/dashboard' },
    { re: /برو\s+به\s+(پروژه)/, hash: '#/projects' },
    { re: /برو\s+به\s+(مالی|فاکتور|صورت)/, hash: '#/invoices' },
    { re: /برو\s+به\s+(چک)/, hash: '#/checks' },
    { re: /برو\s+به\s+(کانبان|وظایف)/, hash: '#/kanban' },
    { re: /برو\s+به\s+(تنخواه)/, hash: '#/pettycash' },
    { re: /برو\s+به\s+(پرسنل)/, hash: '#/equipment' },
    { re: /حالت\s+(تاریک|شب)/, fn: function(){ if(window.__manaToggleTheme) window.__manaToggleTheme(); } },
    { re: /واگرد/, fn: function(){ if(window.undo) window.undo(); } },
    { re: /ذخیره/, fn: function(){ save(true); toast('ذخیره شد', 'ok'); } }
  ];

  function match(text){
    text = String(text || '').trim();
    if(!text) return;
    for(var i = 0; i < CMDS.length; i++){
      if(CMDS[i].re.test(text)){
        var c = CMDS[i];
        if(c.hash) location.hash = c.hash;
        if(c.act) setTimeout(function(){ if(ACT[c.act]) ACT[c.act]({ dataset: {} }); }, 300);
        if(c.fn) try{ c.fn(); }catch(e){}
        toast('🎙 دستور اجرا شد', 'ok');
        return;
      }
    }
    toast('🎙 نامشخص', 'err');
  }

  function start(){
    if(busy) return;
    try{
      rec = new SR();
      rec.lang = 'fa-IR';
      rec.continuous = false;
      rec.onstart = function(){ busy = true; toast('🎙 در حال شنیدن...', 'ok'); };
      rec.onresult = function(ev){ try{ match(ev.results[0][0].transcript); }catch(e){} };
      rec.onerror = function(ev){ toast('خطا: ' + (ev.error || ''), 'err'); };
      rec.onend = function(){ busy = false; };
      rec.start();
    } catch(e){ busy = false; toast('شروع ناموفق', 'err'); }
  }

  window.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key || '').toLowerCase() === 'v'){
      e.preventDefault();
      start();
    }
  });

  console.log('%c[FEAT-22 VOICE] ok', 'color:#2fa88f;font-weight:bold');
})();

/* ============ FEAT-23 — اسکن QR ============ */
(function(){
  if(window.__block23Installed) return;
  window.__block23Installed = true;

  var BD = window.BarcodeDetector || null;
  if(!BD) return console.log('QR: BarcodeDetector پشتیبانی نمی‌شود');

  act('qr-scan', function(){
    var h = '<div style="text-align:center"><div class="small muted mb">دوربین را به QR بگیرید...</div>';
    h += '<video id="qrVideo" style="width:100%;max-width:400px;border-radius:12px;background:#000" autoplay playsinline></video>';
    h += '<div id="qrRes" class="mt small muted">در انتظار...</div></div>';
    modal('اسکن QR', h, '<button class="btn" data-act="close-modal">بستن</button>', 'wide');
    var video = document.getElementById('qrVideo');
    var res = document.getElementById('qrRes');
    var stream = null, stopped = false;
    var det = null;
    try{ det = new BD({ formats: ['qr_code'] }); }catch(e){ try{ det = new BD(); }catch(e2){} }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(s){
      stream = s;
      video.srcObject = s;
      video.play();
      var loop = function(){
        if(stopped) return;
        if(det && video.readyState === video.HAVE_ENOUGH_DATA){
          det.detect(video).then(function(codes){
            if(codes && codes.length){
              var txt = codes[0].rawValue;
              if(res) res.innerHTML = '<b>' + esc(txt) + '</b>';
              var m = /^MANA\|([^|]+)\|(.+)$/.exec(txt);
              if(m){
                stopped = true;
                try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
                toast('اسکن موفق — ' + m[1], 'ok');
                closeModal();
                setTimeout(function(){
                  var map = { invoice: ['invoices','inv-view'], check: ['checks','chk-status'], letter: ['letters','letter-view'], inspection: ['inspections','insp-view'], ncr: ['ncrs','ncr-view'], minutes: ['minutes','min-view'], project: ['projects','prj-edit'], daily: ['daily','daily-view'] };
                  var info = map[m[1]];
                  if(info){
                    location.hash = '#/' + info[0];
                    setTimeout(function(){ if(ACT[info[1]]) ACT[info[1]]({ dataset: { id: m[2] } }); }, 300);
                  }
                }, 200);
              }
            }
            if(!stopped) setTimeout(loop, 500);
          }).catch(function(){ if(!stopped) setTimeout(loop, 800); });
        } else {
          if(!stopped) setTimeout(loop, 500);
        }
      };
      loop();
    }).catch(function(err){
      if(res) res.innerHTML = '<span class="badge b-bad">خطا: ' + esc(err.message || '') + '</span>';
    });
    if(window.__modalCleanups){
      window.__modalCleanups.push(function(){
        stopped = true;
        try{ if(stream) stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      });
    }
  });

  console.log('%c[FEAT-23 QR] ok', 'color:#2fa88f;font-weight:bold');
})();

/* ============ FEAT-32 — امضای دیجیتال ============ */
(function(){
  if(window.__block32Installed) return;
  window.__block32Installed = true;

  if(!Array.isArray(DB.signatures)) DB.signatures = [];

  window.ManaSignature = {
    /* باز کردن پد امضا — برمی‌گرداند Promise که resolve می‌شه با dataURL */
    open: function(title){
      return new Promise(function(resolve){
        var h = '<div style="text-align:center">';
        h += '<div class="small muted mb">امضای خود را در کادر زیر بکشید</div>';
        h += '<canvas id="sigPad" width="500" height="200" style="border:2px dashed var(--line);border-radius:12px;background:#fff;width:100%;max-width:500px;touch-action:none;cursor:crosshair"></canvas>';
        h += '<div class="row mt" style="justify-content:center">';
        h += '<button class="btn sm" type="button" data-act="sig-clear">پاک‌کردن</button>';
        h += '<button class="btn sm p" type="button" data-act="sig-save">تأیید و ذخیره</button>';
        h += '</div></div>';
        modal(title || 'امضای دیجیتال', h,
          '<button class="btn" data-act="sig-cancel">انصراف</button>');

        setTimeout(function(){
          var cvs = document.getElementById('sigPad');
          if(!cvs) return;
          var ctx = cvs.getContext('2d');
          var drawing = false;
          var hasContent = false;
          ctx.strokeStyle = '#1c2530';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          function pos(e){
            var r = cvs.getBoundingClientRect();
            var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
            var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
            return { x: cx * (cvs.width / r.width), y: cy * (cvs.height / r.height) };
          }

          function start(e){
            e.preventDefault();
            drawing = true;
            var p = pos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
          }
          function move(e){
            if(!drawing) return;
            e.preventDefault();
            var p = pos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            hasContent = true;
          }
          function end(){ drawing = false; }

          cvs.addEventListener('mousedown', start);
          cvs.addEventListener('mousemove', move);
          window.addEventListener('mouseup', end);
          cvs.addEventListener('touchstart', start, { passive: false });
          cvs.addEventListener('touchmove', move, { passive: false });
          cvs.addEventListener('touchend', end);

          window.__sigHasContent = function(){ return hasContent; };
          window.__sigClear = function(){
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            hasContent = false;
          };
          window.__sigData = function(){ return cvs.toDataURL('image/png'); };
        }, 80);

        act['sig-clear'] = function(){ if(window.__sigClear) window.__sigClear(); };
        act['sig-save'] = function(){
          if(!window.__sigHasContent || !window.__sigHasContent()){
            return toast('امضا خالی است', 'err');
          }
          var data = window.__sigData();
          closeModal();
          resolve({ ok: true, data: data, date: todayISO() });
        };
        act['sig-cancel'] = function(){
          closeModal();
          resolve({ ok: false });
        };
      });
    },
    /* ذخیره امضا برای یک موجودیت */
    save: function(entityType, entityId, label, data){
      pushUndo('sig-save');
      DB.signatures.push({
        id: uid('sig'),
        entityType: entityType,
        entityId: entityId,
        label: label || 'امضا',
        data: data,
        date: todayISO(),
        t: Date.now()
      });
      save();
    },
    /* لیست امضاها */
    list: function(entityType, entityId){
      return DB.signatures.filter(function(s){
        return s.entityType === entityType && s.entityId === entityId;
      }).sort(function(a, b){ return b.t - a.t; });
    },
    /* رندر بلوک امضاها */
    render: function(entityType, entityId){
      var list = window.ManaSignature.list(entityType, entityId);
      var h = '<div class="card mt" style="box-shadow:none;border:1px solid var(--line)">';
      h += '<div class="row mb" style="justify-content:space-between">';
      h += '<b>✍️ امضاها (' + fmt(list.length) + ')</b>';
      h += '<button class="btn sm p" data-act="sig-add" data-etype="' + entityType + '" data-eid="' + entityId + '">+ امضا</button>';
      h += '</div>';
      if(!list.length){
        h += '<div class="small muted">امضایی ثبت نشده.</div>';
      } else {
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">';
        list.forEach(function(s){
          h += '<div style="border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff">';
          h += '<div class="small muted">' + esc(s.label) + '</div>';
          h += '<img src="' + s.data + '" style="width:100%;height:60px;object-fit:contain;border:1px solid #eee;border-radius:6px;margin:5px 0">';
          h += '<div class="small muted">' + jStr(s.date, true) + '</div>';
          h += '<button class="btn sm d" style="margin-top:5px;width:100%" data-act="sig-del" data-id="' + s.id + '">حذف</button>';
          h += '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
      return h;
    }
  };

  act('sig-add', function(t){
    window.ManaSignature.open('امضای جدید').then(function(res){
      if(!res.ok) return;
      var label = prompt('عنوان امضا:', 'امضای مدیر');
      if(!label) return;
      window.ManaSignature.save(t.dataset.etype, t.dataset.eid, label, res.data);
      toast('امضا ثبت شد', 'ok');
      /* re-render */
      var host = document.querySelector('[data-sig-host="' + t.dataset.etype + '_' + t.dataset.eid + '"]');
      if(host){
        host.innerHTML = window.ManaSignature.render(t.dataset.etype, t.dataset.eid);
      }
    });
  });

  act('sig-del', function(t){
    pushUndo('sig-del');
    DB.signatures = DB.signatures.filter(function(x){ return x.id !== t.dataset.id; });
    save();
    toast('حذف شد', 'ok');
    /* re-render ساده */
    var btn = document.querySelector('[data-act="sig-del"][data-id="' + t.dataset.id + '"]');
    if(btn){
      var host = btn.closest('.card');
      if(host) host.remove();
    }
  });

  console.log('%c[FEAT-32 SIGNATURE] ok', 'color:#2fa88f;font-weight:bold');
})();

/* ============ FEAT-33 — گزارش سامانه مودیان ============ */
(function(){
  if(window.__block33Installed) return;
  window.__block33Installed = true;

  window.ManaMoadian = {
    /* خروجی CSV برای سامانه مودیان */
    exportCsv: function(){
      var invoices = DB.invoices || [];
      if(!invoices.length) return toast('صورت‌وضعیتی نیست', 'err');
      /* فرمت ساده‌ی مودیان: شماره، تاریخ، طرف، مبلغ، مالیات، ارزش افزوده */
      var lines = ['شماره_سند,تاریخ_میلادی,پروژه,طرف_حساب,مبلغ_کل,مالیات,ارزش_افزوده,جمع_نهایی,کد_اقتصادی'];
      invoices.forEach(function(inv){
        var c = invoiceCalc(inv);
        var p = DB.projects.find(function(x){ return x.id === inv.projectId; }) || {};
        var ecoCode = (p.client || '').replace(/[^0-9]/g, '');
        lines.push([
          inv.no || '',
          inv.date || '',
          p.name || '',
          p.client || '',
          Math.round(c.gross),
          Math.round(c.tax),
          Math.round(c.vat),
          Math.round(c.net),
          ecoCode
        ].join(','));
      });
      var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'moadian-' + todayISO() + '.csv';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      toast('فایل CSV دانلود شد', 'ok');
    },
    /* خروجی XML برای مودیان (ساده‌شده) */
    exportXml: function(){
      var invoices = DB.invoices || [];
      if(!invoices.length) return toast('صورت‌وضعیتی نیست', 'err');
      var xml = '<?xml version="1.0" encoding="UTF-8"?>\n<Invoices>\n';
      invoices.forEach(function(inv){
        var c = invoiceCalc(inv);
        var p = DB.projects.find(function(x){ return x.id === inv.projectId; }) || {};
        xml += '  <Invoice>\n';
        xml += '    <Number>' + (inv.no || '') + '</Number>\n';
        xml += '    <Date>' + (inv.date || '') + '</Date>\n';
        xml += '    <Customer>' + esc(p.client || '') + '</Customer>\n';
        xml += '    <Amount>' + Math.round(c.gross) + '</Amount>\n';
        xml += '    <Tax>' + Math.round(c.tax) + '</Tax>\n';
        xml += '    <VAT>' + Math.round(c.vat) + '</VAT>\n';
        xml += '    <Total>' + Math.round(c.net) + '</Total>\n';
        xml += '  </Invoice>\n';
      });
      xml += '</Invoices>';
      var blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'moadian-' + todayISO() + '.xml';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      toast('فایل XML دانلود شد', 'ok');
    },
    /* گزارش خلاصه */
    summary: function(){
      var invoices = DB.invoices || [];
      var totalGross = 0, totalTax = 0, totalVat = 0, totalNet = 0;
      invoices.forEach(function(inv){
        var c = invoiceCalc(inv);
        totalGross += c.gross;
        totalTax += c.tax;
        totalVat += c.vat;
        totalNet += c.net;
      });
      return { count: invoices.length, gross: totalGross, tax: totalTax, vat: totalVat, net: totalNet };
    }
  };

  defRoute('moadian', {
    title: 'گزارش سامانه مودیان',
    sub: function(){ return 'خروجی مالیاتی'; },
    render: function(){
      var s = window.ManaMoadian.summary();
      var h = '<div class="grid g4 mb">';

      h += '<div class="kpi k-info"><div class="lbl">مبلغ کل</div><div class="val">' + money(s.gross) + '</div></div>';
      h += '<div class="kpi k-warn"><div class="lbl">مالیات</div><div class="val">' + money(s.tax) + '</div></div>';
      h += '<div class="kpi k-ok"><div class="lbl">جمع با ارزش افزوده</div><div class="val">' + money(s.net) + '</div></div>';
      h += '</div>';
      h += '<div class="card"><div class="card-h"><h3>خروجی‌ها</h3></div>';
      h += '<div class="row mb">';
      h += '<button class="btn p" data-act="md-csv">⬇ خروجی CSV</button>';
      h += '<button class="btn p" data-act="md-xml">⬇ خروجی XML</button>';
      h += '</div>';
      h += '<div class="small muted">CSV برای بارگذاری در سامانه مودیان. XML قالب استاندارد ساده‌شده. برای استفاده رسمی، با حسابدار خود مشورت کنید.</div>';
      h += '</div>';
      h += '<div class="card mt"><div class="card-h"><h3>فهرست صورت‌وضعیت‌ها</h3></div>';
      h += '<div class="tbl-wrap"><table><thead><tr><th>شماره</th><th>تاریخ</th><th>طرف</th><th>مبلغ کل</th><th>مالیات</th><th>جمع</th></tr></thead><tbody>';
      if(!DB.invoices.length) h += '<tr><td colspan="6" class="muted" style="text-align:center;padding:20px">صورت‌وضعیتی ثبت نشده.</td></tr>';
      DB.invoices.slice().reverse().forEach(function(inv){
        var c = invoiceCalc(inv);
        var p = DB.projects.find(function(x){ return x.id === inv.projectId; }) || {};
        h += '<tr><td class="num">' + esc(inv.no || '—') + '</td>';
        h += '<td class="num">' + jStr(inv.date) + '</td>';

        h += '<td class="num"><b>' + money(c.net) + '</b></td></tr>';
      });

  console.log('%c[FEAT-33 MOADIAN] ok', 'color:#2fa88f;font-weight:bold');
})();

/* ============ FEAT-34 — محاسبه بیمه تامین اجتماعی ============ */
(function(){
  if(window.__block34Installed) return;
  window.__block34Installed = true;

  /* نرخ‌های بیمه ایران (سال ۱۴۰۳) */
  var RATES = {
    employer: 20,
    employee: 7,
    government: 3,
    total: 30
  };

  window.ManaInsurance = {
    /* محاسبه برای یک نفر */
    calculate: function(person, grossWage){
      grossWage = num(grossWage);
      return {
        gross: grossWage,
        employer: grossWage * RATES.employer / 100,
        employee: grossWage * RATES.employee / 100,
        government: grossWage * RATES.government / 100,
        total: grossWage * RATES.total / 100,
        net: grossWage - (grossWage * RATES.employee / 100)
      };
    },
    /* محاسبه برای همه پرسنل */
    calculateAll: function(month){
      var result = [];
      var totalEmployer = 0, totalEmployee = 0, totalGov = 0, totalGross = 0;
      DB.personnel.filter(function(p){ return p.active !== false; }).forEach(function(p){
        var gross = 0;
        if(p.wageType === 'monthly'){
          gross = num(p.salary);
        } else {
          /* برای روزمزد و پیمانکاری، مجموع روزهای حضور × دستمزد */
          var records = DB.attendance.filter(function(a){ return a.personId === p.id; });
          var days = records.length;
          gross = num(p.salary) * days;
        }
        var calc = window.ManaInsurance.calculate(p, gross);
        totalEmployer += calc.employer;
        totalEmployee += calc.employee;
        totalGov += calc.government;
        totalGross += calc.gross;
        result.push({ person: p, calc: calc });
      });
      return {
        rows: result,
        totals: { gross: totalGross, employer: totalEmployer, employee: totalEmployee, government: totalGov, total: totalEmployer + totalEmployee + totalGov }
      };
    }
  };

  defRoute('insurance', {
    title: 'بیمه تامین اجتماعی',
    sub: function(){ return 'محاسبه و گزارش'; },
    render: function(){
      var data = window.ManaInsurance.calculateAll();
      var h = '<div class="grid g4 mb">';
      h += '<div class="kpi k-info"><div class="lbl">جمع دستمزد</div><div class="val">' + money(data.totals.gross) + '</div></div>';
      h += '<div class="kpi k-warn"><div class="lbl">سهم کارفرما (۲۰٪)</div><div class="val">' + money(data.totals.employer) + '</div></div>';
      h += '<div class="kpi k-warn"><div class="lbl">سهم کارگر (۷٪)</div><div class="val">' + money(data.totals.employee) + '</div></div>';
      h += '<div class="kpi k-bad"><div class="lbl">جمع کل بیمه</div><div class="val">' + money(data.totals.total) + '</div></div>';
      h += '</div>';
      h += '<div class="card"><div class="card-h"><h3>ریز محاسبه</h3><div class="sp"></div>';
      h += '<button class="btn sm p" data-act="ins-csv">⬇ CSV</button>';
      h += '</div>';
      h += '<div class="tbl-wrap"><table><thead><tr>';
      h += '<th>نام</th><th>نوع دستمزد</th><th>دستمزد ناخالص</th><th>کارفرما</th><th>کارگر</th><th>دولت</th><th>خالص کارگر</th>';
      h += '</tr></thead><tbody>';
      if(!data.rows.length) h += '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">پرسنلی ثبت نشده.</td></tr>';
      data.rows.forEach(function(r){
        h += '<tr><td><b>' + esc(r.person.name) + '</b></td>';
        h += '<td>' + (WT[r.person.wageType] || '—') + '</td>';
        h += '<td class="num">' + money(r.calc.gross) + '</td>';

/* ============================================================

'use strict';

/* ============ FEAT-36 — نمودار Donut ============ */
(function(){
  if(window.__block36Installed) return;
  window.__block36Installed = true;

  window.ManaCharts = window.ManaCharts || {};

  window.ManaCharts.donut = function(items, opt){
    opt = opt || {};
    var W = opt.w || 340, H = opt.h || 260;
    var cx = W / 2, cy = H / 2;
    var rOuter = Math.min(W, H) * 0.38;
    var rInner = rOuter * 0.58;
    var total = 0;
    for(var i = 0; i < items.length; i++) total += Number(items[i].v) || 0;
    if(!total) return '<div class="muted small" style="padding:18px;text-align:center">داده‌ای نیست</div>';
    var startAngle = -Math.PI / 2;
    var paths = '';
    var legend = '';
    for(var j = 0; j < items.length; j++){
      var it = items[j];
      var v = Number(it.v) || 0;
      if(v <= 0) continue;
      var angle = (v / total) * Math.PI * 2;
      var endAngle = startAngle + angle;
      var largeArc = angle > Math.PI ? 1 : 0;
      var x1 = cx + rOuter * Math.cos(startAngle);
      var y1 = cy + rOuter * Math.sin(startAngle);
      var x2 = cx + rOuter * Math.cos(endAngle);
      var y2 = cy + rOuter * Math.sin(endAngle);
      var x3 = cx + rInner * Math.cos(endAngle);
      var y3 = cy + rInner * Math.sin(endAngle);
      var x4 = cx + rInner * Math.cos(startAngle);
      var y4 = cy + rInner * Math.sin(startAngle);
      var color = it.c || '#0F5C4E';
      var d = 'M' + x1 + ',' + y1 + ' A' + rOuter + ',' + rOuter + ' 0 ' + largeArc + ' 1 ' + x2 + ',' + y2 +
              ' L' + x3 + ',' + y3 + ' A' + rInner + ',' + rInner + ' 0 ' + largeArc + ' 0 ' + x4 + ',' + y4 + ' Z';
      paths += '<path d="' + d + '" fill="' + color + '"><title>' + esc(it.l) + ': ' + fmt(v) + ' (' + pct(v / total * 100, 1) + ')</title></path>';
      legend += '<span><i style="background:' + color + '"></i>' + esc(it.l) + ' — ' + pct(v / total * 100, 0) + '</span>';
      startAngle = endAngle;
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" style="max-width:400px;margin:auto;display:block">' + paths + '</svg>' +
           '<div class="legend" style="justify-content:center">' + legend + '</div>';
  };

  window.ManaCharts.downloadSVG = function(svg, name){
    try{
      var s = new XMLSerializer().serializeToString(svg);
      var blob = new Blob([s], { type: 'image/svg+xml' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (name || 'chart') + '.svg';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
    }catch(e){ toast('دانلود ناموفق', 'err'); }
  };

  window.ManaCharts.downloadPNG = function(svg, name){
    try{
      var s = new XMLSerializer().serializeToString(svg);
      var blob = new Blob([s], { type: 'image/svg+xml' });
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        try{
          var cv = document.createElement('canvas');
          cv.width = svg.viewBox.baseVal.width || 800;
          cv.height = svg.viewBox.baseVal.height || 400;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          cv.toBlob(function(b){
            var u2 = URL.createObjectURL(b);
            var a = document.createElement('a');
            a.href = u2;
            a.download = (name || 'chart') + '.png';
            document.body.appendChild(a);
            a.click();
            setTimeout(function(){ URL.revokeObjectURL(u2); a.remove(); }, 400);
          }, 'image/png');
        }catch(e){ toast('تبدیل ناموفق', 'err'); }
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }catch(e){ toast('دانلود ناموفق', 'err'); }
  };

  /* افزودن Donut به داشبورد — کنار گرید KPI */
  var _origDashRender = ROUTES.dashboard.render;
  ROUTES.dashboard.render = function(){
    var h = _origDashRender.apply(this, arguments);
    try{
      var projects = DB.projects.length;
      var tasks = DB.tasks.length;
      var invoices = DB.invoices.length;
      var checks = DB.checks.length;
      var total = projects + tasks + invoices + checks;
      if(total > 0){
        var items = [
          { l: 'پروژه‌ها', v: projects, c: '#0F5C4E' },
          { l: 'وظایف', v: tasks, c: '#2D7DD2' },
          { l: 'صورت‌وضعیت', v: invoices, c: '#C9A227' },
          { l: 'چک‌ها', v: checks, c: '#C0392B' }
        ];
        h += '<div class="card mt"><div class="card-h"><h3>📊 توزیع داده‌ها</h3></div>' + window.ManaCharts.donut(items) + '</div>';
      }
    }catch(e){}
    return h;
  };

  console.log('%c[FEAT-36 DONUT] ok', 'color:#2fa88f;font-weight:bold');
})();

/* ============ FEAT-37 — Gantt تعاملی ============ */
(function(){
  if(window.__block37Installed) return;
  window.__block37Installed = true;

  defRoute('gantt', {
    title: 'گانت تعاملی',
    sub: function(){ return 'Drag برای تغییر تاریخ'; },
    render: function(){
      if(!DB.projects.length) return '<div class="card">ابتدا پروژه تعریف کنید.</div>';
      var p = DB.projects.find(function(x){ return x.id === currentProjectId(); }) || DB.projects[0];
      var res = computeCPM(p.activities || []);
      if(res.error) return '<div class="card"><span class="badge b-bad">' + esc(res.error) + '</span></div>';

      var h = '<div class="card mb"><div class="card-h">';
      h += '<label class="f" style="margin:0;min-width:220px"><span>پروژه</span><select data-act-change="gantt-prj">';
      DB.projects.forEach(function(x){
        h += '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
      });
      h += '</select></label><div class="sp"></div>';
      h += '<span class="badge b-pr">مدت: ' + fmt(res.duration) + ' روز</span>';
      h += '<button class="btn sm p" data-act="gantt-edit" data-id="' + p.id + '">ویرایش فعالیت‌ها</button>';
      h += '</div></div>';

      var A = res.activities;
      var total = Math.max(res.duration, 1);
      var dayW = Math.max(6, Math.min(30, 900 / total));
      var W = Math.max(900, total * dayW);

      h += '<div class="card"><div class="card-h"><h3>گانت</h3>';
      h += '<span class="legend" style="margin-inline-start:12px">';
      h += '<span><i style="background:#C0392B"></i>بحرانی</span>';
      h += '<span><i style="background:#0F5C4E"></i>عادی</span>';
      h += '<span><i style="background:#C9A227"></i>امروز</span>';
      h += '</span></div>';
      h += '<div style="overflow:auto;border:1px solid var(--line);border-radius:10px">';
      h += '<table style="min-width:' + (W + 260) + 'px;width:100%;border-collapse:collapse">';
      h += '<thead><tr><th style="width:260px;position:sticky;right:0;background:#f8fafc;z-index:3;border-bottom:1px solid var(--line);text-align:right;padding:8px">فعالیت</th>';
      var step = Math.max(1, Math.ceil(total / 20));
      for(var d = 0; d < total; d += step){
        h += '<th style="width:' + (dayW * step) + 'px;text-align:center;font-size:10px;padding:4px 0;background:#f8fafc">' + fmt(d + 1) + '</th>';
      }
      h += '</tr></thead><tbody>';

      var todayOffset = daysBetween(p.start || todayISO(), todayISO());

      A.forEach(function(a){
        h += '<tr style="height:36px">';
        h += '<td style="position:sticky;right:0;background:#fff;z-index:2;border-bottom:1px solid var(--line);padding:6px 8px;font-size:12px">' + esc(a.name) + '</td>';
        h += '<td colspan="999" style="position:relative;border-bottom:1px solid var(--line);padding:0;height:36px">';
        var left = a.ES * dayW;
        var w = Math.max(a.dur * dayW, 8);
        var barClass = a.critical ? 'b-bad' : 'b-pr';
        h += '<div style="position:absolute;top:8px;right:' + left + 'px;width:' + w + 'px;height:20px;border-radius:5px;background:' + (a.critical ? 'linear-gradient(90deg,#e06a5c,#C0392B)' : 'linear-gradient(90deg,#2f9078,#0F5C4E)') + ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;cursor:pointer" title="' + esc(a.name) + ' — شروع: ' + jStr(addDays(p.start || todayISO(), a.ES)) + '، پایان: ' + jStr(addDays(p.start || todayISO(), a.EF)) + '">' + fmt(a.dur) + '</div>';
        /* خط امروز */
        if(todayOffset >= 0 && todayOffset <= total){
          h += '<div style="position:absolute;top:0;bottom:0;right:' + (todayOffset * dayW) + 'px;width:2px;background:#C9A227;opacity:.9;pointer-events:none"></div>';
        }
        h += '</td></tr>';
      });

      h += '</tbody></table></div></div>';
      return h;
    }
  });

  window.addEventListener('change', function(e){
    var el = e.target.closest('[data-act-change]');
    if(!el) return;
    if(el.dataset.actChange === 'gantt-prj') location.hash = '#/gantt?id=' + el.value;
  });

  act('gantt-edit', function(t){ act['prj-act']({ dataset: { id: t.dataset.id } }); });

(function(){
  if(window.__block40Installed) return;
  window.__block40Installed = true;

  window.ManaNotify = {
    /* ساخت لیست اعلان‌ها */
    get: function(){
      var out = [];
      var today = todayISO();

      /* چک‌های نزدیک سرسید (۷ روز) */
      DB.checks.filter(function(c){
        if(c.status !== 'pending_holder' && c.status !== 'pending_bank') return false;
        var d = daysBetween(today, c.due);
        return d >= 0 && d <= 7;
      }).forEach(function(c){
        var d = daysBetween(today, c.due);
        out.push({
          type: 'check',
          cls: 'b-warn',
          icon: '💳',
          title: 'چک ' + (c.no || '') + ' — ' + money(c.amount),
          sub: 'سرسید: ' + jStr(c.due, true) + ' (' + fmt(d) + ' روز)',
          action: { hash: '#/checks' }
        });
      });

      /* چک‌های معوق */
      DB.checks.filter(function(c){
        if(c.status === 'cleared' || c.status === 'bounced') return false;
        return c.due < today;
      }).forEach(function(c){
        out.push({
          type: 'check-overdue',
          cls: 'b-bad',
          icon: '⏰',
          title: 'چک معوق ' + (c.no || ''),
          sub: 'سرسید: ' + jStr(c.due, true),
          action: { hash: '#/checks' }
        });
      });

      /* مطالبات معوق */
      DB.invoices.forEach(function(inv){
        var c = invoiceCalc(inv);
        var paid = invoicePaid(inv);
        var rem = c.net - paid;
        if(rem <= 0.5) return;
        var due = addDays(inv.date, DB.settings.terms);
        if(due < today){
          var days = daysBetween(due, today);
          out.push({
            type: 'invoice-overdue',
            cls: 'b-bad',
            icon: '🧾',
            title: 'صورت‌وضعیت معوق ' + (inv.no || ''),
            sub: money(rem) + ' — ' + fmt(days) + ' روز تأخیر',
            action: { hash: '#/aging' }
          });
        }
      });

      /* اقلام زیر نقطه سفارش */
      DB.items.filter(function(i){ return num(i.qty) <= num(i.min); }).forEach(function(i){
        out.push({
          type: 'low-stock',
          cls: 'b-warn',
          icon: '📦',
          title: 'موجودی کم: ' + i.name,
          sub: fmt(i.qty) + ' ' + (i.unit || '') + ' (حداقل: ' + fmt(i.min) + ')',
          action: { hash: '#/inventory' }
        });
      });

      /* ریسک‌های بحرانی */
      DB.risks.filter(function(r){ return r.status !== 'بسته' && (num(r.prob) * num(r.impact)) >= 15; }).forEach(function(r){
        out.push({
          type: 'risk',
          cls: 'b-bad',
          icon: '⚠️',
          title: 'ریسک بحرانی: ' + r.title,
          sub: 'امتیاز: ' + fmt(num(r.prob) * num(r.impact)),
          action: { hash: '#/risks' }
        });
      });

      /* وظایف عقب‌افتاده */
      DB.tasks.filter(function(t){
        if(t.status === 'done') return false;
        return t.due && t.due < today;
      }).forEach(function(t){
        out.push({
          type: 'task-overdue',
          cls: 'b-warn',
          icon: '🗂',
          title: 'وظیفه عقب‌افتاده: ' + t.title,
          sub: 'سرسید: ' + jStr(t.due, true),
          action: { hash: '#/kanban' }
        });
      });

      /* عدم گزارش روزانه */
      var todayDaily = DB.dailies.filter(function(d){ return d.date === today; });
      if(!todayDaily.length && DB.projects.length){
        out.push({
          type: 'no-daily',
          cls: 'b-mut',
          icon: '📝',
          title: 'گزارش روزانه امروز ثبت نشده',
          sub: jStr(today, true),
          action: { hash: '#/daily' }
        });
      }

      return out;
    },
    /* تعداد اعلان‌ها */
    count: function(){ return window.ManaNotify.get().length; }
  };

  /* افزودن زنگ به نوار بالا */
  function mountBell(){

  act('notif-open', function(){
    var list = window.ManaNotify.get();
    var h = '';
    if(!list.length){
      h = '<div class="card" style="text-align:center;padding:30px;background:var(--primary-50)"><div style="font-size:40px">🎉</div><div class="mt"><b>همه‌چیز مرتبه!</b></div><div class="small muted mt">اعلان جدیدی نیست.</div></div>';
    } else {
      h = '<div class="small muted mb">' + fmt(list.length) + ' اعلان</div>';
      h += '<div style="max-height:60vh;overflow:auto">';
      list.forEach(function(n, i){
        h += '<div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:8px;cursor:pointer" data-notif-go="' + (n.action.hash || '') + '">';
        h += '<div class="row"><span style="font-size:20px">' + n.icon + '</span>';
        h += '<div style="flex:1"><div style="font-weight:600;font-size:13.5px">' + esc(n.title) + '</div>';
        h += '<div class="small muted" style="margin-top:2px">' + esc(n.sub) + '</div></div>';
        h += '<span class="badge ' + n.cls + '">' + (n.type === 'check' ? 'چک' : n.type === 'check-overdue' ? 'معوق' : n.type === 'invoice-overdue' ? 'مطالبه' : n.type === 'low-stock' ? 'انبار' : n.type === 'risk' ? 'ریسک' : n.type === 'task-overdue' ? 'وظیفه' : 'گزارش') + '</span>';
        h += '</div></div>';
      });
      h += '</div>';
    }
    modal('🔔 اعلان‌ها', h, '<button class="btn" data-act="close-modal">بستن</button>', 'wide');

    setTimeout(function(){
      var cards = document.querySelectorAll('[data-notif-go]');
      Array.prototype.forEach.call(cards, function(c){
        c.addEventListener('click', function(){
          var h = c.getAttribute('data-notif-go');
          if(h){
            closeModal();
            location.hash = h;
          }
        });
      });
    }, 100);
  });

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(mountBell, 500); });
  else setTimeout(mountBell, 500);
  setTimeout(mountBell, 1500);

  console.log('%c[FEAT-40 NOTIFICATIONS] ok', 'color:#2fa88f;font-weight:bold');
})();

(function(){

    /* محاسبه خسارت طبق ماده ۴۸ شرایط عمومی پیمان
       نرخ خسارت روزانه: مبلغ قرارداد / (مدت قرارداد × 1.5) */
    calculate: function(contractAmount, contractDuration, delayDays){
      contractAmount = num(contractAmount);
      contractDuration = num(contractDuration);
      delayDays = num(delayDays);
      if(contractDuration <= 0 || delayDays <= 0) return null;
      var dailyRate = contractAmount / (contractDuration * 1.5);
      var total = dailyRate * delayDays;
      /* سقف ۱۰٪ قرارداد */
      var max = contractAmount * 0.1;
      var capped = Math.min(total, max);
      return {
        dailyRate: dailyRate,
        total: total,
        capped: capped,
        max: max,
        isCapped: total > max,
        delayDays: delayDays
      };
    }
  };

  defRoute('delay-damage', {
    title: 'خسارت تأخیر',
    sub: function(){ return 'محاسبه طبق ماده ۴۸'; },

/* ============ FEAT-43 — تسویه‌حساب نهایی ============ */
(function(){
  if(window.__block43Installed) return;
  window.__block43Installed = true;

  window.ManaFinalSettlement = {
    /* محاسبه تسویه نهایی پروژه */
    calculate: function(projectId){
      var p = DB.projects.find(function(x){ return x.id === projectId; });
      if(!p) return null;
      /* قراردادهای اصلی */
      var mainContracts = DB.contracts.filter(function(c){ return c.projectId === projectId && !c.parentId; });
      var addendums = DB.contracts.filter(function(c){ return c.projectId === projectId && c.parentId; });
      var contractAmount = sum(mainContracts, function(c){ return num(c.amount); });
      var addendumAmount = sum(addendums, function(c){ return num(c.amount); });
      var totalContract = contractAmount + addendumAmount;
      /* جمع صورت‌وضعیت‌ها */
      var invoices = DB.invoices.filter(function(i){ return i.projectId === projectId; });
      var invoiceGross = sum(invoices, function(i){ return invoiceCalc(i).gross; });
      var invoicePaid = sum(invoices, function(i){ return invoicePaid(i); });
      var retention = sum(invoices, function(i){ return invoiceCalc(i).retention; });
      var totalTax = sum(invoices, function(i){ return invoiceCalc(i).tax; });
      var totalInsurance = sum(invoices, function(i){ return invoiceCalc(i).insurance; });
      /* پیش‌پرداخت */
      var prepayTotal = 0;
      mainContracts.forEach(function(c){
        if(c.prepayAmount) prepayTotal += num(c.prepayAmount);
        else if(c.prepayPercent) prepayTotal += num(c.amount) * num(c.prepayPercent) / 100;
      });
      /* پرداخت‌های نقدی */
      var cashOut = sum(DB.cash.filter(function(c){ return c.projectId === projectId && c.type === 'out'; }), function(c){ return num(c.amount); });
      var cashIn = sum(DB.cash.filter(function(c){ return c.projectId === projectId && c.type === 'in'; }), function(c){ return num(c.amount); });
      /* خسارت */
      var delayDays = 0;
      if(p.end && p.end < todayISO()) delayDays = daysBetween(p.end, todayISO());
      var delayDamage = 0;
      if(delayDays > 0){
        var calc = window.ManaDelayDamage.calculate(totalContract, daysBetween(p.start || p.end, p.end), delayDays);
        if(calc) delayDamage = calc.capped;
      }
      /* مانده */
      var netReceivable = totalContract - invoicePaid - retention;
      return {
        contractAmount: contractAmount,
        addendumAmount: addendumAmount,
        totalContract: totalContract,
        invoiceGross: invoiceGross,
        invoicePaid: invoicePaid,
        retention: retention,
        totalTax: totalTax,
        totalInsurance: totalInsurance,
        prepayTotal: prepayTotal,
        cashIn: cashIn,
        cashOut: cashOut,
        delayDamage: delayDamage,
        netReceivable: netReceivable,
        balance: totalContract - invoiceGross
      };
    }
  };

  defRoute('settlement', {
    title: 'تسویه‌حساب نهایی',
    sub: function(){ return 'خلاصه مالی پروژه'; },
    render: function(){
      if(!DB.projects.length) return '<div class="card">ابتدا پروژه تعریف کنید.</div>';

      var h = '<div class="card mb"><div class="card-h">';

      DB.projects.forEach(function(x){

      var s = window.ManaFinalSettlement.calculate(p.id);
      if(!s) return h + '<div class="card">داده‌ای نیست.</div>';

      h += '<div class="grid g4 mb">';
      h += '<div class="kpi k-info"><div class="lbl">مبلغ پیمان</div><div class="val">' + money(s.totalContract) + '</div></div>';
      h += '<div class="kpi"><div class="lbl">کارکرد صورت‌وضعیت</div><div class="val">' + money(s.invoiceGross) + '</div></div>';
      h += '<div class="kpi k-ok"><div class="lbl">پرداخت‌شده</div><div class="val">' + money(s.invoicePaid) + '</div></div>';
      h += '<div class="kpi ' + (s.netReceivable > 0 ? 'k-warn' : 'k-ok') + '"><div class="lbl">مانده قابل پرداخت</div><div class="val">' + money(s.netReceivable) + '</div></div>';

        return '<tr><td>' + l + '</td><td class="num" style="color:' + (c || 'inherit') + ';text-align:left"><b>' + money(v) + '</b></td></tr>';

      h += row('مبلغ قرارداد اصلی', s.contractAmount);

        h += '✅ تسویه‌شده — همه صورت‌وضعیت‌ها پرداخت شده.';

      }

    }
  });

  window.addEventListener('change', function(e){

  });

  act('stl-print', function(t){

    html += '</div>';
    html += '<h3 style="text-align:center;margin:14px 0">پروژه: ' + esc(p.name) + '</h3>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
    function r2(label, val, color){
      return '<tr><td style="border:1px solid #ccc;padding:6px 10px;background:#f8fafc">' + label + '</td>' +
        '<td style="border:1px solid #ccc;padding:6px 10px;text-align:left;color:' + (color || '#000') + '">' + money(val) + ' ' + esc(DB.settings.currency) + '</td></tr>';

<script>
/* ============================================================
   PATCH-GANTT + PATCH-EDIT-ACTS
   ۱) اصلاح نمایش نوارها در گانت
   ۲) افزودن ویرایش فعالیت
   ۳) بهبود نمایش چارت‌ها
   ============================================================ */
(function(){
'use strict';

/* ============ PATCH 1 — بازنویسی گانت ============ */
defRoute('gantt', {
  title: 'گانت پروژه',
  sub: function(){ return 'نمای زمانی با مسیر بحرانی'; },
  render: function(){
    if(!DB.projects.length) return '<div class="card">ابتدا پروژه تعریف کنید.</div>';
    var p = DB.projects.find(function(x){ return x.id === currentProjectId(); }) || DB.projects[0];
    var res = computeCPM(p.activities || []);
    if(res.error) return '<div class="card"><span class="badge b-bad">' + esc(res.error) + '</span></div>';

    var h = '<div class="card mb"><div class="card-h">';
    h += '<label class="f" style="margin:0;min-width:220px"><span>پروژه</span><select data-act-change="gantt-prj">';
    DB.projects.forEach(function(x){
      h += '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    });
    h += '</select></label><div class="sp"></div>';
    h += '<span class="badge b-pr">مدت: ' + fmt(res.duration) + ' روز</span>';
    h += '<button class="btn sm p" data-act="prj-act" data-id="' + p.id + '">ویرایش فعالیت‌ها</button>';
    h += '</div></div>';

    var A = res.activities;
    var total = Math.max(res.duration, 1);
    var dayW = 20; /* عرض هر روز ثابت */
    var chartW = total * dayW;
    var todayOffset = daysBetween(p.start || todayISO(), todayISO());

    /* KPI */
    var crit = A.filter(function(a){ return a.critical; }).length;
    h += '<div class="grid g3 mb">';
    h += '<div class="kpi"><div class="lbl">مدت پروژه</div><div class="val">' + fmt(res.duration) + '</div></div>';
    h += '<div class="kpi k-bad"><div class="lbl">فعالیت بحرانی</div><div class="val">' + fmt(crit) + ' از ' + fmt(A.length) + '</div></div>';
    h += '<div class="kpi k-info"><div class="lbl">میانگین شناوری</div><div class="val">' + (A.length ? fmt(sum(A, function(a){ return a.TF; }) / A.length, 1) : '—') + '</div></div>';
    h += '</div>';

    /* گانت با اسکرول */
    h += '<div class="card"><div class="card-h"><h3>📊 گانت</h3>';
    h += '<span class="legend" style="margin-inline-start:12px">';
    h += '<span><i style="background:#C0392B"></i>بحرانی</span>';
    h += '<span><i style="background:#0F5C4E"></i>عادی</span>';
    h += '<span><i style="background:#C9A227"></i>امروز</span>';
    h += '</span></div>';

    h += '<div style="overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff">';
    h += '<table style="min-width:' + (chartW + 220) + 'px;border-collapse:collapse">';
    h += '<thead><tr>';
    h += '<th style="width:200px;position:sticky;right:0;background:#f8fafc;z-index:3;border-bottom:1px solid var(--line);text-align:right;padding:8px 10px;font-size:12px">فعالیت</th>';
    /* سرستون‌های روزها */
    for(var d = 0; d <= total; d += 5){
      h += '<th style="width:' + (dayW * 5) + 'px;text-align:center;font-size:10px;padding:4px 0;background:#f8fafc;border-bottom:1px solid var(--line)">' + fmt(d) + '</th>';
    }
    h += '</tr></thead><tbody>';

    A.forEach(function(a){
      h += '<tr style="height:34px">';
      h += '<td style="position:sticky;right:0;background:#fff;z-index:2;border-bottom:1px solid #f1f4f8;padding:6px 10px;font-size:12px;white-space:nowrap">' + esc(a.name) + '</td>';
      h += '<td colspan="999" style="position:relative;border-bottom:1px solid #f1f4f8;padding:0;height:34px;background:#fff">';

      /* برای هر بازه‌ی ۵ روزه، سلول‌های background */
      for(var g = 0; g < total; g += 5){
        var leftPx = g * dayW;
        h += '<div style="position:absolute;top:0;bottom:0;right:' + leftPx + 'px;width:' + (dayW * 5) + 'px;border-right:1px dashed #eef1f5;pointer-events:none"></div>';
      }

      /* نوار فعالیت */
      var leftPx2 = a.ES * dayW;
      var w = Math.max(a.dur * dayW, 10);
      var bg = a.critical ? 'linear-gradient(90deg,#e06a5c,#C0392B)' : 'linear-gradient(90deg,#2f9078,#0F5C4E)';
      h += '<div style="position:absolute;top:7px;right:' + leftPx2 + 'px;width:' + w + 'px;height:20px;border-radius:5px;background:' + bg + ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)" title="' + esc(a.name) + ' — ' + fmt(a.dur) + ' روز، پیشرفت ' + fmt(a.progress) + '٪">';
      /* نوار پیشرفت درون نوار */
      var progW = w * (num(a.progress) / 100);
      h += '<div style="position:absolute;inset:0;right:0;width:' + progW + 'px;background:rgba(255,255,255,.3);border-radius:5px"></div>';
      h += '<span style="position:relative;z-index:2">' + fmt(a.dur) + '</span>';
      h += '</div>';

      /* خط امروز */
      if(todayOffset >= 0 && todayOffset <= total){
        h += '<div style="position:absolute;top:0;bottom:0;right:' + (todayOffset * dayW) + 'px;width:2px;background:#C9A227;opacity:.9;pointer-events:none;z-index:1"></div>';
      }
      h += '</td></tr>';
    });

    h += '</tbody></table></div></div>';

    /* جدول جزئیات */
    h += '<div class="card mt"><div class="card-h"><h3>جزئیات CPM</h3></div>';
    h += '<div class="tbl-wrap"><table><thead><tr>';
    h += '<th>فعالیت</th><th>مدت</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>شناوری</th><th>بحرانی؟</th>';
    h += '</tr></thead><tbody>';
    A.forEach(function(a){
      h += '<tr><td>' + esc(a.name) + '</td>';
      h += '<td class="num">' + fmt(a.dur) + '</td>';
      h += '<td class="num">' + fmt(a.ES) + '</td>';
      h += '<td class="num">' + fmt(a.EF) + '</td>';
      h += '<td class="num">' + fmt(a.LS) + '</td>';
      h += '<td class="num">' + fmt(a.LF) + '</td>';
      h += '<td class="num">' + fmt(a.TF) + '</td>';
      h += '<td>' + (a.critical ? '<span class="badge b-bad">بله</span>' : '<span class="badge b-mut">خیر</span>') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';
    return h;
  }
});

/* ============ PATCH 3 — بهبود نمودار Donut ============ */
if(window.ManaCharts){
  /* جایگزینی Donut با نسخه‌ی بهتر */
  window.ManaCharts.donut = function(items, opt){
    opt = opt || {};
    var W = 280, H = 220;
    var cx = W / 2, cy = H / 2;
    var rOuter = Math.min(W, H) * 0.4;
    var rInner = rOuter * 0.6;
    var total = 0;
    for(var i = 0; i < items.length; i++) total += Number(items[i].v) || 0;
    if(!total) return '<div class="muted small" style="padding:18px;text-align:center">داده‌ای نیست</div>';
    var startAngle = -Math.PI / 2;
    var paths = '';
    var legend = '';
    for(var j = 0; j < items.length; j++){
      var it = items[j];
      var v = Number(it.v) || 0;
      if(v <= 0) continue;
      var angle = (v / total) * Math.PI * 2;
      var endAngle = startAngle + angle;
      var largeArc = angle > Math.PI ? 1 : 0;
      var x1 = cx + rOuter * Math.cos(startAngle);
      var y1 = cy + rOuter * Math.sin(startAngle);
      var x2 = cx + rOuter * Math.cos(endAngle);
      var y2 = cy + rOuter * Math.sin(endAngle);
      var x3 = cx + rInner * Math.cos(endAngle);
      var y3 = cy + rInner * Math.sin(endAngle);
      var x4 = cx + rInner * Math.cos(startAngle);
      var y4 = cy + rInner * Math.sin(startAngle);
      var color = it.c || '#0F5C4E';
      var d = 'M' + x1 + ',' + y1 + ' A' + rOuter + ',' + rOuter + ' 0 ' + largeArc + ' 1 ' + x2 + ',' + y2 +
              ' L' + x3 + ',' + y3 + ' A' + rInner + ',' + rInner + ' 0 ' + largeArc + ' 0 ' + x4 + ',' + y4 + ' Z';
      paths += '<path d="' + d + '" fill="' + color + '" stroke="#fff" stroke-width="2"/>';
      legend += '<span><i style="background:' + color + '"></i>' + esc(it.l) + ' <b>(' + pct(v / total * 100, 0) + ')</b></span>';
      startAngle = endAngle;
    }
    /* نوشته وسط */
    var centerText = '<text x="' + cx + '" y="' + (cy - 5) + '" text-anchor="middle" font-size="20" font-weight="800" fill="#1c2530">' + fmt(total) + '</text>';
    centerText += '<text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" font-size="11" fill="#6b7787">کل</text>';
    return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="max-width:280px;height:auto">' + paths + centerText + '</svg>' +
      '<div class="legend" style="flex-direction:column;gap:6px">' + legend + '</div>' +
      '</div>';
  };
}
