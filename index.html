collectItems = function(){
  var cards = $$('#invItemsWrap .inv-row-card');
  return cards.map(function(card){
    return {
      desc: ($('[data-f=desc]', card) || {}).value || '',
      qty: num(($('[data-f=qty]', card) || {}).value),
      unit: ($('[data-f=unit]', card) || {}).value || '',
      price: num(($('[data-f=price]', card) || {}).value),
      coef: num(($('[data-f=coef]', card) || {}).value) || 1
    };
  });
};

/* ============ PATCH 3 — refreshInvCalc با کارت‌ها ============ */
refreshInvCalc = function(){
  var items = collectItems();
  var gross = sum(items, function(it){ return num(it.qty) * num(it.price) * (num(it.coef) || 1); });
  
  /* به‌روزرسانی جمع هر ردیف */
  $$('#invItemsWrap .inv-row-card').forEach(function(card, i){
    var s = $('[data-sum]', card);
    if(s && items[i]){
      var line = num(items[i].qty) * num(items[i].price) * (num(items[i].coef) || 1);
      s.textContent = money(line);
    }
  });
  
  var ov = $('#overlay');
  if(!ov) return;
  function vv(name){
    var el = ov.querySelector('[name=' + name + ']');
    return el ? num(el.value) : 0;
  }
  var r = vv('retention') / 100;
  var t = vv('tax') / 100;
  var ins = vv('insurance') / 100;
  var v = vv('vat') / 100;
  var other = vv('otherDed');
  var retention = gross * r, tax = gross * t, insurance = gross * ins;
  var base = gross - retention - tax - insurance - other;
  var vat = base * v;
  var net = base + vat;
  
  var box = $('#invCalc');
  if(box){
    box.innerHTML = '<div class="grid g2">' +
      '<div><div class="small muted">کارکرد کل</div><b class="num">' + money(gross) + '</b></div>' +
      '<div><div class="small muted">حسن انجام کار</div><b class="num" style="color:#C0392B">- ' + money(retention) + '</b></div>' +
      '<div><div class="small muted">مالیات + بیمه</div><b class="num" style="color:#C0392B">- ' + money(tax + insurance) + '</b></div>' +
      '<div><div class="small muted">سایر کسور</div><b class="num" style="color:#C0392B">- ' + money(other) + '</b></div>' +
      '<div><div class="small muted">ارزش افزوده</div><b class="num" style="color:#1E9E63">+ ' + money(vat) + '</b></div>' +
      '<div><div class="small muted">خالص قابل پرداخت</div><b class="num" style="color:var(--primary);font-size:18px">' + money(net) + '</b></div>' +
      '</div>';
  }
};

/* ============ PATCH 4 — افزودن ردیف جدید ============ */
act('inv-addrow', function(){
  var wrap = $('#invItemsWrap');
  if(!wrap) return;
  var i = wrap.children.length;
  var tmp = document.createElement('div');
  tmp.innerHTML = invRowCard({ desc: '', qty: 1, unit: '', price: 0, coef: 1 }, i);
  wrap.appendChild(tmp.firstChild);
  refreshInvCalc();
});

/* ============ PATCH 5 — حذف ردیف ============ */
act('inv-delrow', function(t){
  var card = t.closest('.inv-row-card');
  if(card) card.remove();
  refreshInvCalc();
});

/* ============ PATCH 6 — ذخیره ============ */
var _origInvSave = ACT['inv-save'];
ACT['inv-save'] = function(t){
  var f = readForm($('#overlay'));
  var items = collectItems().filter(function(x){ return x.desc || x.price; });
  if(!items.length) return toast('حداقل یک ردیف وارد کنید', 'err');
  pushUndo('inv-save');
  DB.invoices.push({
    id: uid('inv'),
    no: f.no,
    projectId: f.projectId,
    date: f.date || todayISO(),
    subject: f.subject,
    items: items,
    otherDed: num(f.otherDed),
    retention: num(f.retention),
    tax: num(f.tax),
    insurance: num(f.insurance),
    vat: num(f.vat),
    payments: []
  });
  save(); closeModal(); render(); toast('ذخیره شد', 'ok');
};

  console.log('=== دیباگ تاریخ ===');
  console.log('Gregorian:', now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0'));

<script>
/* ============================================================
   PATCH-ACTIVITIES-ENHANCED
   ۱) فرم افزودن فعالیت بهتر (موازی/وابسته)
   ۲) دکمه قالب آماده پروژه ساختمانی
   ۳) نمایش شناوری و بحرانی در جدول
   ۴) راهنمای بصری
   ============================================================ */
(function(){
'use strict';
if(window.__actsEnhancedInstalled) return;
window.__actsEnhancedInstalled = true;

/* ============ PATCH 1 — بازنویسی prj-act با فرم بهتر ============ */
var _origPrjAct = ACT['prj-act'];
ACT['prj-act'] = function(t){
  var p = DB.projects.find(function(x){ return x.id === t.dataset.id; });
  if(!p) return;
  p.activities = p.activities || [];
  var res = computeCPM(p.activities);
  var A = res.activities || p.activities;
  var duration = res.duration || 0;
  var critCount = A.filter(function(a){ return a.critical; }).length;

  var h = '<div class="grid g3 mb">';
  h += '<div class="kpi"><div class="lbl">تعداد فعالیت</div><div class="val">' + fmt(A.length) + '</div></div>';
  h += '<div class="kpi k-info"><div class="lbl">مدت کل پروژه</div><div class="val">' + fmt(duration) + '</div><div class="sub">روز</div></div>';
  h += '<div class="kpi k-bad"><div class="lbl">فعالیت بحرانی</div><div class="val">' + fmt(critCount) + '</div><div class="sub">شناوری صفر</div></div>';
  h += '</div>';

  /* راهنما */
  h += '<div class="card mb" style="background:#fffaf0;border-color:#f4dcb4">';
  h += '<div class="small">💡 <b>راهنما:</b> ';
  h += 'فعالیت بدون پیش‌نیاز = <b>موازی</b> (می‌تواند همزمان اجرا شود). ';
  h += 'فعالیتی که پیش‌نیاز دارد = <b>وابسته</b> (بعد از پایان پیش‌نیاز شروع می‌شود). ';
  h += 'اگر شناوری (TF) صفر باشد، فعالیت <b>بحرانی</b> است و هر تأخیر آن، کل پروژه را تأخیر می‌دهد.';
  h += '</div></div>';

  /* فرم افزودن سریع */
  h += '<div class="card mb" style="background:var(--primary-50)">';
  h += '<h4 class="mb">➕ افزودن فعالیت جدید</h4>';
  h += '<div class="grid g2">';
  h += '<label class="f"><span>نام فعالیت *</span><input type="text" id="aName" placeholder="مثلاً: کاشی‌کاری"></label>';
  h += '<label class="f"><span>مدت (روز)</span><input type="number" id="aDur" value="5" min="1"></label>';
  h += '</div>';
  h += '<div class="grid g2">';
  h += '<label class="f"><span>نوع رابطه</span><select id="aRelType">';
  h += '<option value="none">🔀 موازی — بدون پیش‌نیاز (شروع از روز 0)</option>';
  h += '<option value="after">🔗 وابسته — بعد از پایان پیش‌نیاز</option>';
  h += '</select></label>';
  h += '<label class="f"><span>پیش‌نیاز (اگر وابسته)</span><select id="aDep">';
  h += '<option value="">—</option>';
  p.activities.forEach(function(a){
    h += '<option value="' + a.id + '">' + esc(a.name) + ' (' + fmt(a.dur) + ' روز)</option>';
  });
  h += '</select></label>';
  h += '</div>';
  h += '<div class="grid g2">';
  h += '<label class="f"><span>تأخیر/پیش‌افت (روز)</span><input type="number" id="aLag" value="0" placeholder="منفی = پیش‌افت"></label>';
  h += '<label class="f"><span>پیشرفت (٪)</span><input type="number" id="aProg" value="0" min="0" max="100"></label>';
  h += '</div>';
  h += '<div class="row">';
  h += '<button class="btn p" data-act="act-add-fast" data-id="' + p.id + '">✅ افزودن فعالیت</button>';
  h += '<button class="btn" data-act="act-template" data-id="' + p.id + '">📋 افزودن قالب آماده</button>';
  h += '</div>';
  h += '</div>';

  /* جدول فعالیت‌ها */
  h += '<div class="card">';
  h += '<h4 class="mb">📋 لیست فعالیت‌ها (' + fmt(A.length) + ')</h4>';
  
  if(!A.length){
    h += '<div class="muted" style="text-align:center;padding:20px">هنوز فعالیتی ثبت نشده. از فرم بالا استفاده کنید یا «افزودن قالب آماده» را بزنید.</div>';
  } else {
    h += '<div class="tbl-wrap"><table><thead><tr>';
    h += '<th>فعالیت</th><th>مدت</th><th>شروع</th><th>پایان</th><th>شناوری</th><th>وضعیت</th><th>پیشرفت</th><th></th>';
    h += '</tr></thead><tbody>';
    
    A.forEach(function(a){
      var critical = a.critical;
      h += '<tr>';
      h += '<td><b>' + esc(a.name) + '</b></td>';
      h += '<td class="num">' + fmt(a.dur) + '</td>';
      h += '<td class="num">' + fmt(a.ES) + '</td>';
      h += '<td class="num">' + fmt(a.EF) + '</td>';
      h += '<td class="num" style="color:' + (critical ? '#C0392B' : '#1E9E63') + '"><b>' + fmt(a.TF) + '</b></td>';
      h += '<td>' + (critical ? '<span class="badge b-bad">بحرانی</span>' : '<span class="badge b-ok">شناور</span>') + '</td>';
      h += '<td style="min-width:80px"><div class="row" style="gap:5px"><div class="bar" style="flex:1"><i style="width:' + clamp(num(a.progress), 0, 100) + '%"></i></div><span class="small">' + fmt(num(a.progress)) + '٪</span></div></td>';
      h += '<td class="row" style="gap:4px;white-space:nowrap">';
      h += '<button class="btn sm" data-act="act-edit-fast" data-pid="' + p.id + '" data-id="' + a.id + '">✎</button>';
      h += '<button class="btn sm d" data-act="act-del" data-pid="' + p.id + '" data-id="' + a.id + '">×</button>';
      h += '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  modal('فعالیت‌های ' + p.name, h,
    '<button class="btn" data-act="close-modal">بستن</button>', 'wide');
};

/* ============ PATCH 2 — افزودن فعالیت با نوع رابطه ============ */
act('act-add-fast', function(t){
  var p = DB.projects.find(function(x){ return x.id === t.dataset.id; });
  if(!p) return;
  
  var name = $('#aName').value.trim();
  if(!name) return toast('نام فعالیت الزامی است', 'err');
  
  var dur = num($('#aDur').value);
  if(dur <= 0) return toast('مدت باید بیشتر از صفر باشد', 'err');
  
  var relType = $('#aRelType').value;
  var depId = $('#aDep').value;
  var lag = num($('#aLag').value);
  var prog = num($('#aProg').value);
  
  var deps = [];
  if(relType === 'after' && depId){
    deps = [{ id: depId, lag: lag }];
  }
  
  pushUndo('act-add');
  p.activities.push({
    id: uid('act'),
    name: name,
    dur: dur,
    progress: prog,
    deps: deps
  });
  save();
  
  /* رفرش مودال */
  closeModal();
  setTimeout(function(){
    act['prj-act']({ dataset: { id: p.id } });
  }, 100);
  
  var msg = relType === 'none' ? '✅ فعالیت موازی افزوده شد' : '✅ فعالیت وابسته افزوده شد';
  toast(msg, 'ok');
});

/* نمایش/مخفی کردن پیش‌نیاز بر اساس نوع رابطه */
document.addEventListener('change', function(e){
  if(e.target.id === 'aRelType'){
    var val = e.target.value;
    var depEl = $('#aDep');
    var lagEl = $('#aLag');
    if(depEl){
      depEl.disabled = (val === 'none');
      depEl.parentElement.style.opacity = val === 'none' ? '0.4' : '1';
    }
    if(lagEl){
      lagEl.disabled = (val === 'none');
      lagEl.parentElement.style.opacity = val === 'none' ? '0.4' : '1';
    }
  }
});

/* ============ PATCH 3 — ویرایش فعالیت (inline) ============ */
act('act-edit-fast', function(t){
  var pid = t.dataset.pid;
  var aid = t.dataset.id;
  var p = DB.projects.find(function(x){ return x.id === pid; });
  if(!p) return;
  var a = p.activities.find(function(x){ return x.id === aid; });
  if(!a) return;
  
  var depId = '';
  var depLag = 0;
  if(a.deps && a.deps.length){
    depId = a.deps[0].id || a.deps[0];
    depLag = a.deps[0].lag || 0;
  }
  var relType = depId ? 'after' : 'none';
  
  var h = '<div class="grid g2">';
  h += '<label class="f"><span>نام فعالیت *</span><input type="text" id="aeName" value="' + esc(a.name) + '"></label>';
  h += '<label class="f"><span>مدت (روز)</span><input type="number" id="aeDur" value="' + num(a.dur) + '" min="1"></label>';
  h += '</div>';
  h += '<div class="grid g2">';
  h += '<label class="f"><span>نوع رابطه</span><select id="aeRelType">';
  h += '<option value="none"' + (relType === 'none' ? ' selected' : '') + '>🔀 موازی — بدون پیش‌نیاز</option>';
  h += '<option value="after"' + (relType === 'after' ? ' selected' : '') + '>🔗 وابسته</option>';
  h += '</select></label>';
  h += '<label class="f"><span>پیش‌نیاز</span><select id="aeDep"' + (relType === 'none' ? ' disabled' : '') + '>';
  h += '<option value="">—</option>';
  p.activities.forEach(function(x){
    if(x.id === aid) return;
    h += '<option value="' + x.id + '"' + (x.id === depId ? ' selected' : '') + '>' + esc(x.name) + '</option>';
  });
  h += '</select></label>';
  h += '</div>';
  h += '<div class="grid g2">';
  h += '<label class="f"><span>تأخیر/پیش‌افت (روز)</span><input type="number" id="aeLag" value="' + depLag + '"></label>';
  h += '<label class="f"><span>پیشرفت (٪)</span><input type="number" id="aeProg" value="' + num(a.progress) + '" min="0" max="100"></label>';
  h += '</div>';
  
  modal('ویرایش: ' + a.name, h,
    '<button class="btn p" data-act="act-edit-save-fast" data-pid="' + pid + '" data-id="' + aid + '">ذخیره</button>' +
    '<button class="btn" data-act="close-modal">انصراف</button>');
});

act('act-edit-save-fast', function(t){
  var pid = t.dataset.pid;
  var aid = t.dataset.id;
  var p = DB.projects.find(function(x){ return x.id === pid; });
  if(!p) return;
  var a = p.activities.find(function(x){ return x.id === aid; });
  if(!a) return;
  
  var name = $('#aeName').value.trim();
  if(!name) return toast('نام الزامی', 'err');
  var dur = num($('#aeDur').value);
  if(dur <= 0) return toast('مدت نامعتبر', 'err');
  var relType = $('#aeRelType').value;
  var depId = $('#aeDep').value;
  var lag = num($('#aeLag').value);
  var prog = num($('#aeProg').value);
  
  pushUndo('act-edit');
  a.name = name;
  a.dur = dur;
  a.progress = prog;
  if(relType === 'after' && depId){
    a.deps = [{ id: depId, lag: lag }];
  } else {
    a.deps = [];
  }
  save();
  closeModal();
  setTimeout(function(){ act['prj-act']({ dataset: { id: pid } }); }, 100);
  toast('ویرایش شد', 'ok');
});

/* ============ PATCH 4 — قالب آماده پروژه ساختمانی ============ */
act('act-template', function(t){
  var p = DB.projects.find(function(x){ return x.id === t.dataset.id; });

  var hasActivities = (p.activities || []).length > 0;

    if(!confirm('این پروژه ' + p.activities.length + ' فعالیت دارد. قالب به آن‌ها اضافه می‌شود. ادامه؟')) return;

  pushUndo('act-template');

  ['a1','a2','a3','a4','a5','a6','a7','a8','a9','a10','a11','a12','a13','a14','a15'].forEach(function(k){ ids[k] = uid('act'); });
  
  var template = [
    /* فاز ۱ — آماده‌سازی (موازی‌های اولیه) */
    { id: ids.a1, name: 'تجهیز کارگاه',              dur: 10, deps: [], progress: 0 },
    { id: ids.a2, name: 'نقشه‌کشی اجرایی',           dur: 30, deps: [], progress: 0 },  /* موازی */
    { id: ids.a3, name: 'خرید مصالح اولیه',          dur: 20, deps: [], progress: 0 },  /* موازی */
    { id: ids.a4, name: 'اخذ مجوزها',                dur: 40, deps: [], progress: 0 },  /* موازی */
    
    /* فاز ۲ — خاکبرداری و فونداسیون */
    { id: ids.a5, name: 'خاکبرداری',                 dur: 20, deps: [{id: ids.a1, lag: 0}], progress: 0 },
    { id: ids.a6, name: 'آرماتوربندی فونداسیون',     dur: 15, deps: [{id: ids.a5, lag: 0}], progress: 0 },
    { id: ids.a7, name: 'قالب‌بندی فونداسیون',       dur: 12, deps: [{id: ids.a5, lag: 0}], progress: 0 },  /* موازی با a6 */
    { id: ids.a8, name: 'بتن‌ریزی فونداسیون',        dur: 5,  deps: [{id: ids.a6, lag: 0}, {id: ids.a7, lag: 0}], progress: 0 },
    
    /* فاز ۳ — اسکلت (همزمان با سفت‌کاری طبقات) */
    { id: ids.a9,  name: 'اجرای اسکلت',              dur: 90, deps: [{id: ids.a8, lag: 0}], progress: 0 },
    { id: ids.a10, name: 'دیوارچینی',                dur: 60, deps: [{id: ids.a9, lag: -30}], progress: 0 },  /* با lag منفی — همزمان با اسکلت */
    
    /* فاز ۴ — نازک‌کاری (موازی‌های زیاد) */
    { id: ids.a11, name: 'تأسیسات برقی',             dur: 45, deps: [{id: ids.a10, lag: 0}], progress: 0 },
    { id: ids.a12, name: 'تأسیسات مکانیکی',          dur: 45, deps: [{id: ids.a10, lag: 0}], progress: 0 },  /* موازی با a11 */
    { id: ids.a13, name: 'نصب پنجره',                dur: 20, deps: [{id: ids.a10, lag: 0}], progress: 0 },  /* موازی */
    { id: ids.a14, name: 'کاشی‌کاری',                dur: 40, deps: [{id: ids.a11, lag: 0}], progress: 0 },
    { id: ids.a15, name: 'نقاشی و تحویل',            dur: 30, deps: [{id: ids.a14, lag: 0}, {id: ids.a12, lag: 0}], progress: 0 }
  ];
  
  template.forEach(function(a){ p.activities.push(a); });
  save();
  
  closeModal();
  setTimeout(function(){ act['prj-act']({ dataset: { id: p.id } }); }, 100);
  toast(fmt(template.length) + ' فعالیت نمونه اضافه شد', 'ok');
});

/* ============ PATCH 5 — راهنمای بصری در گانت ============ */

    '@page{size:A4;margin:0}' +
    '@media print{body{margin:0}}' +
    '</style>';

    '<title>صورت‌وضعیت</title>' + printStyles +
    '</head><body>' + area.outerHTML + '</body></html>';

  var w = null;
  try{
    w = window.open('', '_blank');
    if(w){ try{ w.opener = null; }catch(e){} }
  }catch(e){ w = null; }

  if(!w){
    /* fallback — چاپ مستقیم */
    toast('پاپ‌آپ بسته شده — از روش چاپ صفحه استفاده کنید', 'err');
    window.print();
    return;
  }

  w.document.open();
  w.document.write(printHtml);
  w.document.close();

  setTimeout(function(){
    try{ w.focus(); w.print(); }catch(e){}
  }, 500);

  setTimeout(function(){

  }, 2500);
});

/* ============ ۳) جستجو تو جداول ============ */
function addSearchBars(){
  var wraps = document.querySelectorAll('.tbl-wrap');
  wraps.forEach(function(wrap, idx){
    if(wrap.dataset.searchAdded) return;
    if(!wrap.querySelector('table')) return;
    wrap.dataset.searchAdded = '1';
    
    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '🔍 جستجو...';
    input.style.cssText = 'width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:6px;background:#f8fafc;font-family:inherit';
    input.oninput = function(){
      var q = input.value.toLowerCase().trim();
      var tbody = wrap.querySelector('tbody');
      if(!tbody) return;
      var rows = tbody.querySelectorAll('tr');
      rows.forEach(function(tr){
        var txt = tr.textContent.toLowerCase();
        tr.style.display = (!q || txt.indexOf(q) > -1) ? '' : 'none';
      });
    };
    wrap.parentNode.insertBefore(input, wrap);
  });
}

var _origRender = window.render;
window.render = function(){

};

ACT['rep-csv-adv'] = function(){

  h += '<option value="contracts">قراردادها</option>';
  h += '<option value="cash">جریان نقدی</option>';

  h += '<option value="tasks">وظایف</option>';
  h += '<option value="personnel">پرسنل</option>';
  h += '<option value="checks">چک‌ها</option>';
  h += '</select></label>';
  h += '<label class="f"><span>فیلتر (اختیاری)</span><input type="text" id="repFilter" placeholder="متن جستجو"></label>';
  h += '</div>';
  h += '<div class="small muted mb">خروجی با BOM برای Excel فارسی</div>';
  modal('📊 گزارش‌ساز', h, 
    '<button class="btn p" data-act="rep-csv-go">⬇ دانلود CSV</button>' +
    '<button class="btn" data-act="close-modal">انصراف</button>');
};

ACT['rep-csv-go'] = function(){
  var type = document.getElementById('repType').value;
  var filter = (document.getElementById('repFilter').value || '').toLowerCase();
  var data = DB[type] || [];
  if(filter) data = data.filter(function(row){
    return JSON.stringify(row).toLowerCase().indexOf(filter) > -1;
  });
  if(!data.length) return toast('داده‌ای نیست', 'err');
  var keys = Object.keys(data[0]);
  var lines = [keys.join(',')];
  data.forEach(function(row){
    lines.push(keys.map(function(k){
      var v = row[k];
      if(v == null) v = '';
      if(typeof v === 'object') v = JSON.stringify(v);
      return '"' + String(v).replace(/"/g, '""') + '"';
    }).join(','));
  });
  var blob = new Blob(['\ufeff' + lines.join('\n')], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mana-' + type + '-' + todayISO() + '.csv';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  closeModal();
  toast('دانلود شد ✅', 'ok');
};

    return h;
  }
});

/* ============ ۲) نمای تقویم ============ */
defRoute('calendar', {
  title: 'تقویم',
  sub: function(){ return 'همه‌ی رویدادها'; },
  render: function(){
    var today = todayISO();
    var jToday = toJ(today) || { jy: 1403, jm: 1, jd: 1 };
    var vy = jToday.jy, vm = jToday.jm;
    
    /* جمع‌آوری رویدادها */
    var events = {};
    function addEvent(iso, ev){
      if(!iso) return;
      if(!events[iso]) events[iso] = [];
      events[iso].push(ev);
    }
    
    DB.tasks.forEach(function(t){
      if(t.due) addEvent(t.due, { type: 'task', title: t.title, color: '#3B82F6', icon: '🗂', link: '#/kanban' });
    });
    DB.checks.forEach(function(c){
      if(c.due && c.status !== 'cleared') addEvent(c.due, { type: 'check', title: 'چک ' + (c.no || '') + ' — ' + money(c.amount), color: '#E68600', icon: '💳', link: '#/checks' });
    });
    DB.invoices.forEach(function(inv){
      if(inv.date){
        var due = addDays(inv.date, DB.settings.terms || 30);
        var c = invoiceCalc(inv);
        var rem = c.net - invoicePaid(inv);
        if(rem > 0.5) addEvent(due, { type: 'invoice', title: 'صورت‌وضعیت ' + (inv.no || '') + ' — ' + money(rem), color: '#C0392B', icon: '🧾', link: '#/aging' });
      }
    });
    DB.projects.forEach(function(p){
      if(p.end && p.status === 'در حال اجرا') addEvent(p.end, { type: 'project', title: 'پایان پروژه ' + p.name, color: '#0F5C4E', icon: '🏗', link: '#/projects' });
    });
    DB.hse.forEach(function(e){
      if(e.date) addEvent(e.date, { type: 'hse', title: 'رخداد ' + (e.type || ''), color: '#C0392B', icon: '🚨', link: '#/risks' });
    });
    
    var h = '<div class="card mb">';
    h += '<div class="card-h" style="justify-content:space-between">';
    h += '<button class="btn sm" id="calPrev">‹</button>';
    h += '<h3 id="calTitle">' + JM[vm-1] + ' ' + fmt(vy) + '</h3>';
    h += '<button class="btn sm" id="calNext">›</button>';
    h += '</div>';
    h += '<div id="calGrid"></div>';
    h += '</div>';
    
    /* لیست رویدادهای آینده */
    var upcoming = [];
    Object.keys(events).forEach(function(iso){
      if(iso >= today) upcoming.push({ date: iso, events: events[iso] });
    });
    upcoming.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    
    if(upcoming.length){
      h += '<div class="card"><div class="card-h"><h3>📅 رویدادهای آینده</h3></div>';
      upcoming.slice(0, 15).forEach(function(day){
        h += '<div style="padding:10px 0;border-bottom:1px solid var(--line)">';
        h += '<div style="font-weight:700;font-size:13px;color:var(--primary);margin-bottom:6px">' + jStr(day.date, true) + '</div>';
        day.events.forEach(function(ev){
          h += '<div onclick="location.hash=\'' + ev.link + '\'" style="display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer">';
          h += '<span style="font-size:16px">' + ev.icon + '</span>';
          h += '<span style="flex:1;font-size:12.5px">' + esc(ev.title) + '</span>';
          h += '<span style="width:4px;height:20px;border-radius:2px;background:' + ev.color + '"></span>';
          h += '</div>';
        });
        h += '</div>';
      });
      h += '</div>';
    } else {
      h += '<div class="card"><div class="muted" style="text-align:center;padding:20px">رویداد آینده‌ای نیست</div></div>';
    }
    
    /* رندر تقویم */
    setTimeout(function(){
      var curY = vy, curM = vm;
      function paint(){
        var len = jMonthLen(curY, curM);
        var firstG = fromJ(curY, curM, 1);
        var wd = (new Date(firstG + 'T00:00:00').getDay() + 1) % 7;
        var html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center">';
        ['ش','ی','د','س','چ','پ','ج'].forEach(function(d){
          html += '<div style="font-size:11px;color:var(--muted);padding:4px 0;font-weight:700">' + d + '</div>';
        });
        var i;
        for(i = 0; i < wd; i++) html += '<div></div>';
        for(var d = 1; d <= len; d++){
          var iso = fromJ(curY, curM, d);
          var isToday = (iso === today);
          var hasEvents = events[iso] && events[iso].length;
          var bg = isToday ? 'linear-gradient(135deg,#0F5C4E,#0a3d33)' : (hasEvents ? '#fffaf0' : '#f8fafc');
          var col = isToday ? '#fff' : '#1c2530';
          html += '<div style="padding:8px 0;border-radius:8px;background:' + bg + ';color:' + col + ';font-size:13px;cursor:pointer;position:relative;min-height:38px" onclick="window.calShowDay(\'' + iso + '\')">';
          html += fmt(d);
          if(hasEvents){
            html += '<div style="position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px">';
            events[iso].slice(0, 3).forEach(function(ev){
              html += '<span style="width:4px;height:4px;border-radius:50%;background:' + ev.color + '"></span>';
            });
            html += '</div>';
          }
          html += '</div>';
        }
        html += '</div>';
        document.getElementById('calGrid').innerHTML = html;
        document.getElementById('calTitle').textContent = JM[curM-1] + ' ' + fmt(curY);
      }
      window.calShowDay = function(iso){
        if(!events[iso] || !events[iso].length){ toast('رویدادی نیست', 'err'); return; }
        var h = '<div style="margin-bottom:10px"><b>' + jStr(iso, true) + '</b></div>';
        events[iso].forEach(function(ev){
          h += '<div class="card" style="margin-bottom:8px;padding:10px;cursor:pointer" onclick="closeModal();location.hash=\'' + ev.link + '\'">';
          h += '<div style="display:flex;gap:8px;align-items:center">';
          h += '<span style="font-size:20px">' + ev.icon + '</span>';
          h += '<div style="flex:1;font-size:13px">' + esc(ev.title) + '</div>';
          h += '</div></div>';
        });
        modal('رویدادهای ' + jStr(iso), h, '<button class="btn" data-act="close-modal">بستن</button>');
      };
      document.getElementById('calPrev').onclick = function(){
        curM--; if(curM < 1){ curM = 12; curY--; } paint();
      };
      document.getElementById('calNext').onclick = function(){
        curM++; if(curM > 12){ curM = 1; curY++; } paint();
      };
      paint();
    }, 100);
    
    return h;
  }
});

<script>
  /* ============ MANA PACK 2 — TIMER + COMMENTS + RATING ============ */
  (function() {
    'use strict';
    if (window.__manaPack2) return;
    window.__manaPack2 = true;
    
    /* ============ ۱) تایمر برای وظایف ============ */
    if (!Array.isArray(DB.timers)) DB.timers = [];
    
    window.ManaTimer = {
      start: function(taskId) {
        var existing = DB.timers.find(function(t) { return t.taskId === taskId && !t.end; });
        if (existing) { toast('قبلاً شروع شده', 'err'); return; }
        DB.timers.push({ id: uid('tmr'), taskId: taskId, start: Date.now(), end: null, total: 0 });
        save();
        toast('⏱ تایمر شروع شد', 'ok');
        render();
      },
      stop: function(taskId) {
        var t = DB.timers.find(function(x) { return x.taskId === taskId && !x.end; });
        if (!t) { toast('تایمر فعالی نیست', 'err'); return; }
        t.end = Date.now();
        t.total = Math.floor((t.end - t.start) / 1000);
        save();
        toast('⏱ متوقف شد: ' + window.ManaTimer.human(t.total), 'ok');
        render();
      },
      totalFor: function(taskId) {
        return DB.timers.filter(function(t) { return t.taskId === taskId && t.total; })
          .reduce(function(s, t) { return s + (t.total || 0); }, 0);
      },
      isRunning: function(taskId) {
        return !!DB.timers.find(function(t) { return t.taskId === taskId && !t.end; });
      },
      human: function(sec) {
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var s = sec % 60;
        if (h > 0) return h + 'س ' + m + 'د ' + s + 'ث';
        if (m > 0) return m + 'د ' + s + 'ث';
        return s + 'ث';
      }
    };
    
    /* تزریق تایمر به کارت‌های کانبان */
    var _origKanbanRender = ROUTES.kanban.render;
    ROUTES.kanban.render = function() {
      var res = _origKanbanRender.apply(this, arguments);
      setTimeout(function() {
        var cards = document.querySelectorAll('.kb-card');
        Array.prototype.forEach.call(cards, function(card) {
          if (card.querySelector('.mana-timer-btn')) return;
          var editBtn = card.querySelector('[data-act="task-edit"]');
          if (!editBtn) return;
          var taskId = editBtn.dataset.id;
          var isRunning = window.ManaTimer.isRunning(taskId);
          var total = window.ManaTimer.totalFor(taskId);
          var btn = document.createElement('button');
          btn.className = 'mana-timer-btn btn sm ' + (isRunning ? 'd' : 'g');
          btn.style.cssText = 'margin-top:6px;width:100%;font-size:10.5px';
          btn.textContent = isRunning ? '⏹ توقف (' + window.ManaTimer.human(Math.floor((Date.now() - DB.timers.find(function(t) { return t.taskId === taskId && !t.end; }).start) / 1000)) + ')' : (total ? '▶ ادامه (' + window.ManaTimer.human(total) + ')' : '▶ شروع تایمر');
          btn.onclick = function(e) {
            e.stopPropagation();
            if (isRunning) window.ManaTimer.stop(taskId);
            else window.ManaTimer.start(taskId);
          };
          var container = card.querySelector('.row');
          if (container) container.parentNode.insertBefore(btn, container);
        });
      }, 150);
      return res;
    };
    
    /* ============ ۲) امتیازدهی به پیمانکار / تامین‌کننده ============ */
    if (!Array.isArray(DB.ratings)) DB.ratings = [];
    
    window.ManaRating = {
      add: function(entityType, entityId, score, note) {
        pushUndo('rating-add');
        DB.ratings.push({
          id: uid('rat'),
          entityType: entityType,
          entityId: entityId,
          score: num(score) || 0,
          note: note || '',
          date: todayISO(),
          t: Date.now()
        });
        save();
      },
      avg: function(entityType, entityId) {
        var list = DB.ratings.filter(function(r) { return r.entityType === entityType && r.entityId === entityId; });
        if (!list.length) return 0;
        var sum = list.reduce(function(s, r) { return s + num(r.score); }, 0);
        return sum / list.length;
      },
      count: function(entityType, entityId) {
        return DB.ratings.filter(function(r) { return r.entityType === entityType && r.entityId === entityId; }).length;
      },
      renderStars: function(score) {
        var s = '';
        for (var i = 1; i <= 5; i++) s += (i <= score) ? '★' : '☆';
        return s;
      },
      open: function(entityType, entityId, label) {
        var body = '<div class="small muted mb">امتیاز به ' + esc(label) + '</div>';
        body += '<div class="row mb" style="gap:8px;justify-content:center" id="ratingStars">';
        for (var i = 1; i <= 5; i++) {
          body += '<button type="button" data-star="' + i + '" style="background:none;border:0;font-size:32px;cursor:pointer;color:#ccc;padding:4px">★</button>';
        }
        body += '</div>';
        body += '<label class="f"><span>یادداشت</span><textarea id="ratingNote" style="min-height:70px"></textarea></label>';
        body += '<input type="hidden" id="ratingVal" value="0">';
        modal('امتیازدهی', body,
          '<button class="btn p" data-act="rating-save" data-etype="' + entityType + '" data-eid="' + entityId + '">ثبت</button>' +
          '<button class="btn" data-act="close-modal">انصراف</button>');
        setTimeout(function() {
          var stars = document.querySelectorAll('[data-star]');
          Array.prototype.forEach.call(stars, function(b) {
            b.onclick = function() {
              var v = +b.dataset.star;
              document.getElementById('ratingVal').value = v;
              Array.prototype.forEach.call(stars, function(x) {
                x.style.color = (+x.dataset.star <= v) ? '#D4A72C' : '#ccc';
              });
            };
          });
        }, 100);
      }
    };
    
    ACT['rating-save'] = function(t) {
      var score = num(document.getElementById('ratingVal').value);
      if (score < 1) return toast('امتیاز رو انتخاب کن', 'err');
      var note = document.getElementById('ratingNote').value;
      window.ManaRating.add(t.dataset.etype, t.dataset.eid, score, note);
      closeModal();
      render();
      toast('امتیاز ثبت شد ⭐', 'ok');
    };
    
    /* تزریق دکمه امتیاز به صفحه پیمانکاران */
    var _origSubRender = ROUTES.subcontractors.render;
    if (_origSubRender) {
      ROUTES.subcontractors.render = function() {
        var h = _origSubRender.apply(this, arguments);
        try {
          h = h.replace(/<button class="btn sm" data-act="sub-view"/g,
            '<button class="btn sm" data-act="rating-open" data-etype="sub" data-elabel="پیمانکار">⭐</button><button class="btn sm" data-act="sub-view"');
        } catch (e) {}
        return h;
      };
    }
    
    ACT['rating-open'] = function(t) {
      var id = null;
      var rows = document.querySelectorAll('#view .tbl-wrap tbody tr');
      Array.prototype.forEach.call(rows, function(tr) {
        if (tr.contains(t) && t.dataset.eid == null) {
          var view = tr.querySelector('[data-act="sub-view"]');
          if (view) id = view.dataset.id;
        }
      });
      id = id || t.dataset.eid;
      if (!id) return;
      window.ManaRating.open(t.dataset.etype || 'sub', id, t.dataset.elabel || '');
    };
    
    /* ============ ۳) تایمر سراسری (برای همه‌ی رکوردها) ============ */
    if (!Array.isArray(DB.timeLog)) DB.timeLog = [];
    
    window.ManaTimeLog = {
      start: function(entityType, entityId, label) {
        var existing = DB.timeLog.find(function(t) { return !t.end; });
        if (existing) {
          if (!confirm('یه تایمر دیگه در حال حرکته (' + existing.label + '). متوقفش کنم؟')) return;
          existing.end = Date.now();
          existing.total = Math.floor((existing.end - existing.start) / 1000);
        }
        DB.timeLog.push({
          id: uid('tl'),
          entityType: entityType,
          entityId: entityId,
          label: label,
          start: Date.now(),
          end: null,
          total: 0,
          date: todayISO()
        });
        save();
        toast('⏱ شروع شد: ' + label, 'ok');
        render();
      },
      stop: function() {
        var t = DB.timeLog.find(function(x) { return !x.end; });
        if (!t) return toast('تایمری نیست', 'err');
        t.end = Date.now();
        t.total = Math.floor((t.end - t.start) / 1000);
        save();
        toast('⏱ متوقف: ' + window.ManaTimer.human(t.total), 'ok');
        render();
      },
      running: function() {
        return DB.timeLog.find(function(x) { return !x.end; });
      }
    };
    
    /* ویجت شناور تایمر */
    setInterval(function() {
      var t = window.ManaTimeLog.running();
      var widget = document.getElementById('manaTimerWidget');
      if (!t) {
        if (widget) widget.remove();
        return;
      }
      if (!widget) {
        widget = document.createElement('div');
        widget.id = 'manaTimerWidget';
        widget.style.cssText = 'position:fixed;bottom:80px;right:12px;z-index:9000;background:linear-gradient(135deg,#0F5C4E,#0a3d33);color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:12px;font-weight:600;font-family:inherit;display:flex;gap:10px;align-items:center;cursor:pointer';
        widget.onclick = function() { if (confirm('متوقف کنم؟')) window.ManaTimeLog.stop(); };
        document.body.appendChild(widget);
      }
      var sec = Math.floor((Date.now() - t.start) / 1000);
      widget.innerHTML = '⏱ ' + esc(t.label) + ' — <b>' + window.ManaTimer.human(sec) + '</b> <span style="opacity:.7">(توقف)</span>';
    }, 1000);
    
    /* دکمه‌ی سریع تایمر تو نوار بالا */
    (function() {
      var box = document.querySelector('.top-actions');
      if (!box || box.querySelector('[data-act="timer-start"]')) return;
      var b = document.createElement('button');
      b.className = 'btn sm';

      b.setAttribute('data-act', 'timer-start');
      b.innerHTML = '⏱';
      b.title = 'شروع تایمر';
      box.insertBefore(b, box.firstChild);
    })();
    
    ACT['timer-start'] = function() {
      var label = prompt('چی رو تایم بگیرم؟', 'کار جاری');
      if (!label) return;
      window.ManaTimeLog.start('manual', Date.now().toString(), label);
    };
    
    console.log('%c[PACK 2] ok', 'color:#2fa88f;font-weight:bold');
  })();

<script>
/* ============ MANA PACK 3 — EXCEL + GALLERY + GPS ============ */
(function(){
'use strict';
if(window.__manaPack3) return;
window.__manaPack3 = true;

/* ============ ۱) خروجی Excel (xlsx-compatible) ============ */
window.ManaExcel = {
  export: function(type){
    var data = DB[type] || [];
    if(!data.length) return toast('داده‌ای نیست', 'err');
    var keys = Object.keys(data[0]);
    var labels = {
      projects:'پروژه‌ها', invoices:'صورت‌وضعیت‌ها', contracts:'قراردادها',
      cash:'جریان نقدی', items:'انبار', tasks:'وظایف', personnel:'پرسنل',
      checks:'چک‌ها', suppliers:'تامین‌کنندگان', risks:'ریسک‌ها'
    };
    
    /* HTML table → Excel */
    var html = '<html dir="rtl"><head><meta charset="utf-8">';
    html += '<style>td,th{border:1px solid #999;padding:4px;font-family:Tahoma}th{background:#0F5C4E;color:#fff}</style>';
    html += '</head><body>';
    html += '<h2>' + (labels[type] || type) + '</h2>';
    html += '<table>';
    html += '<tr>';
    keys.forEach(function(k){ html += '<th>' + k + '</th>'; });
    html += '</tr>';
    data.forEach(function(row){
      html += '<tr>';
      keys.forEach(function(k){
        var v = row[k];
        if(v == null) v = '';
        if(typeof v === 'object') v = JSON.stringify(v);
        html += '<td>' + String(v).replace(/</g, '&lt;') + '</td>';
      });
      html += '</tr>';
    });
    html += '</table></body></html>';
    
    var blob = new Blob(['\ufeff' + html], {type: 'application/vnd.ms-excel;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mana-' + type + '-' + todayISO() + '.xls';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast('Excel دانلود شد ✅', 'ok');
  },
  openPicker: function(){
    var h = '<div class="small muted mb">چه داده‌ای رو خروجی Excel بگیرم؟</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">';
    var opts = [
      {k:'projects',t:'🏗 پروژه‌ها'},

      inp.style.display = 'none';
      inp.onchange = function(){
        var f = inp.files && inp.files[0];
        if(!f) return;
        toast('در حال ذخیره...');
        var rd = new FileReader();
        rd.onload = function(ev){
          var img = new Image();
          img.onload = function(){
            var mx = 1600;
            var w = img.width, hh = img.height;
            var scale = 1;
            if(w > mx || hh > mx) scale = Math.min(mx / w, mx / hh);
            var cv = document.createElement('canvas');
            cv.width = w * scale;
            cv.height = hh * scale;
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            var dataUrl = cv.toDataURL('image/jpeg', 0.82);
            
            pushUndo('gal-add');
            DB.gallery.push({
              id: uid('gal'),
              projectId: pid,
              date: todayISO(),

              note: document.getElementById('galNote').value,

            });

          };
          img.onerror = function(){ toast('خطا در عکس', 'err'); };
          img.src = ev.target.result;
        };
        rd.readAsDataURL(f);
      };
      document.body.appendChild(inp);
      inp.click();
    };
  }, 100);
};

function applyTheme(theme){
  var root = document.documentElement;
  root.style.setProperty('--primary', theme.primary);
  root.style.setProperty('--primary-700', shadeColor(theme.primary, -20));
  root.style.setProperty('--primary-600', shadeColor(theme.primary, -10));
  root.style.setProperty('--accent', theme.accent);
  /* ذخیره در localStorage */
  try{ localStorage.setItem('mana.theme.palette', JSON.stringify(theme)); }catch(e){}
}

function shadeColor(color, percent){
  var num = parseInt(color.replace('#',''), 16);
  var r = (num >> 16) + percent;
  var g = ((num >> 8) & 0x00FF) + percent;
  var b = (num & 0x0000FF) + percent;
  r = Math.max(Math.min(255, r), 0);
  g = Math.max(Math.min(255, g), 0);
  b = Math.max(Math.min(255, b), 0);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

        var invoicePaid = DB.invoices.filter(function(i){ return i.projectId === pid; })

        var retention = DB.invoices.filter(function(i){ return i.projectId === pid; })
          .reduce(function(s, inv){ return s + invoiceCalc(inv).retention; }, 0);
        var actual = cashOut + invoicePaid + retention;

        var variance = earnedValue - actual;
        var cpi = actual ? earnedValue / actual : 0;

defRoute('cash-forecast', {

    h += '</div>';
    
    var months = [];
    for(var m = 0; m < 3; m++){
      var start = todayISO();
      var end = addDays(today, (m + 1) * 30);
      var label = 'ماه ' + fmt(m + 1);
      var inflow = 0, outflow = 0;
      var details = [];
      
      /* چک‌های دریافتی */

        return c.type === 'in' && c.status !== 'cleared' && c.due >= start && c.due <= end;
      }).forEach(function(c){
        inflow += num(c.amount);
        details.push({ icon: '📥', text: 'چک ' + (c.no || '') + ' — ' + money(c.amount), color: '#1E9E63' });
      });
      
      /* چک‌های پرداختی */
      DB.checks.filter(function(c){
        return c.type === 'out' && c.status !== 'cleared' && c.due >= start && c.due <= end;
      }).forEach(function(c){
        outflow += num(c.amount);
        details.push({ icon: '📤', text: 'چک ' + (c.no || '') + ' — ' + money(c.amount), color: '#C0392B' });
      });
      
      /* صورت‌وضعیت‌های معوق */
      DB.invoices.forEach(function(inv){
        var c = invoiceCalc(inv);
        var rem = c.net - invoicePaid(inv);
        if(rem > 0.5){
          var due = addDays(inv.date, DB.settings.terms || 30);
          if(due >= start && due <= end){
            inflow += rem;
            details.push({ icon: '🧾', text: 'صورت‌وضعیت ' + (inv.no || '') + ' — ' + money(rem), color: '#1E9E63' });
          }
        }
      });
      
      months.push({ label: label, start: start, end: end, inflow: inflow, outflow: outflow, details: details, net: inflow - outflow });
    }
    
    var totalIn = months.reduce(function(s, m){ return s + m.inflow; }, 0);
    var totalOut = months.reduce(function(s, m){ return s + m.outflow; }, 0);
    
    h += '<div class="grid g3 mb">';

    h += '</div>';
    
    months.forEach(function(m){

      }
      h += '</div>';
    });
    
    return h;
  }
});

setInterval(function(){

  bind_plumbing2: function(){
    function calc(){
      var sh=num($('#pl_shower').value)||0, wc=num($('#pl_wc').value)||0, k=num($('#pl_k').value)||0, A=num($('#pl_A').value)||0;
      var quality=$('#pl_q').value;
      if(A<=0) return;
      
      /* ===== حمام ===== */
      var shH = '';
      shH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>دوش (شیر توکار یا روکار)</span><b>' + sh + ' عدد</b></div>';
      shH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>سردوش</span><b>' + (sh*1) + ' عدد</b></div>';
      shH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر مخلوط روشویی حمام</span><b>' + (sh*1) + ' عدد</b></div>';
      shH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر توالت (اگر حمام توالت داره)</span><b>' + (sh*0.5>0?Math.ceil(sh*0.5):0) + ' عدد</b></div>';
      shH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر فشاری (دوش حمام ایرانی)</span><b>' + sh + ' عدد</b></div>';
      shH += '<div class="row" style="justify-content:space-between;padding:6px 0"><span>سیفون کف</span><b>' + sh + ' عدد</b></div>';
      $('#pl_shower_result').innerHTML = shH;
      
      /* ===== سرویس (توالت) ===== */
      var wcH = '';
      wcH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر توالت (فلاش تانک)</span><b>' + wc + ' عدد</b></div>';
      wcH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر مخلوط روشویی</span><b>' + wc + ' عدد</b></div>';
      wcH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر مخلوط توالت (شطاف)</span><b>' + wc + ' عدد</b></div>';
      wcH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر آب سرویس (آب خوری)</span><b>' + wc + ' عدد</b></div>';
      wcH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>سیفون کف سرویس</span><b>' + wc + ' عدد</b></div>';
      wcH += '<div class="row" style="justify-content:space-between;padding:6px 0"><span>شیر فشاری توالت (اگر ایرانی)</span><b>' + Math.ceil(wc*0.5) + ' عدد</b></div>';
      $('#pl_wc_result').innerHTML = wcH;
      
      /* ===== آشپزخانه ===== */
      var kH = '';
      kH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر مخلوط سینک ظرفشویی</span><b>' + k + ' عدد</b></div>';
      kH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر آب لباسشویی</span><b>' + k + ' عدد</b></div>';
      kH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر ماشین ظرفشویی</span><b>' + k + ' عدد</b></div>';
      kH += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>شیر یخچال (ساید یا آبسردکن)</span><b>' + k + ' عدد</b></div>';
      kH += '<div class="row" style="justify-content:space-between;padding:6px 0"><span>سیفون کف</span><b>' + k + ' عدد</b></div>';
      $('#pl_k_result').innerHTML = kH;
      
      /* ===== لوله‌ها ===== */
      /* PPR برای آب سرد و گرم */
      var pprHot = Math.ceil((sh*15 + wc*8 + k*8 + A*0.15) * 1.15);
      var pprCold = Math.ceil(pprHot * 0.8);
      /* PVC برای فاضلاب */
      var pvcBig = Math.ceil((wc + sh) * 8); /* لوله ۱۱۰ برای توالت */
      var pvcSmall = Math.ceil((wc*3 + sh*3 + k*4 + A*0.1) * 1.1); /* لوله ۵۰ */
      /* اتصالات */
      var elbows = Math.ceil((pprHot + pprCold) / 3);
      var tees = Math.ceil((pprHot + pprCold) / 4);

        '<b style="color:var(--primary);font-size:13px">🔵 لوله PPR (آب سرد و گرم)</b>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>لوله آب سرد (۲۰mm)</span><b>' + pprCold + ' متر</b></div>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>لوله آب گرم (۲۰mm)</span><b>' + pprHot + ' متر</b></div>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>زانویی ۹۰ درجه</span><b>' + elbows + ' عدد</b></div>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>سه‌راهی</span><b>' + tees + ' عدد</b></div>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>شیر قطع‌کن</span><b>' + valves + ' عدد</b></div>' +
        '</div>' +
        '<div class="card" style="background:#f8fafc;box-shadow:none;padding:10px">' +
        '<b style="color:var(--primary);font-size:13px">⚫ لوله PVC (فاضلاب)</b>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>لوله ۱۱۰ (توالت)</span><b>' + pvcBig + ' متر</b></div>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>لوله ۵۰ (روشویی/سینک)</span><b>' + pvcSmall + ' متر</b></div>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>زانویی فاضلاب</span><b>' + Math.ceil((pvcBig+pvcSmall)/3) + ' عدد</b></div>' +
        '<div class="row" style="justify-content:space-between;padding:4px 0"><span>سه‌راهی فاضلاب</span><b>' + Math.ceil((pvcBig+pvcSmall)/4) + ' عدد</b></div>' +
        '</div>' +
        '<div class="small muted mt">کیفیت انتخاب‌شده: ' + (quality==='tookar'?'توکار':quality==='rokar'?'روکار':'ترکیبی') + '</div>';
    }
    ['pl_shower','pl_wc','pl_k','pl_A','pl_q'].forEach(function(id){ var e=document.getElementById(id); if(e) e.oninput=calc; });
    calc();
  },

  bind_door: function(){
    var items = [
      { name: 'درب اتاق', type: 'room', w: 90, h: 210, qty: 3, doors: 1, material: 'wood' },
      { name: 'درب سرویس', type: 'wc', w: 75, h: 210, qty: 2, doors: 1, material: 'wood' }
    ];
    var mats = { wood: 'چوبی', metal: 'فلزی', abs: 'ABS', steel: 'ضدسرقت', glass: 'شیشه‌ای', upvc: 'UPVC' };
    
    function render(){
      var h = '';
      items.forEach(function(it, i){
        h += '<div class="card mb" style="padding:10px">';
        h += '<div class="row" style="justify-content:space-between;margin-bottom:6px"><b class="small">#' + (i+1) + '</b>';
        h += '<button class="btn sm d" onclick="window.__doorDel(' + i + ')" style="padding:2px 8px">×</button></div>';
        h += '<div class="grid g2">';
        h += '<label class="f" style="margin:0"><span>عنوان</span><input type="text" value="' + esc(it.name) + '" oninput="window.__doorUp(' + i + ',\'name\',this.value)"></label>';
        h += '<label class="f" style="margin:0"><span>جنس</span><select onchange="window.__doorUp(' + i + ',\'material\',this.value)">';
        Object.keys(mats).forEach(function(k){ h += '<option value="' + k + '"' + (it.material===k?' selected':'') + '>' + mats[k] + '</option>'; });
        h += '</select></label>';
        h += '</div>';
        h += '<div class="grid g4">';
        h += '<label class="f" style="margin:0"><span>عرض (cm)</span><input type="number" value="' + it.w + '" oninput="window.__doorUp(' + i + ',\'w\',this.value)"></label>';
        h += '<label class="f" style="margin:0"><span>ارتفاع (cm)</span><input type="number" value="' + it.h + '" oninput="window.__doorUp(' + i + ',\'h\',this.value)"></label>';
        h += '<label class="f" style="margin:0"><span>لنگه</span><select onchange="window.__doorUp(' + i + ',\'doors\',this.value)">';
        h += '<option value="1"' + (it.doors===1?' selected':'') + '>تک لنگه</option>';
        h += '<option value="2"' + (it.doors===2?' selected':'') + '>دو لنگه</option>';
        h += '</select></label>';
        h += '<label class="f" style="margin:0"><span>تعداد</span><input type="number" value="' + it.qty + '" oninput="window.__doorUp(' + i + ',\'qty\',this.value)"></label>';
        h += '</div>';
        h += '</div>';
      });
      document.getElementById('doorList').innerHTML = h;
      calc();
    }
    
    window.__doorUp = function(i, k, v){
      if(k==='w'||k==='h'||k==='qty'||k==='doors') items[i][k] = num(v);
      else items[i][k] = v;
      calc();
    };
    window.__doorDel = function(i){ items.splice(i,1); render(); };
    
    function calc(){
      var totalArea = 0, totalQty = 0;
      var byMat = {};
      items.forEach(function(it){
        var area = (it.w/100) * (it.h/100) * it.qty;
        totalArea += area;
        totalQty += it.qty;
        byMat[it.material] = (byMat[it.material] || 0) + it.qty;
      });
      var h = '<div><b>جمع کل درب‌ها:</b> ' + totalQty + ' عدد</div>';
      h += '<div><b>مساحت کل:</b> ' + nfv(totalArea, 2) + ' m²</div>';
      h += '<div class="small muted mt">به تفکیک جنس:</div>';
      Object.keys(byMat).forEach(function(k){
        h += '<div class="row" style="justify-content:space-between;padding:4px 0"><span>' + (mats[k]||k) + '</span><b>' + byMat[k] + ' عدد</b></div>';
      });
      /* یراق‌آلات */
      h += '<div class="mt" style="border-top:1px solid var(--line);padding-top:8px">';
      h += '<div class="row" style="justify-content:space-between;padding:4px 0"><span>قفل و دستگیره</span><b>' + totalQty + ' ست</b></div>';
      h += '<div class="row" style="justify-content:space-between;padding:4px 0"><span>لولا (۳ عدد برای هر درب)</span><b>' + totalQty*3 + ' عدد</b></div>';
      h += '<div class="row" style="justify-content:space-between;padding:4px 0"><span>چهارچوب (متر)</span><b>' + nfv(items.reduce(function(s,it){ return s + ((it.w+it.h*2)/100)*it.qty; },0), 1) + ' متر</b></div>';
      h += '</div>';
      document.getElementById('door_R').innerHTML = h;
    }
    
    document.getElementById('doorAdd').onclick = function(){
      items.push({ name: 'درب جدید', w: 90, h: 210, qty: 1, doors: 1, material: 'wood' });
      render();
    };
    render();
  },

      if(navigator.share) navigator.share({title: 'محاسبه', text: txt}).catch(function(){});
      else { navigator.clipboard.writeText(txt); toast('کپی شد', 'ok'); }
    };
    render();
  }
};
