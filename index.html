<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مانا | مدیریت پروژه ساختمانی</title>
<meta name="theme-color" content="#0F5C4E">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:#f3f5f7;color:#1c2530;font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.2px}
a{color:#0F5C4E;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:root{--primary:#0F5C4E;--primary-700:#0b4539;--primary-100:#e3efec;--primary-50:#f1f7f5;--accent:#C9A227;--danger:#C0392B;--warn:#E08A00;--ok:#1E9E63;--info:#2D7DD2;--bg:#f3f5f7;--card:#fff;--text:#1c2530;--muted:#6b7787;--line:#e6e9ee;--radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);--shadow-lg:0 12px 44px rgba(16,24,40,.16)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5df;border-radius:9px}
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0F5C4E 0%,#0a3d33 100%);color:#fff;padding:16px 12px 24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#C9A227,#e6c65c);display:grid;place-items:center;font-weight:800;color:#0F5C4E;font-size:17px}
.brand b{font-size:16px;display:block;line-height:1.3}
.brand small{color:#a9cdc5;font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;color:#8fbdb4;padding:12px 12px 4px;letter-spacing:.6px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;color:#d3e7e2;font-size:13.2px;transition:.15s;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav a .ic{width:20px;text-align:center;font-size:14px}
.side-foot{margin-top:18px;padding:10px 12px;font-size:11px;color:#8fbdb4;border-top:1px solid rgba(255,255,255,.1)}
.main{padding:0 22px 70px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 0 14px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 72%,rgba(243,245,247,0));z-index:30}
.topbar h1{font-size:19px}
.topbar p{margin:0;color:var(--muted);font-size:12px}
.spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:none;place-items:center;cursor:pointer;font-size:17px}
.top-actions{display:flex;gap:7px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{font-size:14.5px}
.card-h .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--primary)}
.kpi.k-warn:before{background:var(--warn)}.kpi.k-bad:before{background:var(--danger)}
.kpi.k-ok:before{background:var(--ok)}.kpi.k-info:before{background:var(--info)}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f7f9fb;border-color:#d3dae3}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.p:hover{background:var(--primary-700)}
.btn.d{background:#fff;border-color:#f0c4bf;color:var(--danger)}
.btn.g{background:#fff;border-color:#b9e2ce;color:var(--ok)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,92,78,.1)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
textarea{min-height:80px;resize:vertical;line-height:1.9}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{background:#f8fafc;color:#4a5768;font-weight:700;text-align:right;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:8px 11px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
tbody tr:hover{background:#fafcfb}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:left;unicode-bidi:embed}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent}
.b-ok{background:#e8f7f0;color:#137a4c;border-color:#c4ead8}
.b-warn{background:#fdf3e3;color:#a86400;border-color:#f4dcb4}
.b-bad{background:#fdeceb;color:#a82b1e;border-color:#f5c8c3}
.b-info{background:#e9f2fc;color:#1f5fa3;border-color:#c8ddf5}
.b-mut{background:#f1f3f6;color:#5b6676;border-color:#e0e5ec}
.b-pr{background:var(--primary-100);color:var(--primary-700);border-color:#c6ded8}
.bar{height:7px;background:#eef1f5;border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#2f9078);border-radius:99px}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.45);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;animation:pop .16s ease-out}
.modal.wide{max-width:960px}
@keyframes pop{from{transform:translateY(-10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px}
.modal-b{padding:18px;max-height:70vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;background:#fbfcfd;border-radius:0 0 16px 16px}
.x{margin-inline-start:auto;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
#toast{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:#132b26;color:#fff;padding:10px 16px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13px;animation:pop .18s;max-width:330px}
.toast.err{background:#8e2418}.toast.ok{background:#137a4c}
.dp{position:absolute;z-index:300;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px;width:250px}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:700}
.dp-h button{border:0;background:#f2f5f8;border-radius:7px;width:26px;height:26px;cursor:pointer}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-g span{font-size:10.5px;color:var(--muted);padding:3px 0}
.dp-g b{font-size:12.5px;font-weight:500;padding:5px 0;border-radius:7px;cursor:pointer}
.dp-g b:hover{background:var(--primary-50)}
.dp-g b.today{outline:1px solid var(--primary)}
.dp-g b.sel{background:var(--primary);color:#fff}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px}
pre.log{background:#0f1a17;color:#8ff0c9;padding:12px;border-radius:10px;font-size:11.5px;overflow:auto;max-height:340px;direction:ltr;text-align:left;line-height:1.6}
.mana-tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-inline-end:0;top:0;width:262px;transform:translateX(100%);transition:.25s;z-index:120;height:100vh}
  .sidebar.open{transform:none}
  .icon-btn{display:grid}
  .main{padding:0 12px 90px}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .top-actions .btn span{display:none}
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
  .mana-tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:120;background:#fff;border-top:1px solid #e6e9ee;padding:6px 4px;box-shadow:0 -4px 16px rgba(16,24,40,.08)}
  .mana-tabbar a,.mana-tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;border:0;background:transparent;color:#6b7787;font-size:10.5px;font-weight:600;font-family:inherit;text-decoration:none;cursor:pointer;border-radius:10px;min-height:52px}
  .mana-tabbar a.active{color:#0F5C4E;background:#f1f7f5}
  .mana-tabbar i{font-size:20px;font-style:normal;line-height:1}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;width:100%;border-radius:20px 20px 0 0;max-height:94vh}
  .modal-b{max-height:calc(94vh - 130px);overflow-y:auto}
}
@media print{.sidebar,.topbar,.no-print,#toast,.overlay,.mana-tabbar{display:none!important}.app{display:block}.main{padding:0}body{background:#fff}.card{box-shadow:none;border:0}}
@media(max-width:860px){.grid.g2,.grid.g3,.grid.g4,.grid.g5{grid-template-columns:1fr!important}.kpi{min-width:0}.app{grid-template-columns:1fr!important}.sidebar{position:fixed!important;inset-inline-end:0!important;left:auto!important;top:0!important;width:min(280px,80vw)!important;height:100vh!important;transform:translateX(100%)!important;transition:transform .25s!important;z-index:200!important;overflow-y:auto!important}.sidebar.open{transform:translateX(0)!important}.icon-btn{display:grid!important}.overlay{padding:0!important;align-items:flex-end!important}.modal{max-width:100%!important;width:100%!important;border-radius:20px 20px 0 0!important;max-height:94vh!important}.modal-b{max-height:calc(94vh - 130px)!important;overflow-y:auto!important}input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px!important}.top-actions .btn{width:40px!important;height:40px!important;padding:0!important;justify-content:center!important}.top-actions .btn span{display:none!important}}
</style>
<style>
/* ============================================================
   MANA MODERN DESIGN — v2.0
   بازسازی کامل ظاهر — مدرن، تمیز، حرفه‌ای
   ============================================================ */

/* ---------- پالت رنگ مدرن ---------- */
:root{
  --primary:#0F5C4E;
  --primary-700:#094237;
  --primary-600:#0d5044;
  --primary-100:#d8ebe5;
  --primary-50:#ebf4f1;
  --primary-rgb:15,92,78;
  --accent:#D4A72C;
  --accent-rgb:212,167,44;
  --danger:#D93F2E;
  --danger-rgb:217,63,46;
  --warn:#E68600;
  --warn-rgb:230,134,0;
  --ok:#18A564;
  --ok-rgb:24,165,100;
  --info:#3B82F6;
  --info-rgb:59,130,246;

  --bg:#f5f7fa;
  --bg-2:#eef1f5;
  --card:#ffffff;
  --card-hover:#fcfdfe;
  --text:#0f1722;
  --text-2:#334155;
  --muted:#64748b;
  --muted-2:#94a3b8;
  --line:#e2e8f0;
  --line-2:#f1f5f9;

  --radius-xs:8px;
  --radius-sm:12px;
  --radius:16px;
  --radius-lg:20px;
  --radius-xl:24px;

  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.05), 0 4px 12px rgba(15,23,42,.04);
  --shadow:0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.07);
  --shadow-md:0 4px 12px rgba(15,23,42,.07), 0 16px 40px rgba(15,23,42,.10);
  --shadow-lg:0 12px 44px rgba(15,23,42,.16);
  --shadow-focus:0 0 0 3px rgba(var(--primary-rgb),.15);
}

/* ---------- Base ---------- */
body{
  font-family:'Vazirmatn','Segoe UI',system-ui,Tahoma,sans-serif;
  font-feature-settings:'ss01','cv01';
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-size:14.5px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.1px;
}

/* ---------- Sidebar مدرن ---------- */
.sidebar{
  background:linear-gradient(180deg,#0a3d33 0%,#062a23 100%);
  box-shadow:1px 0 30px rgba(15,23,42,.08);
  padding:20px 14px 28px;
}
.brand{
  padding:8px 10px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:16px;
}
.brand .logo{
  width:44px;height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,#D4A72C 0%,#F4D06F 100%);
  box-shadow:0 8px 24px rgba(212,167,44,.35), inset 0 1px 0 rgba(255,255,255,.25);
  font-size:19px;
  color:#062a23;
}
.brand b{font-size:17px;letter-spacing:-.3px}
.brand small{color:rgba(169,205,197,.85);font-size:11px;letter-spacing:.2px}

.nav{gap:3px}
.nav .grp{
  font-size:10px;
  color:rgba(143,189,180,.85);
  padding:16px 14px 6px;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:700;
}
.nav a{
  padding:10px 14px;
  border-radius:12px;
  color:rgba(219,234,230,.9);
  font-size:13.5px;
  font-weight:500;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
}
.nav a:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
  transform:translateX(-2px);
}
.nav a.active{
  background:linear-gradient(90deg,rgba(212,167,44,.18) 0%,rgba(255,255,255,.06) 100%);
  color:#fff;
  font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent), 0 2px 8px rgba(0,0,0,.15);
}
.nav a .ic{
  width:22px;
  font-size:16px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
}
.side-foot{
  margin-top:22px;
  padding:14px 14px;
  font-size:11px;
  color:rgba(143,189,180,.7);
  border-top:1px solid rgba(255,255,255,.06);
  line-height:1.9;
}

/* ---------- Topbar ---------- */
.main{padding:0 26px 80px}
.topbar{
  padding:20px 0 18px;
  background:linear-gradient(180deg,var(--bg) 60%,rgba(245,247,250,.5) 100%);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.topbar h1{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
  color:var(--text);
}
.topbar p{
  font-size:12.5px;
  color:var(--muted);
  margin-top:2px;
}
.top-actions{gap:8px}
.icon-btn{
  border-radius:12px;
  background:var(--card);
  box-shadow:var(--shadow-xs);
  border:1px solid var(--line);
  transition:all .18s;
  width:40px;height:40px;
  font-size:18px;
}
.icon-btn:hover{
  box-shadow:var(--shadow-sm);
  transform:translateY(-1px);
}

/* ---------- Cards ---------- */
.card{
  background:var(--card);
  border:1px solid rgba(226,232,240,.7);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:20px;
  transition:box-shadow .22s cubic-bezier(.4,0,.2,1), transform .22s cubic-bezier(.4,0,.2,1);
}
.card:hover{box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-h{margin-bottom:16px}
.card-h h3{
  font-size:15.5px;
  font-weight:700;
  letter-spacing:-.3px;
  color:var(--text);
}

/* ---------- KPI Cards — مدرن ---------- */
.kpi{
  background:linear-gradient(135deg,#fff 0%,#fbfdfd 100%);
  border:1px solid rgba(226,232,240,.8);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow-sm);
  transition:all .25s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
}
.kpi:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
  border-color:rgba(var(--primary-rgb),.2);
}
.kpi:before{
  content:'';
  position:absolute;
  inset:auto 0 0 0;
  height:3px;
  background:linear-gradient(90deg,var(--primary) 0%,var(--primary-600) 100%);
  transition:height .25s;
}
.kpi:hover:before{height:4px}
.kpi.k-warn:before{background:linear-gradient(90deg,#E68600,#F4B24D)}
.kpi.k-bad:before{background:linear-gradient(90deg,#D93F2E,#E66D5E)}
.kpi.k-ok:before{background:linear-gradient(90deg,#18A564,#4FCB93)}
.kpi.k-info:before{background:linear-gradient(90deg,#3B82F6,#60A5FA)}

.kpi .lbl{
  font-size:12px;
  color:var(--muted);
  font-weight:600;
  letter-spacing:-.1px;
  display:flex;
  align-items:center;
  gap:7px;
  text-transform:none;
}
.kpi .val{
  font-size:26px;
  font-weight:800;
  margin-top:8px;
  letter-spacing:-1px;
  line-height:1.35;
  font-variant-numeric:tabular-nums;
  color:var(--text);
}
.kpi .sub{
  font-size:11.5px;
  color:var(--muted-2);
  margin-top:4px;
  font-weight:500;
}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:12px;
  padding:10px 16px;
  font-size:13px;
  font-weight:600;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  color:var(--text-2);
  box-shadow:var(--shadow-xs);
  letter-spacing:-.1px;
}
.btn:hover{
  background:#fafbfc;
  border-color:#d4dce5;
  box-shadow:var(--shadow-sm);
  transform:translateY(-1px);
  color:var(--text);
}
.btn:active{transform:translateY(0);box-shadow:var(--shadow-xs)}
.btn.p{
  background:linear-gradient(180deg,#0F5C4E 0%,#0a4a3f 100%);
  border-color:var(--primary-700);
  color:#fff;
  box-shadow:0 1px 2px rgba(var(--primary-rgb),.2), 0 4px 12px rgba(var(--primary-rgb),.2);
}
.btn.p:hover{
  background:linear-gradient(180deg,#0d5145 0%,#083d34 100%);
  box-shadow:0 2px 4px rgba(var(--primary-rgb),.25), 0 8px 20px rgba(var(--primary-rgb),.28);
  transform:translateY(-1px);
}
.btn.d{
  background:linear-gradient(180deg,#fff 0%,#fef6f5 100%);
  border-color:#f5c4bf;
  color:var(--danger);
}
.btn.d:hover{
  background:linear-gradient(180deg,#fff5f4 0%,#fdedeb 100%);
  border-color:#eaa39a;
}
.btn.g{
  background:linear-gradient(180deg,#fff 0%,#f3fbf7 100%);
  border-color:#bae5cd;
  color:var(--ok);
}
.btn.g:hover{background:linear-gradient(180deg,#effaf5 0%,#e5f6ee 100%)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}

/* ---------- Inputs ---------- */
input[type=text],
input[type=number],
input[type=date],
input[type=email],
input[type=tel],
select,
textarea{
  border:1.5px solid var(--line);
  border-radius:11px;
  padding:11px 14px;
  background:#fbfcfd;
  outline:none;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  font-size:13.5px;
  color:var(--text);
  font-weight:500;
}
input:focus,
select:focus,
textarea:focus{
  background:#fff;
  border-color:var(--primary);
  box-shadow:var(--shadow-focus);
}
input::placeholder,
textarea::placeholder{color:var(--muted-2);font-weight:400}
label.f>span{
  font-size:12px;
  color:var(--text-2);
  margin-bottom:6px;
  font-weight:600;
  letter-spacing:-.1px;
  display:block;
}
label.f{margin-bottom:14px}
textarea{
  min-height:90px;
  line-height:1.9;
  font-family:inherit;
}

/* ---------- Tables ---------- */
.tbl-wrap{
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
table{font-size:13px}
th{
  background:linear-gradient(180deg,#f8fafc 0%,#f4f7fa 100%);
  color:var(--text-2);
  padding:13px 14px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.2px;
  text-transform:none;
  border-bottom:1px solid var(--line);
}
td{
  padding:13px 14px;
  border-bottom:1px solid var(--line-2);
  color:var(--text);
  font-weight:500;
}
tbody tr{transition:background .15s}
tbody tr:hover{background:#fafcfd}
tbody tr:last-child td{border-bottom:0}

/* ---------- Badges ---------- */
.badge{
  padding:4px 11px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.1px;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.b-ok{background:linear-gradient(180deg,#e7f7ef,#dff3e8);color:#0f7a4a;border-color:#b8e8cd}
.b-warn{background:linear-gradient(180deg,#fff5e0,#fdeecd);color:#9a5c00;border-color:#f5d99a}
.b-bad{background:linear-gradient(180deg,#feeae7,#fde0dc);color:#a7281a;border-color:#f5c0b8}
.b-info{background:linear-gradient(180deg,#e8f2fe,#ddeafd);color:#1d5fb8;border-color:#bed7f7}
.b-mut{background:linear-gradient(180deg,#f3f5f8,#eef1f5);color:#4a5568;border-color:#dce1e8}
.b-pr{background:linear-gradient(180deg,#e0f0ec,#d5ebe5);color:#0a4a3f;border-color:#b8d9d0}

/* ---------- Modal ---------- */
.overlay{
  background:rgba(15,23,42,.5);
  backdrop-filter:blur(8px) saturate(150%);
  -webkit-backdrop-filter:blur(8px) saturate(150%);
  padding:40px 16px;
  animation:fadeIn .2s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal{
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(226,232,240,.6);
  animation:slideUp .28s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
  background:var(--card);
}
.modal.wide{max-width:1000px}
.modal-h{
  padding:20px 24px;
  background:linear-gradient(180deg,#fff 0%,#fbfcfd 100%);
  border-bottom:1px solid var(--line);
}
.modal-h h3{
  font-size:16px;
  font-weight:700;
  letter-spacing:-.3px;
  color:var(--text);
}
.x{
  width:32px;
  height:32px;
  border-radius:9px;
  background:#f4f6f9;
  color:var(--muted);
  transition:all .18s;
  display:grid;
  place-items:center;
  font-size:16px;
}
.x:hover{background:#ecedf1;color:var(--danger)}
.modal-b{padding:24px}
.modal-f{
  padding:16px 24px;
  background:linear-gradient(180deg,#fbfcfd 0%,#f7f9fb 100%);
  border-top:1px solid var(--line);
  gap:10px;
}

/* ---------- Toast ---------- */
#toast{
  bottom:24px;
  right:24px;
  gap:10px;
}
.toast{
  background:linear-gradient(135deg,#0a3d33 0%,#062a23 100%);
  padding:14px 20px;
  border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.15);
  font-size:13.5px;
  font-weight:600;
  letter-spacing:-.1px;
  animation:toastIn .3s cubic-bezier(.4,0,.2,1);
  border:1px solid rgba(255,255,255,.1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:none}}
.toast.ok{
  background:linear-gradient(135deg,#18A564 0%,#0f7a4a 100%);
  box-shadow:0 12px 40px rgba(24,165,100,.35), 0 2px 8px rgba(24,165,100,.2);
}
.toast.err{
  background:linear-gradient(135deg,#D93F2E 0%,#a7281a 100%);
  box-shadow:0 12px 40px rgba(217,63,46,.35), 0 2px 8px rgba(217,63,46,.2);
}

/* ---------- Date Picker ---------- */
.dp{
  border-radius:var(--radius);
  box-shadow:var(--shadow-md), 0 0 0 1px rgba(226,232,240,.7);
  padding:14px;
  width:280px;
  animation:slideUp .2s ease-out;
}
.dp-h{
  font-size:14px;
  font-weight:700;
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
}
.dp-h button{
  width:30px;
  height:30px;
  border-radius:9px;
  background:linear-gradient(180deg,#f8fafc,#f3f6f9);
  transition:all .15s;
  font-size:14px;
  display:grid;
  place-items:center;
}
.dp-h button:hover{
  background:var(--primary-50);
  color:var(--primary);
}
.dp-g{gap:3px}
.dp-g span{
  font-size:10.5px;
  font-weight:700;
  color:var(--muted);
  padding:5px 0;
  letter-spacing:.2px;
}
.dp-g b{
  font-size:13px;
  padding:7px 0;
  border-radius:9px;
  transition:all .15s;
}
.dp-g b:hover{
  background:var(--primary-50);
  color:var(--primary);
  transform:scale(1.08);
}
.dp-g b.today{
  outline:0;
  box-shadow:inset 0 0 0 1.5px var(--accent);
  font-weight:700;
}
.dp-g b.sel{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-600) 100%);
  color:#fff;
  font-weight:700;
  box-shadow:0 4px 12px rgba(var(--primary-rgb),.35);
}

/* ---------- Progress Bars ---------- */
.bar{
  height:8px;
  background:linear-gradient(180deg,#eef1f5,#e8ecf1);
  border-radius:99px;
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(15,23,42,.06);
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#0F5C4E 0%,#2f9078 50%,#4db399 100%);
  border-radius:99px;
  box-shadow:0 1px 3px rgba(var(--primary-rgb),.35), inset 0 1px 0 rgba(255,255,255,.3);
  transition:width .5s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.bar>i:after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.35) 50%,transparent 100%);
  animation:shimmer 2.5s infinite;
  border-radius:99px;
}
@keyframes shimmer{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* ---------- Auto badge on badges ---------- */
[class*="b-"]{padding:4px 10px}

/* ---------- Charts ---------- */
.chart{
  filter:drop-shadow(0 2px 6px rgba(15,23,42,.06));
}
.legend{
  gap:16px;
  font-size:12px;
  color:var(--text-2);
  font-weight:500;
}
.legend i{
  width:12px;
  height:12px;
  border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}

/* ---------- Empty States ---------- */
.muted{
  color:var(--muted);
  font-weight:500;
}

/* ---------- Mobile tabbar ---------- */
.mana-tabbar{
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  background:rgba(255,255,255,.92);
  box-shadow:0 -4px 24px rgba(15,23,42,.08);
  border-top:1px solid rgba(226,232,240,.7);
}
.mana-tabbar a,
.mana-tabbar button{
  transition:all .18s;
  border-radius:12px;
  position:relative;
}
.mana-tabbar a i,
.mana-tabbar button i{
  font-size:22px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.1));
  transition:transform .2s;
}
.mana-tabbar a.active{
  background:linear-gradient(180deg,var(--primary-50) 0%,var(--primary-100) 100%);
  color:var(--primary);
}
.mana-tabbar a.active i{transform:scale(1.1)}

/* ---------- FAB (دستیار) ---------- */
#manaFab{
  background:linear-gradient(135deg,#0F5C4E 0%,#0a3d33 100%);
  box-shadow:0 8px 28px rgba(var(--primary-rgb),.4), 0 4px 12px rgba(var(--primary-rgb),.3), inset 0 1px 0 rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.1);
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
#manaFab:hover{
  transform:translateY(-4px) scale(1.08);
  box-shadow:0 12px 36px rgba(var(--primary-rgb),.5), 0 6px 16px rgba(var(--primary-rgb),.35), inset 0 1px 0 rgba(255,255,255,.2);
}

/* ---------- Dark Mode (کامل) ---------- */
html[data-theme="dark"]{
  --bg:#0a0f14;
  --bg-2:#0d1319;
  --card:#131b22;
  --card-hover:#16202a;
  --text:#e6ecf2;
  --text-2:#cbd5e1;
  --muted:#8a97a7;
  --muted-2:#64748b;
  --line:#1f2a35;
  --line-2:#182530;
  --primary:#2fa88f;
  --primary-600:#26937c;
  --primary-700:#1d7a67;
  --primary-100:#123c34;
  --primary-50:#0d2b25;
  --primary-rgb:47,168,143;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --shadow:0 2px 6px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.4);
  --shadow-md:0 4px 12px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
  --shadow-lg:0 12px 44px rgba(0,0,0,.6);
}
html[data-theme="dark"] body{
  background:linear-gradient(180deg,#0a0f14 0%,#0d1319 100%);
}
html[data-theme="dark"] .sidebar{
  background:linear-gradient(180deg,#061c16 0%,#04120e 100%);
}
html[data-theme="dark"] .kpi{
  background:linear-gradient(135deg,#131b22 0%,#0f161d 100%);
  border-color:rgba(47,168,143,.12);
}
html[data-theme="dark"] .kpi .val{
  background:linear-gradient(180deg,#e6ecf2,#a8b6c5);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
html[data-theme="dark"] .card{
  background:var(--card);
  border-color:rgba(47,168,143,.1);
}
html[data-theme="dark"] .btn{
  background:#1a2330;
  border-color:#2a3542;
  color:#cbd5e1;
}
html[data-theme="dark"] .btn:hover{background:#222f3e;border-color:#3a4756;color:#e6ecf2}
html[data-theme="dark"] .btn.p{
  background:linear-gradient(180deg,#2fa88f,#26937c);
  border-color:#26937c;
  color:#04140f;
}
html[data-theme="dark"] input,
html[data-theme="dark"] select,
html[data-theme="dark"] textarea{
  background:#0f171e;
  border-color:#2a3542;
  color:#e6ecf2;
}
html[data-theme="dark"] input:focus,
html[data-theme="dark"] select:focus,
html[data-theme="dark"] textarea:focus{
  background:#0a1017;
  border-color:#2fa88f;
}
html[data-theme="dark"] th{
  background:linear-gradient(180deg,#131b22,#101820);
  color:#94a3b8;
}
html[data-theme="dark"] td{
  border-color:#182530;
  color:#cbd5e1;
}
html[data-theme="dark"] tbody tr:hover{background:#121c24}
html[data-theme="dark"] .modal{
  background:#131b22;
  box-shadow:0 24px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(47,168,143,.15);
}
html[data-theme="dark"] .modal-h{background:linear-gradient(180deg,#131b22,#0f161d)}
html[data-theme="dark"] .modal-f{background:linear-gradient(180deg,#0f161d,#0a1017)}
html[data-theme="dark"] .x{background:#1a2330;color:#8a97a7}
html[data-theme="dark"] .x:hover{background:#2a1614;color:#e0a396}
html[data-theme="dark"] .mana-tabbar{
  background:rgba(19,27,34,.95);
  border-color:#1f2a35;
}
html[data-theme="dark"] .overlay{background:rgba(0,0,0,.7)}
html[data-theme="dark"] .dp{
  background:#131b22;
  border-color:#2a3542;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
}
html[data-theme="dark"] .dp-h{border-color:#1f2a35}
html[data-theme="dark"] .dp-h button{background:#1a2330;color:#cbd5e1}
html[data-theme="dark"] .dp-h button:hover{background:#123c34;color:#4db399}
html[data-theme="dark"] .dp-g b:hover{background:#123c34;color:#4db399}
html[data-theme="dark"] .dp-g b.sel{background:linear-gradient(135deg,#2fa88f,#26937c);color:#04140f}
html[data-theme="dark"] .badge.b-ok{background:linear-gradient(180deg,#0d2b25,#0a2620);color:#4db399;border-color:#1d4a3a}
html[data-theme="dark"] .badge.b-warn{background:linear-gradient(180deg,#2b2110,#251c0d);color:#f0c875;border-color:#4d3810}
html[data-theme="dark"] .badge.b-bad{background:linear-gradient(180deg,#2a1614,#25120f);color:#e0a396;border-color:#4a1f18}
html[data-theme="dark"] .badge.b-info{background:linear-gradient(180deg,#101f30,#0c1926);color:#60a5fa;border-color:#1e3d5c}
html[data-theme="dark"] .badge.b-mut{background:linear-gradient(180deg,#1a2330,#151d28);color:#8a97a7;border-color:#2a3542}
html[data-theme="dark"] .badge.b-pr{background:linear-gradient(180deg,#123c34,#0d302a);color:#4db399;border-color:#1d4a3a}
html[data-theme="dark"] .bar{background:#1a2330;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
html[data-theme="dark"] .toast{

  border-color:rgba(47,168,143,.2);
}
html[data-theme="dark"] .toast.ok{background:linear-gradient(135deg,#0f7a4a,#0a5c37)}
html[data-theme="dark"] .toast.err{background:linear-gradient(135deg,#a7281a,#7a1c11)}
html[data-theme="dark"] pre.log{background:#060a0d;color:#4db399;border:1px solid #1a2330}
html[data-theme="dark"] .topbar{
  background:linear-gradient(180deg,#0a0f14 60%,rgba(10,15,20,.5) 100%);
}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2a3542}
html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:#3a4756}

/* ---------- Animation on page load ---------- */
.card,
.kpi{
  animation:cardFadeIn .4s cubic-bezier(.4,0,.2,1) backwards;
}
.kpi{animation-delay:.05s}
.grid .kpi:nth-child(2){animation-delay:.08s}
.grid .kpi:nth-child(3){animation-delay:.11s}
.grid .kpi:nth-child(4){animation-delay:.14s}
.grid .kpi:nth-child(5){animation-delay:.17s}
@keyframes cardFadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* ---------- Mobile adjustments ---------- */
@media (max-width:860px){
  body{font-size:14px}
  .main{padding:0 14px 100px}
  .topbar{padding:14px 0 12px}
  .topbar h1{font-size:17px}
  .card{padding:16px;border-radius:14px}
  .kpi{padding:14px 16px;border-radius:14px}
  .kpi .val{font-size:20px}
  .btn{padding:11px 16px;font-size:13.5px;min-height:44px}
  .btn.sm{padding:8px 12px;min-height:38px;font-size:12.5px}
  input,select,textarea{font-size:16px;padding:13px 14px;min-height:48px;border-radius:12px}
  .overlay{padding:0;align-items:flex-end}
  .modal{
    border-radius:22px 22px 0 0;
    max-height:96vh;
    animation:modalSlideUp .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes modalSlideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
  }
  .modal-h{padding:18px 20px;position:sticky;top:0;z-index:5}
  .modal-b{padding:20px;max-height:calc(96vh - 140px)}
  .modal-f{padding:14px 20px;gap:8px}
  .modal-f .btn{flex:1}
  .dp{width:calc(100vw - 32px);max-width:340px}
  th,td{padding:11px 12px;font-size:12.5px}
}

/* ---------- Print — تمیز ---------- */
@media print{
  body{background:#fff}
  .sidebar,.topbar,.mana-tabbar,#manaFab,#toast,.overlay{display:none!important}
  .main{padding:0}
  .card,.kpi{
    box-shadow:none;
    border:1px solid #e0e0e0;
    animation:none;
  }
}

function j2d(jy, jm, jd){ var r = jalCal(jy); return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - _div(jm, 7) * (jm - 7) + jd - 1; }

function svgLineChart(series, labels, opt){ opt = opt || {}; var W = opt.w || 760, H = opt.h || 280; var P = { t: 16, r: 16, b: 34, l: 66 }; var all = []; series.forEach(function(s){ s.data.forEach(function(v){ if(isFinite(v)) all.push(v); }); }); var max = Math.max.apply(null, all.concat([1])) * 1.08; var min = opt.min != null ? opt.min : 0; var iw = W - P.l - P.r, ih = H - P.t - P.b; var n = Math.max(labels.length - 1, 1); var X = function(i){ return P.l + (i / n) * iw; }; var Y = function(v){ return P.t + ih - ((v - min) / (max - min || 1)) * ih; }; var g = ''; for(var i = 0; i <= 4; i++){ var y = P.t + (ih / 4) * i, v = max - ((max - min) / 4) * i; g += '<line x1="' + P.l + '" y1="' + y + '" x2="' + (W - P.r) + '" y2="' + y + '" stroke="#eef1f5"/>'; g += '<text x="' + (P.l - 8) + '" y="' + (y + 4) + '" font-size="10" fill="#8894a3" text-anchor="end">' + fmt(v / 1e9, 1) + 'B</text>'; } labels.forEach(function(lb, i){ if(labels.length <= 12 || i % Math.ceil(labels.length / 10) === 0){ g += '<text x="' + X(i) + '" y="' + (H - 12) + '" font-size="10" fill="#8894a3" text-anchor="middle">' + esc(lb) + '</text>'; } }); var paths = ''; series.forEach(function(s){ var pts = s.data.map(function(v, i){ return X(i) + ',' + Y(v); }).join(' '); paths += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'; s.data.forEach(function(v, i){ paths += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="3.4" fill="#fff" stroke="' + s.color + '" stroke-width="2"/>'; }); }); var legend = series.map(function(s){ return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join(''); return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + paths + '</svg><div class="legend">' + legend + '</div>'; }
function svgBarChart(items, opt){ opt = opt || {}; var W = opt.w || 620, H = opt.h || 230; var P = { t: 14, r: 14, b: 44, l: 60 }; var max = Math.max.apply(null, items.map(function(i){ return i.v; }).concat([1])) * 1.15; var iw = W - P.l - P.r, ih = H - P.t - P.b; var bw = iw / items.length; var g = ''; for(var i = 0; i <= 4; i++){ var y = P.t + (ih / 4) * i; g += '<line x1="' + P.l + '" y1="' + y + '" x2="' + (W - P.r) + '" y2="' + y + '" stroke="#eef1f5"/>'; g += '<text x="' + (P.l - 8) + '" y="' + (y + 4) + '" font-size="10" fill="#8894a3" text-anchor="end">' + fmt(max - ((max / 4) * i)) + '</text>'; } items.forEach(function(it, i){ var h = (it.v / max) * ih; var x = P.l + i * bw + bw * 0.18; var w = bw * 0.64; g += '<rect x="' + x + '" y="' + (P.t + ih - h) + '" width="' + w + '" height="' + Math.max(h, 1) + '" rx="5" fill="' + (it.c || '#0F5C4E') + '"/>'; g += '<text x="' + (x + w / 2) + '" y="' + (P.t + ih - h - 6) + '" font-size="10.5" fill="#4a5768" text-anchor="middle">' + fmt(it.v) + '</text>'; g += '<text x="' + (P.l + i * bw + bw / 2) + '" y="' + (H - 16) + '" font-size="11" fill="#4a5768" text-anchor="middle">' + esc(it.l) + '</text>'; }); return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">' + g + '</svg>'; }

function computeCPM(acts){ var A = acts.map(function(a){ return { id: a.id, name: a.name, dur: Number(a.dur) || 0, progress: a.progress || 0, deps: (a.deps || []).map(function(d){ return typeof d === 'string' ? { id: d, lag: 0 } : { id: d.id, lag: Number(d.lag) || 0 }; }) }; }); var byId = {}; A.forEach(function(a){ byId[a.id] = a; }); var indeg = {}, adj = {}; A.forEach(function(a){ indeg[a.id] = 0; adj[a.id] = []; }); A.forEach(function(a){ a.deps.forEach(function(d){ if(byId[d.id]){ adj[d.id].push(a.id); indeg[a.id]++; } }); }); var q = A.filter(function(a){ return indeg[a.id] === 0; }).map(function(a){ return a.id; }); var order = []; while(q.length){ var id = q.shift(); order.push(id); adj[id].forEach(function(n){ if(--indeg[n] === 0) q.push(n); }); } if(order.length < A.length) return { error: 'چرخه در وابستگی‌ها' }; A.forEach(function(a){ a.ES = 0; a.EF = a.dur; }); order.forEach(function(id){ var a = byId[id]; a.ES = a.deps.reduce(function(m, d){ return byId[d.id] ? Math.max(m, byId[d.id].EF + (d.lag || 0)) : m; }, 0); a.EF = a.ES + a.dur; }); var dur = Math.max.apply(null, A.map(function(a){ return a.EF; }).concat([0])); A.forEach(function(a){ a.LF = dur; }); order.slice().reverse().forEach(function(id){ var a = byId[id]; var succ = adj[id].map(function(s){ return byId[s]; }); if(succ.length){ a.LF = Math.min.apply(null, succ.map(function(s){ var d = (s.deps || []).find(function(x){ return x.id === id; }) || {}; return s.LS - (d.lag || 0); })); } a.LS = a.LF - a.dur; a.TF = +(a.LS - a.ES).toFixed(3); a.critical = Math.abs(a.TF) < 1e-6; }); A.sort(function(x, y){ return x.ES - y.ES || x.EF - y.EF; }); return { activities: A, duration: dur }; }

function invoiceCalc(inv){ var items = inv.items || []; var gross = 0; for(var i = 0; i < items.length; i++){ var it = items[i]; var c = (it.coef != null && it.coef !== '') ? num(it.coef) : 1; if(!c) c = 1; gross += num(it.qty) * num(it.price) * c; } var s = DB.settings; var r = num(inv.retention != null ? inv.retention : s.retention) / 100; var t = num(inv.tax != null ? inv.tax : s.tax) / 100; var ins = num(inv.insurance != null ? inv.insurance : s.insurance) / 100; var v = num(inv.vat != null ? inv.vat : s.vat) / 100; var other = num(inv.otherDed); var retention = gross * r, tax = gross * t, insurance = gross * ins; var base = gross - retention - tax - insurance - other; var vat = base * v; var net = base + vat; return { gross: gross, retention: retention, tax: tax, insurance: insurance, otherDed: other, vat: vat, net: net }; }

act('pdf-current', function(){

function projectStats(p){ var budget = num(p.budget); var progress = num(p.progress); var evm = (p.evm || []).slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; }); var last = evm[evm.length - 1] || { pv: 0, ev: 0, ac: 0 }; var pv = num(last.pv), ev = num(last.ev), ac = num(last.ac); var cpi = ac ? ev / ac : 0, spi = pv ? ev / pv : 0; var invs = DB.invoices.filter(function(i){ return i.projectId === p.id; }); var invoiced = sum(invs, function(i){ return invoiceCalc(i).net; }); var paid = sum(invs, function(i){ return invoicePaid(i); }); return { budget: budget, progress: progress, pv: pv, ev: ev, ac: ac, cpi: cpi, spi: spi, invoiced: invoiced, paid: paid, receivable: invoiced - paid }; }

defRoute('dashboard', {
  title: 'داشبورد مدیریتی',
  sub: function(){ return 'نمای کلی ' + DB.settings.org; },
  render: function(){
    var ps = DB.projects.map(function(p){ return { p: p, s: projectStats(p) }; });
    var budget = sum(ps, function(x){ return x.s.budget; });
    var wProgress = budget ? sum(ps, function(x){ return x.s.progress * x.s.budget; }) / budget : 0;
    var cashIn = sum(DB.cash.filter(function(c){ return c.type === 'in'; }), function(c){ return num(c.amount); });
    var cashOut = sum(DB.cash.filter(function(c){ return c.type === 'out'; }), function(c){ return num(c.amount); });
    var balance = cashIn - cashOut;
    var ev = sum(ps, function(x){ return x.s.ev; }); var pv = sum(ps, function(x){ return x.s.pv; }); var ac = sum(ps, function(x){ return x.s.ac; });
    var cpi = ac ? ev / ac : 0, spi = pv ? ev / pv : 0;
    var lowStock = DB.items.filter(function(i){ return num(i.qty) <= num(i.min); }).length;
    var openTasks = DB.tasks.filter(function(t){ return t.status !== 'done'; }).length;
    var openRisks = DB.risks.filter(function(r){ return r.status !== 'بسته'; }).length;
    var h = '<div class="grid g4">';
    h += '<div class="kpi"><div class="lbl">💰 بودجه کل</div><div class="val">' + money(budget) + '</div><div class="sub">' + fmt(DB.projects.length) + ' پروژه</div></div>';
    h += '<div class="kpi k-info"><div class="lbl">📈 پیشرفت</div><div class="val">' + pct(wProgress) + '</div><div class="sub">میانگین وزنی</div></div>';
    h += '<div class="kpi ' + (balance < 0 ? 'k-bad' : 'k-ok') + '"><div class="lbl">🏦 مانده</div><div class="val">' + money(balance) + '</div></div>';
    h += '<div class="kpi k-info"><div class="lbl">📊 CPI/SPI</div><div class="val">' + fmt(cpi, 2) + ' / ' + fmt(spi, 2) + '</div></div>';
    h += '</div>';
    h += '<div class="grid g4 mt">';
    h += '<div class="kpi k-info"><div class="lbl">🗂 وظایف باز</div><div class="val">' + fmt(openTasks) + '</div></div>';
    h += '<div class="kpi ' + (lowStock ? 'k-warn' : 'k-ok') + '"><div class="lbl">📦 زیر نقطه سفارش</div><div class="val">' + fmt(lowStock) + '</div></div>';
    h += '<div class="kpi ' + (openRisks ? 'k-warn' : 'k-ok') + '"><div class="lbl">⚠️ ریسک باز</div><div class="val">' + fmt(openRisks) + '</div></div>';
    h += '<div class="kpi"><div class="lbl">🧾 صورت‌وضعیت</div><div class="val">' + fmt(DB.invoices.length) + '</div></div>';
    h += '</div>';
    h += '<div class="card mt"><div class="card-h"><h3>پروژه‌ها</h3><div class="sp"></div><button class="btn sm p" data-act="prj-new">+ پروژه</button></div>';
    h += '<div class="tbl-wrap"><table><thead><tr><th>کد</th><th>نام</th><th>پیشرفت</th><th>بودجه</th><th>SPI</th><th>CPI</th><th></th></tr></thead><tbody>';
    if(!ps.length) h += '<tr><td colspan="7" class="muted" style="text-align:center;padding:26px">پروژه‌ای ثبت نشده.</td></tr>';
    ps.forEach(function(x){
      h += '<tr><td class="num">' + esc(x.p.code || '—') + '</td><td><b>' + esc(x.p.name) + '</b></td>';
      h += '<td><div class="row" style="gap:7px"><div class="bar" style="flex:1"><i style="width:' + clamp(x.s.progress, 0, 100) + '%"></i></div><span class="small num">' + pct(x.s.progress, 0) + '</span></div></td>';
      h += '<td class="num">' + money(x.s.budget) + '</td>';
      h += '<td><span class="badge ' + (x.s.spi >= 1 ? 'b-ok' : 'b-warn') + '">' + (x.s.spi ? fmt(x.s.spi, 2) : '—') + '</span></td>';
      h += '<td><span class="badge ' + (x.s.cpi >= 1 ? 'b-ok' : 'b-warn') + '">' + (x.s.cpi ? fmt(x.s.cpi, 2) : '—') + '</span></td>';
      h += '<td><button class="btn sm" data-act="go-cpm" data-id="' + x.p.id + '">زمان‌بندی</button></td></tr>';
    });
    h += '</tbody></table></div></div>';
    return h;
  }
});

act('prj-del', function(t){ var p = DB.projects.find(function(x){ return x.id === t.dataset.id; }); if(!p) return; if(!confirm('حذف «' + p.name + '»؟')) return; pushUndo('prj-del'); DB.projects = DB.projects.filter(function(x){ return x.id !== p.id; }); DB.contracts = DB.contracts.filter(function(x){ return x.projectId !== p.id; }); DB.invoices = DB.invoices.filter(function(x){ return x.projectId !== p.id; }); DB.cash = DB.cash.filter(function(x){ return x.projectId !== p.id; }); DB.items = DB.items.filter(function(x){ return x.projectId !== p.id; }); DB.dailies = DB.dailies.filter(function(x){ return x.projectId !== p.id; }); DB.tasks = DB.tasks.filter(function(x){ return x.projectId !== p.id; }); save(); render(); toast('حذف شد', 'ok'); });

act('prj-act', function(t){ var p = DB.projects.find(function(x){ return x.id === t.dataset.id; }); if(!p) return; p.activities = p.activities || []; var res = computeCPM(p.activities); var body = '<div class="tbl-wrap mb" style="max-height:280px"><table><thead><tr><th>فعالیت</th><th>مدت</th><th>پیشرفت</th><th></th></tr></thead><tbody>'; if(!p.activities.length) body += '<tr><td colspan="4" class="muted" style="text-align:center">فعالیتی ثبت نشده</td></tr>'; (res.activities || p.activities).forEach(function(a){ body += '<tr><td>' + esc(a.name) + (a.critical ? ' <span class="badge b-bad">بحرانی</span>' : '') + '</td><td class="num">' + fmt(a.dur) + '</td><td class="num">' + pct(a.progress, 0) + '</td><td><button class="btn sm d" data-act="act-del" data-pid="' + p.id + '" data-id="' + a.id + '">×</button></td></tr>'; }); body += '</tbody></table></div>'; body += '<div class="grid g3"><label class="f"><span>نام</span><input type="text" id="aName"></label><label class="f"><span>مدت (روز)</span><input type="number" id="aDur" value="5"></label><label class="f"><span>پیشرفت (٪)</span><input type="number" id="aProg" value="0"></label></div>'; body += '<label class="f"><span>پیش‌نیاز</span><select id="aDep"><option value="">—</option>'; p.activities.forEach(function(a){ body += '<option value="' + a.id + '">' + esc(a.name) + '</option>'; }); body += '</select></label>'; modal('فعالیت‌های ' + p.name, body, '<button class="btn p" data-act="act-add" data-id="' + p.id + '">افزودن</button><button class="btn" data-act="close-modal">بستن</button>'); });

act('act-add', function(t){ var p = DB.projects.find(function(x){ return x.id === t.dataset.id; }); var name = $('#aName').value.trim(); if(!name) return toast('نام الزامی', 'err'); var dep = $('#aDep').value; pushUndo('act-add'); p.activities.push({ id: uid('act'), name: name, dur: num($('#aDur').value), progress: num($('#aProg').value), deps: dep ? [{ id: dep, lag: 0 }] : [] }); save(); closeModal(); act['prj-act']({ dataset: { id: p.id } }); toast('افزوده شد', 'ok'); });

act('act-del', function(t){ var p = DB.projects.find(function(x){ return x.id === t.dataset.pid; }); pushUndo('act-del'); p.activities = p.activities.filter(function(x){ return x.id !== t.dataset.id; }); p.activities.forEach(function(a){ a.deps = (a.deps || []).filter(function(d){ return (d.id || d) !== t.dataset.id; }); }); save(); closeModal(); act['prj-act']({ dataset: { id: p.id } }); });

function currentProjectId(){ var q = location.hash.split('?')[1] || ''; var m = /id=([^&]+)/.exec(q); if(m) return decodeURIComponent(m[1]); return (DB.projects[0] || {}).id; }

defRoute('cpm', {
  title: 'زمان‌بندی CPM',
  sub: function(){ return 'مسیر بحرانی'; },
  render: function(){
    if(!DB.projects.length) return '<div class="card">ابتدا پروژه تعریف کنید.</div>';
    var p = DB.projects.find(function(x){ return x.id === currentProjectId(); }) || DB.projects[0];
    var res = computeCPM(p.activities || []);
    var h = '<div class="card"><div class="card-h"><label class="f" style="margin:0;min-width:220px"><span>پروژه</span><select data-act-change="switch-prj">';
    DB.projects.forEach(function(x){ h += '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; });
    h += '</select></label><div class="sp"></div><span class="badge b-pr">مدت: ' + (res.duration ? fmt(res.duration) + ' روز' : '—') + '</span></div>';
    if(res.error) return h + '<div class="badge b-bad">' + esc(res.error) + '</div></div>';
    var A = res.activities; var crit = A.filter(function(a){ return a.critical; });
    h += '<div class="grid g3 mt"><div class="kpi"><div class="lbl">مدت پروژه</div><div class="val">' + fmt(res.duration) + '</div></div>';
    h += '<div class="kpi k-bad"><div class="lbl">بحرانی</div><div class="val">' + fmt(crit.length) + '</div></div>';
    h += '<div class="kpi k-info"><div class="lbl">شناوری میانگین</div><div class="val">' + (A.length ? fmt(sum(A, function(a){ return a.TF; }) / A.length, 1) : '—') + '</div></div></div></div>';
    h += '<div class="card mt"><div class="card-h"><h3>جدول CPM</h3></div><div class="tbl-wrap"><table><thead><tr><th>فعالیت</th><th>مدت</th><th>ES</th><th>EF</th><th>TF</th><th>وضعیت</th></tr></thead><tbody>';
    A.forEach(function(a){ h += '<tr><td>' + esc(a.name) + '</td><td class="num">' + fmt(a.dur) + '</td><td class="num">' + fmt(a.ES) + '</td><td class="num">' + fmt(a.EF) + '</td><td class="num">' + fmt(a.TF) + '</td><td>' + (a.critical ? '<span class="badge b-bad">بحرانی</span>' : '<span class="badge b-mut">شناور</span>') + '</td></tr>'; });
    h += '</tbody></table></div></div>';
    return h;
  }
});

defRoute('evm', {
  title: 'تحلیل EVM',
  sub: function(){ return 'PV / EV / AC'; },
  render: function(){
    if(!DB.projects.length) return '<div class="card">ابتدا پروژه تعریف کنید.</div>';
    var p = DB.projects.find(function(x){ return x.id === currentProjectId(); }) || DB.projects[0];
    var rows = (p.evm || []).slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    var h = '<div class="card"><div class="card-h"><label class="f" style="margin:0;min-width:220px"><span>پروژه</span><select data-act-change="switch-prj-evm">';
    DB.projects.forEach(function(x){ h += '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; });
    h += '</select></label><div class="sp"></div><button class="btn sm p" data-act="evm-add" data-id="' + p.id + '">+ دوره</button></div></div>';
    if(!rows.length) return h + '<div class="card mt muted">دوره‌ای ثبت نشده.</div>';
    var last = rows[rows.length - 1];
    var pv = num(last.pv), ev = num(last.ev), ac = num(last.ac);
    var spi = pv ? ev / pv : 0, cpi = ac ? ev / ac : 0;
    var eac = cpi ? num(p.budget) / cpi : 0; var vac = num(p.budget) - eac;
    h += '<div class="grid g4 mt"><div class="kpi k-info"><div class="lbl">PV</div><div class="val">' + money(pv) + '</div></div>';
    h += '<div class="kpi"><div class="lbl">EV</div><div class="val">' + money(ev) + '</div></div>';
    h += '<div class="kpi k-warn"><div class="lbl">AC</div><div class="val">' + money(ac) + '</div></div>';
    h += '<div class="kpi ' + (spi >= 1 ? 'k-ok' : 'k-bad') + '"><div class="lbl">SPI / CPI</div><div class="val">' + fmt(spi, 2) + ' / ' + fmt(cpi, 2) + '</div></div></div>';
    h += '<div class="grid g3 mt"><div class="kpi"><div class="lbl">EAC</div><div class="val">' + money(eac) + '</div></div>';
    h += '<div class="kpi ' + (vac >= 0 ? 'k-ok' : 'k-bad') + '"><div class="lbl">VAC</div><div class="val">' + money(vac) + '</div></div>';
    h += '<div class="kpi k-info"><div class="lbl">تعداد دوره</div><div class="val">' + fmt(rows.length) + '</div></div></div>';
    var labels = rows.map(function(r){ return jStr(r.date); });
    h += '<div class="card mt"><div class="card-h"><h3>منحنی S</h3></div>' + svgLineChart([{ name: 'PV', color: '#2D7DD2', data: rows.map(function(r){ return num(r.pv); }) }, { name: 'EV', color: '#0F5C4E', data: rows.map(function(r){ return num(r.ev); }) }, { name: 'AC', color: '#C0392B', data: rows.map(function(r){ return num(r.ac); }) }], labels) + '</div>';
    return h;
  }
});

act('evm-add', function(t){ var p = DB.projects.find(function(x){ return x.id === t.dataset.id; }); var body = '<div class="grid g2"><label class="f"><span>تاریخ</span>' + jInput('date', todayISO()) + '</label><label class="f"><span>PV</span><input type="number" name="pv" value="0"></label><label class="f"><span>EV</span><input type="number" name="ev" value="0"></label><label class="f"><span>AC</span><input type="number" name="ac" value="0"></label></div>'; modal('دوره EVM', body, '<button class="btn p" data-act="evm-save" data-id="' + p.id + '">ذخیره</button><button class="btn" data-act="close-modal">انصراف</button>'); });

defRoute('contracts', {
  title: 'قرارداد و الحاقیه',
  sub: function(){ return fmt(DB.contracts.length) + ' قرارداد'; },
  render: function(){
    var h = '<div class="card"><div class="card-h"><h3>قراردادها</h3><div class="sp"></div>';
    h += '<button class="btn sm p" data-act="con-new">+ قرارداد جدید</button></div>';
    h += '<div class="tbl-wrap"><table><thead><tr>';
    h += '<th>شماره</th><th>عنوان</th><th>پروژه</th><th>مبلغ</th><th>تاریخ</th><th>تأیید</th><th></th>';
    h += '</tr></thead><tbody>';
    if(!DB.contracts.length) h += '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">قراردادی ثبت نشده.</td></tr>';
    var roots = DB.contracts.filter(function(c){ return !c.parentId; });
    function row(c, depth){
      var p = DB.projects.find(function(x){ return x.id === c.projectId; });
      var chain = c.approvals || [];
      var done = chain.filter(function(a){ return a.status === 'تأیید'; }).length;
      h += '<tr><td class="num">' + esc(c.no || '—') + '</td>';
      h += '<td>' + '—'.repeat(depth * 2) + ' ' + esc(c.title) + '</td>';
      h += '<td>' + esc(p ? p.name : '—') + '</td>';
      h += '<td class="num">' + money(c.amount) + '</td>';
      h += '<td class="num">' + jStr(c.date) + '</td>';
      h += '<td>' + (done === APPROVAL_CHAIN.length ? '<span class="badge b-ok">نهایی</span>' : '<span class="badge b-warn">' + fmt(done) + '/' + fmt(APPROVAL_CHAIN.length) + '</span>') + '</td>';
      h += '<td class="row" style="gap:4px">';
      h += '<button class="btn sm" data-act="con-approve" data-id="' + c.id + '">تأیید</button>';
      h += '<button class="btn sm" data-act="con-add" data-id="' + c.id + '">الحاقیه</button>';
      h += '<button class="btn sm d" data-act="con-del" data-id="' + c.id + '">×</button></td></tr>';
      DB.contracts.filter(function(x){ return x.parentId === c.id; }).forEach(function(x){ row(x, depth + 1); });
    }
    roots.forEach(function(c){ row(c, 0); });
    h += '</tbody></table></div></div>';
    return h;
  }
});

function conForm(c){
  return '<div class="grid g2">' +
    '<label class="f"><span>عنوان *</span><input type="text" name="title" value="' + esc(c ? c.title : '') + '"></label>' +
    '<label class="f"><span>شماره</span><input type="text" name="no" value="' + esc(c ? c.no : '') + '"></label>' +
    '<label class="f"><span>پروژه</span><select name="projectId">' +
    DB.projects.map(function(p){ return '<option value="' + p.id + '"' + (c && c.projectId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
    '</select></label>' +
    '<label class="f"><span>مبلغ</span><input type="number" name="amount" value="' + num(c ? c.amount : 0) + '"></label>' +
    '<label class="f"><span>تاریخ</span>' + jInput('date', c ? c.date : todayISO()) + '</label>' +
    '<label class="f"><span>طرف قرارداد</span><input type="text" name="party" value="' + esc(c ? c.party : '') + '"></label>' +
    '<label class="f"><span>مبلغ پیش‌پرداخت</span><input type="number" name="prepayAmount" value="' + num(c ? c.prepayAmount : 0) + '"></label>' +
    '<label class="f"><span>یا درصد پیش‌پرداخت</span><input type="number" name="prepayPercent" value="' + num(c ? c.prepayPercent : 0) + '"></label>' +
    '</div>' +
    '<label class="f"><span>توضیحات</span><textarea name="desc">' + esc(c ? c.desc : '') + '</textarea></label>';
}

act('con-new', function(){
  if(!DB.projects.length) return toast('ابتدا پروژه تعریف کنید', 'err');
  modal('قرارداد جدید', conForm(null),
    '<button class="btn p" data-act="con-save">ذخیره</button><button class="btn" data-act="close-modal">انصراف</button>');
});

act('con-add', function(t){
  var parent = DB.contracts.find(function(x){ return x.id === t.dataset.id; });
  var c = { title: 'الحاقیه ' + parent.title, no: (parent.no || '') + '-A', projectId: parent.projectId, amount: 0, date: todayISO(), party: parent.party };
  modal('الحاقیه جدید', conForm(c),
    '<button class="btn p" data-act="con-save" data-parent="' + parent.id + '">ذخیره</button><button class="btn" data-act="close-modal">انصراف</button>');
});

act('con-save', function(t){
  var f = readForm($('#overlay'));
  if(!f.title) return toast('عنوان الزامی', 'err');
  pushUndo('con-save');
  var c = Object.assign({ id: uid('con'), approvals: APPROVAL_CHAIN.map(function(r){ return { role: r, status: 'در انتظار', date: null, by: '' }; }) }, f);
  if(t.dataset.parent) c.parentId = t.dataset.parent;
  DB.contracts.push(c);
  save(); closeModal(); render(); toast('ذخیره شد', 'ok');
});

act('con-approve', function(t){
  var c = DB.contracts.find(function(x){ return x.id === t.dataset.id; });
  if(!c) return;
  c.approvals = c.approvals || APPROVAL_CHAIN.map(function(r){ return { role: r, status: 'در انتظار', date: null, by: '' }; });
  var next = c.approvals.find(function(a){ return a.status !== 'تأیید'; });
  if(!next) return toast('قبلاً نهایی شده', 'err');
  pushUndo('con-approve');
  next.status = 'تأیید'; next.date = todayISO(); next.by = next.role;
  save(); render(); toast('تأیید شد: ' + next.role, 'ok');
});

act('con-del', function(t){
  if(!confirm('حذف قرارداد؟')) return;
  pushUndo('con-del');
  DB.contracts = DB.contracts.filter(function(x){ return x.id !== t.dataset.id && x.parentId !== t.dataset.id; });
  save(); render();
});

defRoute('invoices', {
  title: 'صورت‌وضعیت',
  sub: function(){ return fmt(DB.invoices.length) + ' صورت‌وضعیت'; },
  render: function(){
    var h = '<div class="card"><div class="card-h"><h3>فهرست</h3><div class="sp"></div>';
    h += '<button class="btn sm p" data-act="inv-new">+ صورت‌وضعیت</button></div>';
    h += '<div class="tbl-wrap"><table><thead><tr>';
    h += '<th>شماره</th><th>پروژه</th><th>تاریخ</th><th>کارکرد</th><th>خالص</th><th>پرداخت‌شده</th><th>مانده</th><th></th>';
    h += '</tr></thead><tbody>';
    if(!DB.invoices.length) h += '<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">صورت‌وضعیتی ثبت نشده.</td></tr>';
    DB.invoices.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; }).forEach(function(inv){
      var c = invoiceCalc(inv);
      var paid = invoicePaid(inv);
      var rem = c.net - paid;
      var p = DB.projects.find(function(x){ return x.id === inv.projectId; });
      h += '<tr><td class="num">' + esc(inv.no || '—') + '</td>';
      h += '<td>' + esc(p ? p.name : '—') + '</td>';
      h += '<td class="num">' + jStr(inv.date) + '</td>';
      h += '<td class="num">' + money(c.gross) + '</td>';
      h += '<td class="num"><b>' + money(c.net) + '</b></td>';
      h += '<td class="num">' + money(paid) + '</td>';
      h += '<td class="num" style="color:' + (rem > 0.5 ? '#C0392B' : '#1E9E63') + '">' + money(rem) + '</td>';
      h += '<td class="row" style="gap:4px">';
      h += '<button class="btn sm" data-act="inv-view" data-id="' + inv.id + '">جزئیات</button>';
      h += '<button class="btn sm g" data-act="inv-pay" data-id="' + inv.id + '">پرداخت</button>';
      h += '<button class="btn sm d" data-act="inv-del" data-id="' + inv.id + '">×</button></td></tr>';
    });
    h += '</tbody></table></div></div>';
    return h;
  }
});

function invForm(inv){
  var items = (inv && inv.items) || [{ desc: '', qty: 1, unit: 'مترمربع', price: 0, coef: 1 }];
  return '<div class="grid g3">' +
    '<label class="f"><span>شماره</span><input type="text" name="no" value="' + esc(inv ? inv.no : '') + '"></label>' +
    '<label class="f"><span>پروژه</span><select name="projectId">' +
    DB.projects.map(function(p){ return '<option value="' + p.id + '"' + (inv && inv.projectId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
    '</select></label>' +
    '<label class="f"><span>تاریخ</span>' + jInput('date', inv ? inv.date : todayISO()) + '</label>' +
    '</div>' +
    '<label class="f"><span>موضوع</span><input type="text" name="subject" value="' + esc(inv ? inv.subject : '') + '"></label>' +
    '<div class="tbl-wrap mb" style="max-height:280px"><table id="invItems"><thead><tr>' +
    '<th>شرح</th><th style="width:70px">مقدار</th><th style="width:80px">واحد</th><th style="width:90px">قیمت</th><th style="width:70px">ضریب</th><th style="width:100px">جمع</th><th style="width:30px"></th>' +
    '</tr></thead><tbody>' +
    items.map(function(it, i){ return invRow(it, i); }).join('') +
    '</tbody></table></div>' +
    '<button class="btn sm mb" data-act="inv-addrow" type="button">+ ردیف</button>' +
    '<div class="grid g4">' +
    '<label class="f"><span>حسن انجام (٪)</span><input type="number" name="retention" value="' + (inv ? num(inv.retention) : DB.settings.retention) + '"></label>' +
    '<label class="f"><span>مالیات (٪)</span><input type="number" name="tax" value="' + (inv ? num(inv.tax) : DB.settings.tax) + '"></label>' +
    '<label class="f"><span>بیمه (٪)</span><input type="number" name="insurance" value="' + (inv ? num(inv.insurance) : DB.settings.insurance) + '"></label>' +
    '<label class="f"><span>ارزش افزوده (٪)</span><input type="number" name="vat" value="' + (inv ? num(inv.vat) : DB.settings.vat) + '"></label>' +
    '</div>' +
    '<label class="f"><span>سایر کسور (مبلغ)</span><input type="number" name="otherDed" value="' + num(inv ? inv.otherDed : 0) + '"></label>' +
    '<div id="invCalc" class="card" style="background:var(--primary-50)"></div>';
}

function invRow(it, i){
  it = it || { desc: '', qty: 1, unit: '', price: 0, coef: 1 };
  var coef = num(it.coef) || 1;
  return '<tr>' +
    '<td><input type="text" data-f="desc" value="' + esc(it.desc || '') + '"></td>' +
    '<td><input type="number" data-f="qty" value="' + num(it.qty) + '"></td>' +
    '<td><input type="text" data-f="unit" value="' + esc(it.unit || '') + '"></td>' +
    '<td><input type="number" data-f="price" value="' + num(it.price) + '"></td>' +
    '<td><input type="number" data-f="coef" value="' + coef + '" step="0.01"></td>' +
    '<td class="num" data-sum>' + money(num(it.qty) * num(it.price) * coef) + '</td>' +
    '<td><button class="btn sm d" data-act="inv-delrow" type="button">×</button></td>' +
    '</tr>';
}

function collectItems(){
  return $$('#invItems tbody tr').map(function(tr){
    return {
      desc: ($('[data-f=desc]', tr) || {}).value || '',
      qty: num(($('[data-f=qty]', tr) || {}).value),
      unit: ($('[data-f=unit]', tr) || {}).value || '',
      price: num(($('[data-f=price]', tr) || {}).value),
      coef: num(($('[data-f=coef]', tr) || {}).value) || 1
    };
  });
}

function refreshInvCalc(){
  var items = collectItems();
  var gross = sum(items, function(it){ return num(it.qty) * num(it.price) * (num(it.coef) || 1); });
  $$('#invItems tbody tr').forEach(function(tr, i){
    var s = $('[data-sum]', tr);
    if(s && items[i]) s.textContent = money(num(items[i].qty) * num(items[i].price) * (num(items[i].coef) || 1));
  });
  var ov = $('#overlay');
  if(!ov) return;
  var r = num(($('[name=retention]', ov) || {}).value) / 100;
  var t = num(($('[name=tax]', ov) || {}).value) / 100;
  var ins = num(($('[name=insurance]', ov) || {}).value) / 100;
  var v = num(($('[name=vat]', ov) || {}).value) / 100;
  var other = num(($('[name=otherDed]', ov) || {}).value);
  var retention = gross * r, tax = gross * t, insurance = gross * ins;
  var base = gross - retention - tax - insurance - other;
  var vat = base * v;
  var net = base + vat;
  var box = $('#invCalc');
  if(box){
    box.innerHTML = '<div class="grid g4">' +
      '<div><div class="small muted">کارکرد کل</div><b class="num">' + money(gross) + '</b></div>' +
      '<div><div class="small muted">حسن انجام</div><b class="num">' + money(retention) + '</b></div>' +
      '<div><div class="small muted">کسورات</div><b class="num">' + money(tax + insurance + other) + '</b></div>' +
      '<div><div class="small muted">خالص</div><b class="num" style="color:var(--primary);font-size:16px">' + money(net) + '</b></div>' +
      '</div>';
  }
}

document.addEventListener('input', function(e){
  if($('#invItems') && (e.target.closest('#invItems') || e.target.closest('[name=retention],[name=tax],[name=insurance],[name=vat],[name=otherDed]'))) refreshInvCalc();
});

act('inv-addrow', function(){
  var tb = $('#invItems tbody');
  if(!tb) return;
  var tr = document.createElement('tr');
  tr.innerHTML = invRow({ desc: '', qty: 1, unit: '', price: 0, coef: 1 }, tb.children.length).replace(/^<tr[^>]*>/, '').replace(/<\/tr>$/, '');
  tb.appendChild(tr);
  refreshInvCalc();
});
act('inv-delrow', function(t){ var r = t.closest('tr'); if(r) r.remove(); refreshInvCalc(); });

act('inv-new', function(){
  if(!DB.projects.length) return toast('ابتدا پروژه تعریف کنید', 'err');
  modal('صورت‌وضعیت جدید', invForm(null),
    '<button class="btn p" data-act="inv-save">ذخیره</button><button class="btn" data-act="close-modal">انصراف</button>', 'wide');
  refreshInvCalc();
});

act('inv-save', function(){
  var f = readForm($('#overlay'));
  var items = collectItems().filter(function(x){ return x.desc || x.price; });
  if(!items.length) return toast('حداقل یک ردیف وارد کنید', 'err');
  pushUndo('inv-save');
  DB.invoices.push({
    id: uid('inv'), no: f.no, projectId: f.projectId, date: f.date || todayISO(),
    subject: f.subject, items: items, otherDed: num(f.otherDed),
    retention: num(f.retention), tax: num(f.tax), insurance: num(f.insurance), vat: num(f.vat),
    payments: []
  });
  save(); closeModal(); render(); toast('ذخیره شد', 'ok');
});

act('inv-view', function(t){
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  var c = invoiceCalc(inv);
  var paid = invoicePaid(inv);
  var body = '<div class="tbl-wrap mb"><table><thead><tr><th>شرح</th><th>مقدار</th><th>قیمت</th><th>ضریب</th><th>جمع</th></tr></thead><tbody>';
  (inv.items || []).forEach(function(it){
    var coef = num(it.coef) || 1;
    body += '<tr><td>' + esc(it.desc) + '</td><td class="num">' + fmt(it.qty, 2) + '</td><td class="num">' + money(it.price) + '</td><td class="num">' + fmt(coef, 2) + '</td><td class="num">' + money(num(it.qty) * num(it.price) * coef) + '</td></tr>';
  });
  body += '</tbody></table></div>';
  body += '<div class="card" style="box-shadow:none;border:1px solid var(--line)">';
  body += '<div class="row" style="justify-content:space-between"><span>کارکرد کل</span><b class="num">' + money(c.gross) + '</b></div>';
  body += '<div class="row" style="justify-content:space-between"><span>خالص</span><b class="num" style="color:var(--primary)">' + money(c.net) + '</b></div>';
  body += '<div class="row" style="justify-content:space-between"><span>پرداخت‌شده</span><b class="num">' + money(paid) + '</b></div>';
  body += '<div class="row" style="justify-content:space-between"><span>مانده</span><b class="num" style="color:#C0392B">' + money(c.net - paid) + '</b></div>';
  body += '</div>';
  modal('صورت‌وضعیت ' + (inv.no || ''), body,
    '<button class="btn p" data-act="inv-print" data-id="' + inv.id + '">🖨 چاپ</button><button class="btn" data-act="close-modal">بستن</button>', 'wide');
});

act('inv-pay', function(t){
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  closeModal();
  var c = invoiceCalc(inv);
  var rem = c.net - invoicePaid(inv);
  var body = '<div class="grid g2">' +
    '<label class="f"><span>تاریخ</span>' + jInput('date', todayISO()) + '</label>' +
    '<label class="f"><span>مبلغ</span><input type="number" name="amount" value="' + Math.round(Math.max(rem, 0)) + '"></label>' +
    '</div><label class="f"><span>شرح</span><input type="text" name="desc" value="پرداخت صورت‌وضعیت"></label>';
  modal('ثبت پرداخت', body,
    '<button class="btn p" data-act="pay-save" data-id="' + inv.id + '">ثبت</button><button class="btn" data-act="close-modal">انصراف</button>');
});

act('pay-save', function(t){
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  var f = readForm($('#overlay'));
  pushUndo('pay-save');
  inv.payments = inv.payments || [];
  inv.payments.push({ date: f.date || todayISO(), amount: num(f.amount), desc: f.desc });
  DB.cash.push({ id: uid('cash'), projectId: inv.projectId, date: f.date || todayISO(), type: 'in', amount: num(f.amount), desc: 'پرداخت ' + (inv.no || ''), ref: inv.id });
  save(); closeModal(); render(); toast('ثبت شد', 'ok');
});

act('inv-del', function(t){
  if(!confirm('حذف؟')) return;
  pushUndo('inv-del');
  DB.invoices = DB.invoices.filter(function(x){ return x.id !== t.dataset.id; });
  save(); render();
});

act('inv-print', function(t){
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  var c = invoiceCalc(inv);
  var p = DB.projects.find(function(x){ return x.id === inv.projectId; });
  var items = inv.items || [];
  var totalRows = Math.max(items.length, 8);
  var h = '<div class="a4" style="background:#fff;width:100%;padding:14px;line-height:2">';
  h += '<div style="display:flex;justify-content:space-between;border-bottom:2px solid #0F5C4E;padding-bottom:10px;margin-bottom:16px">';
  h += '<div><b style="font-size:16px">' + esc(DB.settings.org) + '</b><div class="small muted">صورت‌وضعیت</div></div>';
  h += '<div style="text-align:left;font-size:12px"><div>شماره: <b>' + esc(inv.no || '—') + '</b></div>';
  h += '<div>تاریخ: <b>' + jStr(inv.date, true) + '</b></div></div></div>';
  h += '<div style="margin-bottom:10px"><b>پروژه:</b> ' + esc(p ? p.name : '—') + '</div>';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr><th style="border:1px solid #999;padding:6px">شرح</th><th style="border:1px solid #999;padding:6px">مقدار</th><th style="border:1px solid #999;padding:6px">واحد</th><th style="border:1px solid #999;padding:6px">قیمت</th><th style="border:1px solid #999;padding:6px">ضریب</th><th style="border:1px solid #999;padding:6px">جمع</th></tr></thead><tbody>';
  for(var i = 0; i < totalRows; i++){
    var it = items[i];
    h += '<tr>';
    if(it){
      var cf = num(it.coef) || 1;
      h += '<td style="border:1px solid #999;padding:5px">' + esc(it.desc) + '</td>';
      h += '<td style="border:1px solid #999;padding:5px;text-align:center">' + fmt(it.qty, 2) + '</td>';
      h += '<td style="border:1px solid #999;padding:5px;text-align:center">' + esc(it.unit || '') + '</td>';
      h += '<td style="border:1px solid #999;padding:5px;text-align:center">' + money(it.price) + '</td>';
      h += '<td style="border:1px solid #999;padding:5px;text-align:center">' + fmt(cf, 2) + '</td>';
      h += '<td style="border:1px solid #999;padding:5px;text-align:center">' + money(num(it.qty) * num(it.price) * cf) + '</td>';
    } else {
      for(var j = 0; j < 6; j++) h += '<td style="border:1px solid #999;padding:5px">&nbsp;</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  h += '<div style="margin-top:12px;font-size:13px">';
  h += '<div style="display:flex;justify-content:space-between"><span>کارکرد کل</span><b>' + money(c.gross) + '</b></div>';
  h += '<div style="display:flex;justify-content:space-between;background:#e3efec;padding:8px;border-radius:8px;margin-top:8px"><b>خالص قابل پرداخت</b><b>' + money(c.net) + '</b></div>';
  h += '</div></div>';
  modal('چاپ صورت‌وضعیت', h,
    '<button class="btn p" data-act="pdf-current">🖨 چاپ</button><button class="btn" data-act="close-modal">بستن</button>', 'wide');
});

var CHK_CLS = { pending_holder: 'b-info', pending_bank: 'b-warn', cleared: 'b-ok', bounced: 'b-bad' };

defRoute('checks', {
  title: 'چک و برات',
  sub: function(){ return fmt(DB.checks.length) + ' سند'; },

    if(!adj) h += '<button class="btn sm p" data-act="adj-create" data-pid="' + p.id + '">ایجاد تعدیل</button>';
    else h += '<button class="btn sm" data-act="adj-add-month" data-pid="' + p.id + '">+ ماه</button>';
    h += '</div></div>';
    if(!adj) return h;
    h += '<div class="card"><div class="card-h"><h3>شاخص‌ها</h3></div>';
    h += '<div class="tbl-wrap"><table><thead><tr><th>ماه</th><th>شاخص</th><th>ضریب</th><th></th></tr></thead><tbody>';
    var baseVal = 0;
    adj.indices.forEach(function(it){ if(it.month === adj.baseMonth) baseVal = num(it.value); });
    adj.indices.forEach(function(it){
      var f = baseVal ? num(it.value) / baseVal : 0;
      h += '<tr><td>' + esc(it.month) + (it.month === adj.baseMonth ? ' <span class="badge b-pr">مبنا</span>' : '') + '</td>';
      h += '<td class="num">' + fmt(it.value, 2) + '</td>';
      h += '<td class="num">' + (f ? fmt(f, 4) : '—') + '</td>';
      h += '<td><button class="btn sm d" data-act="adj-del-month" data-pid="' + p.id + '" data-month="' + esc(it.month) + '">×</button></td></tr>';
    });
    h += '</tbody></table></div></div>';
    return h;
  }
});

act('adj-create', function(t){
  pushUndo('adj-create');
  DB.adjustments.push({ id: uid('adj'), projectId: t.dataset.pid, baseMonth: '', indices: [], enabled: true });
  save(); render(); toast('ساخته شد', 'ok');
});

act('adj-add-month', function(t){
  var adj = DB.adjustments.find(function(x){ return x.projectId === t.dataset.pid; });
  if(!adj) return;
  var month = prompt('ماه (مثلاً 1403-01):');
  if(!month || !/^\d{4}-\d{2}$/.test(month)) return toast('فرمت نامعتبر', 'err');
  var val = prompt('شاخص:');
  if(val === null) return;
  var v = num(val);
  if(v <= 0) return toast('شاخص نامعتبر', 'err');
  pushUndo('adj-add');
  adj.indices = adj.indices.filter(function(x){ return x.month !== month; });
  adj.indices.push({ month: month, value: v });
  adj.indices.sort(function(a, b){ return a.month < b.month ? -1 : 1; });
  if(!adj.baseMonth) adj.baseMonth = month;
  save(); render();
});

act('adj-del-month', function(t){
  var adj = DB.adjustments.find(function(x){ return x.projectId === t.dataset.pid; });
  if(!adj) return;
  pushUndo('adj-del');
  adj.indices = adj.indices.filter(function(x){ return x.month !== t.dataset.month; });
  if(adj.baseMonth === t.dataset.month) adj.baseMonth = adj.indices.length ? adj.indices[0].month : '';
  save(); render();
});

    h += '<div class="card"><div class="card-h"><h3>فهرست اقلام</h3><div class="sp"></div><button class="btn sm p" data-act="item-new">+ قلم</button></div>';
    h += '<div class="tbl-wrap"><table><thead><tr><th>کد</th><th>نام</th><th>واحد</th><th>موجودی</th><th>نقطه سفارش</th><th>قیمت</th><th>ارزش</th><th></th></tr></thead><tbody>';
    if(!DB.items.length) h += '<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">قلمی ثبت نشده.</td></tr>';

});
