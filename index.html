<script>
/* ============ MANA INVOICE ↔ ACTIVITY ↔ GANTT LINK ============ */
(function(){
'use strict';
if(window.__manaLink) return;
window.__manaLink = true;

function nfl(n, d){ n = Number(n) || 0; return n.toLocaleString('en-US', {minimumFractionDigits: d||0, maximumFractionDigits: d||0}); }

/* ============================================================
   ۱) مدیریت مصالح فعالیت‌ها
   ============================================================ */
if(!Array.isArray(DB.activityMaterials)) DB.activityMaterials = [];

window.ManaActMat = {
  /* افزودن مصالح به فعالیت */
  add: function(projectId, activityId, material){
    pushUndo('act-mat-add');
    DB.activityMaterials.push({
      id: uid('am'),
      projectId: projectId,
      activityId: activityId,
      name: material.name || '',
      type: material.type || 'general',
      unit: material.unit || 'عدد',
      planned: num(material.planned),
      consumed: 0,
      unitPrice: num(material.unitPrice),
      note: material.note || '',
      date: todayISO(),
      t: Date.now()
    });
    save();
  },
  list: function(projectId, activityId){
    return DB.activityMaterials.filter(function(m){
      return m.projectId === projectId && (activityId ? m.activityId === activityId : true);
    });
  },
  /* محاسبه مصرف بر اساس صورت‌وضعیت‌ها */
  consumedFor: function(projectId, activityId){
    var invoices = DB.invoices.filter(function(inv){ return inv.projectId === projectId; });
    var total = 0;
    invoices.forEach(function(inv){
      (inv.items || []).forEach(function(item){
        if(item.activityId === activityId){
          total += num(item.qty) * (num(item.coef) || 1);
        }
      });
    });
    return total;
  },
  /* محاسبه پیشرفت خودکار بر اساس صورت‌وضعیت */
  progressFor: function(projectId, activityId){
    var mats = window.ManaActMat.list(projectId, activityId);
    if(!mats.length) return 0;
    var totalPlanned = mats.reduce(function(s, m){ return s + num(m.planned); }, 0);
    if(!totalPlanned) return 0;
    var totalConsumed = 0;
    mats.forEach(function(m){
      /* نسبت مصرف به برنامه */
      var ratio = num(m.planned) ? Math.min(num(m.consumed) / num(m.planned), 1) : 0;
      totalConsumed += num(m.planned) * ratio;
    });
    return (totalConsumed / totalPlanned) * 100;
  },
  /* محاسبه هزینه واقعی فعالیت */
  costFor: function(projectId, activityId){
    var invoices = DB.invoices.filter(function(inv){ return inv.projectId === projectId; });
    var total = 0;
    invoices.forEach(function(inv){
      (inv.items || []).forEach(function(item){
        if(item.activityId === activityId){
          total += num(item.qty) * num(item.price) * (num(item.coef) || 1);
        }
      });
    });
    return total;
  }
};

/* ============================================================
   ۲) تب مدیریت فعالیت — با مصالح
   ============================================================ */
ACT['act-materials'] = function(t){
  var pid = t.dataset.pid;
  var aid = t.dataset.aid;
  var p = DB.projects.find(function(x){ return x.id === pid; });
  if(!p) return;
  var act = p.activities.find(function(a){ return a.id === aid; });
  if(!act) return;
  
  function paint(){
    var mats = window.ManaActMat.list(pid, aid);
    var h = '<div class="card mb" style="background:var(--primary-50)">';
    h += '<b>🧱 ' + esc(act.name) + '</b>';
    h += '<div class="small muted mt">مدت: ' + num(act.dur) + ' روز — پیشرفت دستی: ' + num(act.progress) + '٪</div>';
    var autoProgress = window.ManaActMat.progressFor(pid, aid);
    if(mats.length){
      h += '<div class="small mt" style="margin-top:6px">پیشرفت خودکار: <b style="color:var(--primary);font-size:15px">' + nfl(autoProgress, 1) + '٪</b>';
      h += ' <button class="btn sm" style="padding:2px 8px;font-size:11px" data-act="act-use-auto" data-pid="' + pid + '" data-aid="' + aid + '">اعمال</button>';
      h += '</div>';
    }
    h += '</div>';
    
    /* لیست مصالح */
    h += '<div class="card mb">';
    h += '<div class="card-h"><h3>📦 مصالح فعالیت (' + mats.length + ')</h3><div class="sp"></div>';
    h += '<button class="btn sm p" data-act="am-new" data-pid="' + pid + '" data-aid="' + aid + '">+ مصالح</button></div>';
    if(!mats.length){
      h += '<div class="muted small" style="text-align:center;padding:14px">هنوز مصالحی اضافه نشده</div>';
    } else {
      h += '<div class="tbl-wrap"><table><thead><tr>';
      h += '<th>نام</th><th>واحد</th><th>برنامه</th><th>مصرف</th><th>پیشرفت</th><th>مبلغ</th><th></th>';
      h += '</tr></thead><tbody>';
      mats.forEach(function(m){
        var ratio = num(m.planned) ? Math.min(num(m.consumed) / num(m.planned) * 100, 100) : 0;
        var cost = num(m.consumed) * num(m.unitPrice);
        var cls = ratio >= 100 ? 'b-ok' : ratio > 0 ? 'b-warn' : 'b-mut';
        h += '<tr>';
        h += '<td><b>' + esc(m.name) + '</b></td>';
        h += '<td>' + esc(m.unit) + '</td>';
        h += '<td class="num">' + nfl(m.planned, 2) + '</td>';
        h += '<td class="num">' + nfl(m.consumed, 2) + '</td>';
        h += '<td><span class="badge ' + cls + '">' + nfl(ratio, 1) + '٪</span></td>';
        h += '<td class="num">' + nfl(cost) + '</td>';
        h += '<td class="row" style="gap:3px">';
        h += '<button class="btn sm" data-act="am-edit" data-id="' + m.id + '" data-pid="' + pid + '" data-aid="' + aid + '" style="padding:2px 6px">✎</button>';
        h += '<button class="btn sm d" data-act="am-del" data-id="' + m.id + '" data-pid="' + pid + '" data-aid="' + aid + '" style="padding:2px 6px">×</button>';
        h += '</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';
    
    /* خلاصه */
    var totalCost = mats.reduce(function(s, m){ return s + num(m.consumed) * num(m.unitPrice); }, 0);
    var plannedCost = mats.reduce(function(s, m){ return s + num(m.planned) * num(m.unitPrice); }, 0);
    var realCost = window.ManaActMat.costFor(pid, aid);
    if(mats.length){
      h += '<div class="card">';
      h += '<div class="card-h"><h3>💰 خلاصه</h3></div>';
      h += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>مبلغ برنامه‌ریزی‌شده</span><b>' + nfl(plannedCost) + '</b></div>';
      h += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>مصرف مصالح</span><b>' + nfl(totalCost) + '</b></div>';
      h += '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>صورت‌وضعیت‌های مرتبط</span><b>' + nfl(realCost) + '</b></div>';
      h += '</div>';
    }
    
    modal('مصالح فعالیت', h, '<button class="btn" data-act="close-modal">بستن</button>', 'wide');
  }
  paint();
};

/* افزودن مصالح جدید */
ACT['am-new'] = function(t){
  var pid = t.dataset.pid;
  var aid = t.dataset.aid;
  var h = '<div class="grid g2">';
  h += '<label class="f" style="grid-column:1/-1"><span>نام مصالح *</span><input type="text" id="amName" placeholder="مثلاً: بتن C25"></label>';
  h += '<label class="f"><span>واحد</span><select id="amUnit">';
  ['مترمربع','مترمکعب','متر','عدد','کیلوگرم','تن','کیسه','شاخه','رول','لیتر','بسته','تخته'].forEach(function(u){
    h += '<option>' + u + '</option>';
  });
  h += '</select></label>';
  h += '<label class="f"><span>مقدار برنامه‌ریزی‌شده *</span><input type="number" id="amPlan" value="0" step="0.01"></label>';
  h += '<label class="f"><span>قیمت واحد</span><input type="number" id="amPrice" value="0"></label>';
  h += '<label class="f"><span>نوع</span><select id="amType">';
  ['بتن','میلگرد','آجر','گچ','کاشی','رنگ','عایق','برق','لوله','درب','پنجره','شیشه','سنگ','سایر'].forEach(function(x){
    h += '<option>' + x + '</option>';
  });
  h += '</select></label>';
  h += '</div>';
  h += '<label class="f"><span>یادداشت</span><input type="text" id="amNote"></label>';
  h += '<div class="card mb" style="background:#f8fafc;box-shadow:none;padding:10px">';
  h += '<div class="small muted">💡 <b>راهنما:</b> می‌تونی از ماشین‌حساب مصالح استفاده کنی و نتایج رو اینجا وارد کنی</div>';
  h += '<button class="btn sm mt" type="button" data-act="am-from-calc" data-pid="' + pid + '" data-aid="' + aid + '">🧮 از ماشین‌حساب بگیر</button>';
  h += '</div>';
  modal('مصالح جدید', h,
    '<button class="btn p" data-act="am-save" data-pid="' + pid + '" data-aid="' + aid + '">ذخیره</button>' +
    '<button class="btn" data-act="close-modal">انصراف</button>', 'wide');
};

ACT['am-save'] = function(t){
  var name = document.getElementById('amName').value.trim();
  if(!name) return toast('نام الزامی', 'err');
  window.ManaActMat.add(t.dataset.pid, t.dataset.aid, {
    name: name,
    unit: document.getElementById('amUnit').value,
    planned: document.getElementById('amPlan').value,
    unitPrice: document.getElementById('amPrice').value,
    type: document.getElementById('amType').value,
    note: document.getElementById('amNote').value
  });
  closeModal();
  ACT['act-materials']({ dataset: { pid: t.dataset.pid, aid: t.dataset.aid } });
  toast('مصالح اضافه شد ✅', 'ok');
};

ACT['am-del'] = function(t){
  if(!confirm('حذف؟')) return;
  pushUndo('am-del');
  DB.activityMaterials = DB.activityMaterials.filter(function(x){ return x.id !== t.dataset.id; });
  save();
  closeModal();
  ACT['act-materials']({ dataset: { pid: t.dataset.pid, aid: t.dataset.aid } });
};

ACT['am-edit'] = function(t){
  var m = DB.activityMaterials.find(function(x){ return x.id === t.dataset.id; });
  if(!m) return;
  var h = '<div class="grid g2">';
  h += '<label class="f" style="grid-column:1/-1"><span>نام *</span><input type="text" id="ameName" value="' + esc(m.name) + '"></label>';
  h += '<label class="f"><span>واحد</span><input type="text" id="ameUnit" value="' + esc(m.unit) + '"></label>';
  h += '<label class="f"><span>مقدار برنامه</span><input type="number" id="amePlan" value="' + num(m.planned) + '" step="0.01"></label>';
  h += '<label class="f"><span>مصرف (واقعی)</span><input type="number" id="ameConsumed" value="' + num(m.consumed) + '" step="0.01"></label>';
  h += '<label class="f"><span>قیمت واحد</span><input type="number" id="amePrice" value="' + num(m.unitPrice) + '"></label>';
  h += '</div>';
  modal('ویرایش مصالح', h,
    '<button class="btn p" data-act="am-edit-save" data-id="' + m.id + '" data-pid="' + t.dataset.pid + '" data-aid="' + t.dataset.aid + '">ذخیره</button>' +
    '<button class="btn" data-act="close-modal">انصراف</button>');
};

ACT['am-edit-save'] = function(t){
  var m = DB.activityMaterials.find(function(x){ return x.id === t.dataset.id; });
  if(!m) return;
  pushUndo('am-edit');
  m.name = document.getElementById('ameName').value;
  m.unit = document.getElementById('ameUnit').value;
  m.planned = num(document.getElementById('amePlan').value);
  m.consumed = num(document.getElementById('ameConsumed').value);
  m.unitPrice = num(document.getElementById('amePrice').value);
  save();
  closeModal();
  ACT['act-materials']({ dataset: { pid: t.dataset.pid, aid: t.dataset.aid } });
};

/* اعمال پیشرفت خودکار روی فعالیت */
ACT['act-use-auto'] = function(t){
  var p = DB.projects.find(function(x){ return x.id === t.dataset.pid; });
  if(!p) return;
  var a = p.activities.find(function(x){ return x.id === t.dataset.aid; });
  if(!a) return;
  var auto = window.ManaActMat.progressFor(t.dataset.pid, t.dataset.aid);
  pushUndo('act-auto');
  a.progress = Math.round(auto * 10) / 10;
  save();
  closeModal();
  toast('پیشرفت اعمال شد: ' + a.progress + '٪', 'ok');
  render();
};

/* انتخاب مصالح از ماشین‌حساب */
ACT['am-from-calc'] = function(t){
  var h = '<div class="small muted mb">یه محاسبه از ماشین‌حساب انتخاب کن (چیزی که قبلاً محاسبه کردی):</div>';
  var calcs = DB.materialCalcs || [];
  if(!calcs.length){
    h += '<div class="card" style="text-align:center;padding:20px">';
    h += '<div class="muted small">هنوز هیچ محاسبه‌ای ذخیره نشده</div>';
    h += '<div class="small muted mt">برو به ماشین‌حساب مصالح، محاسبه کن، دکمه‌ی «💾 ذخیره در پروژه» رو بزن</div>';
    h += '</div>';
  } else {
    calcs.forEach(function(c){
      h += '<div class="card mb" style="padding:10px;cursor:pointer" data-act="am-pick-calc" data-pid="' + t.dataset.pid + '" data-aid="' + t.dataset.aid + '" data-calc-id="' + c.id + '">';
      h += '<div class="row" style="justify-content:space-between"><b>' + esc(c.name) + '</b>';
      h += '<span class="badge b-pr">' + nfl(c.value, 2) + ' ' + esc(c.unit) + '</span></div>';
      h += '<div class="small muted">' + (c.category || '') + ' — ' + jStr(c.date) + '</div>';
      h += '</div>';
    });
  }
  modal('انتخاب از ماشین‌حساب', h, '<button class="btn" data-act="close-modal">بستن</button>');
};

ACT['am-pick-calc'] = function(t){
  var c = (DB.materialCalcs || []).find(function(x){ return x.id === t.dataset.calcId; });
  if(!c) return;
  /* برگرد به فرم قبلی و پر کن */
  ACT['am-new']({ dataset: { pid: t.dataset.pid, aid: t.dataset.aid } });
  setTimeout(function(){
    var n = document.getElementById('amName');
    var u = document.getElementById('amUnit');
    var pl = document.getElementById('amPlan');
    if(n) n.value = c.name;
    if(u) u.value = c.unit || 'عدد';
    if(pl) pl.value = c.value || 0;
  }, 100);
};

/* ============================================================
   ۳) صورت‌وضعیت — اتصال به فعالیت
   ============================================================ */
var _origInvRowCard = invRowCard;
invRowCard = function(it, i){
  it = it || { desc: '', qty: 1, unit: '', price: 0, coef: 1, activityId: '' };
  var coef = num(it.coef) || 1;
  var rowTotal = num(it.qty) * num(it.price) * coef;
  
  /* پروژه‌ی فعلی */
  var ov = document.getElementById('overlay');
  var pid = '';
  if(ov){
    var sel = ov.querySelector('[name=projectId]');
    if(sel) pid = sel.value;
  }
  var p = DB.projects.find(function(x){ return x.id === pid; });
  var activities = p ? (p.activities || []) : [];
  var mats = window.ManaActMat.list(pid);
  
  var h = '<div class="inv-row-card" style="border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafcfb">';
  h += '<div class="row" style="justify-content:space-between;margin-bottom:8px">';
  h += '<b class="small" style="color:var(--primary)">ردیف ' + fmt(i + 1) + '</b>';
  h += '<button class="btn sm d" data-act="inv-delrow" type="button" style="padding:2px 8px">حذف</button>';
  h += '</div>';
  
  /* اتصال به فعالیت */
  if(activities.length){
    h += '<label class="f"><span>🔗 فعالیت مرتبط (در گانت)</span><select data-f="activityId" class="inv-act-sel" onchange="window.__onActSelect(this)">';
    h += '<option value="">— بدون اتصال —</option>';
    activities.forEach(function(a){
      h += '<option value="' + a.id + '"' + (it.activityId === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>';
    });
    h += '</select></label>';
  }
  
  /* مصالح مرتبط */
  if(mats.length){
    h += '<label class="f"><span>📦 از مصالح فعالیت</span><select data-f="materialId" class="inv-mat-sel" onchange="window.__onMatSelect(this)">';
    h += '<option value="">— انتخاب آزاد —</option>';
    mats.forEach(function(m){
      h += '<option value="' + m.id + '"' + (it.materialId === m.id ? ' selected' : '') + '>' + esc(m.name) + ' (' + esc(m.unit) + ')</option>';
    });
    h += '</select></label>';
  }
  
  h += '<label class="f"><span>شرح</span><input type="text" data-f="desc" value="' + esc(it.desc || '') + '" placeholder="مثلاً: بتن‌ریزی سقف"></label>';
  
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  h += '<label class="f" style="margin:0"><span>مقدار</span><input type="number" data-f="qty" value="' + num(it.qty) + '" step="0.01"></label>';
  h += '<label class="f" style="margin:0"><span>واحد</span><input type="text" data-f="unit" value="' + esc(it.unit || '') + '"></label>';
  h += '<label class="f" style="margin:0"><span>قیمت واحد</span><input type="number" data-f="price" value="' + num(it.price) + '"></label>';
  h += '<label class="f" style="margin:0"><span>ضریب</span><input type="number" data-f="coef" value="' + coef + '" step="0.01"></label>';
  h += '</div>';
  
  h += '<div class="row" style="justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)">';
  h += '<span class="small muted">جمع ردیف:</span>';
  h += '<b class="num" data-sum style="color:var(--primary)">' + money(rowTotal) + '</b>';
  h += '</div>';
  
  h += '</div>';
  return h;
};

/* رویداد انتخاب فعالیت */
window.__onActSelect = function(sel){
  var card = sel.closest('.inv-row-card');
  if(!card) return;
  var aid = sel.value;
  var ov = document.getElementById('overlay');
  var pid = '';
  if(ov){
    var pSel = ov.querySelector('[name=projectId]');
    if(pSel) pid = pSel.value;
  }
  /* پر کردن مصالح مربوط به این فعالیت */
  var matSel = card.querySelector('.inv-mat-sel');
  if(matSel){
    var mats = window.ManaActMat.list(pid, aid);
    var oldVal = matSel.value;
    matSel.innerHTML = '<option value="">— انتخاب آزاد —</option>';
    mats.forEach(function(m){
      matSel.innerHTML += '<option value="' + m.id + '">' + esc(m.name) + ' (' + esc(m.unit) + ')</option>';
    });
  }
};

/* رویداد انتخاب مصالح */
window.__onMatSelect = function(sel){
  var card = sel.closest('.inv-row-card');
  if(!card) return;
  var mid = sel.value;
  if(!mid) return;
  var m = DB.activityMaterials.find(function(x){ return x.id === mid; });
  if(!m) return;
  /* پر کردن فیلدها */
  var desc = card.querySelector('[data-f=desc]');
  var unit = card.querySelector('[data-f=unit]');
  var price = card.querySelector('[data-f=price]');
  if(desc) desc.value = m.name;
  if(unit) unit.value = m.unit;
  if(price) price.value = num(m.unitPrice);
  /* به‌روزرسانی جمع */
  if(window.refreshInvCalc) window.refreshInvCalc();
};

/* به‌روزرسانی collectItems برای گرفتن activityId و materialId */
var _origCollectItems = collectItems;
collectItems = function(){
  var cards = $$('#invItemsWrap .inv-row-card');
  return cards.map(function(card){
    return {
      desc: ($('[data-f=desc]', card) || {}).value || '',
      qty: num(($('[data-f=qty]', card) || {}).value),
      unit: ($('[data-f=unit]', card) || {}).value || '',
      price: num(($('[data-f=price]', card) || {}).value),
      coef: num(($('[data-f=coef]', card) || {}).value) || 1,
      activityId: ($('[data-f=activityId]', card) || {}).value || '',
      materialId: ($('[data-f=materialId]', card) || {}).value || ''
    };
  });
};

/* ============================================================
   ۴) بروزرسانی خودکار مصرف مصالح پس از ذخیره صورت‌وضعیت
   ============================================================ */
var _origInvSaveLink = ACT['inv-save'];
ACT['inv-save'] = function(t){
  /* قبل از ذخیره، آیتم‌ها رو جمع کن */
  var items = collectItems().filter(function(x){ return x.desc || x.price; });
  var ov = document.getElementById('overlay');
  var pid = '';
  if(ov){
    var pSel = ov.querySelector('[name=projectId]');
    if(pSel) pid = pSel.value;
  }
  
  /* ذخیره */
  var res = _origInvSaveLink.apply(this, arguments);
  
  /* بعد از ذخیره، مصرف مصالح رو به‌روز کن */
  setTimeout(function(){
    items.forEach(function(item){
      if(!item.activityId) return;
      /* مصالح مرتبط با فعالیت رو به‌روز کن */
      var mats = DB.activityMaterials.filter(function(m){
        return m.projectId === pid && m.activityId === item.activityId;
      });
      /* اگه materialId مشخصه، همون رو به‌روز کن */
      if(item.materialId){
        var m = DB.activityMaterials.find(function(x){ return x.id === item.materialId; });
        if(m){
          m.consumed = num(m.consumed) + num(item.qty) * (num(item.coef) || 1);
        }
      } else {
        /* اگه materialId نیست، اولین مصالح با همون نام رو پیدا کن */
        var matching = mats.find(function(m){ return m.name === item.desc || (m.name && item.desc && m.name.indexOf(item.desc) > -1); });
        if(matching){
          matching.consumed = num(matching.consumed) + num(item.qty) * (num(item.coef) || 1);
        }
      }
    });
    save();
  }, 300);
  
  return res;
};

/* ============================================================
   ۵) گانت — نمایش پیشرفت واقعی از صورت‌وضعیت‌ها
   ============================================================ */
var _origGanttRender = ROUTES.gantt.render;
ROUTES.gantt.render = function(){
  if(!DB.projects.length) return _origGanttRender.apply(this, arguments);
  var p = DB.projects.find(function(x){ return x.id === currentProjectId(); }) || DB.projects[0];
  var res = computeCPM(p.activities || []);
  if(res.error) return _origGanttRender.apply(this, arguments);
  
  var h = '<div class="card mb"><div class="card-h">';
  h += '<label class="f" style="margin:0;min-width:220px"><span>پروژه</span><select data-act-change="gantt-prj">';
  DB.projects.forEach(function(x){
    h += '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
  });
  h += '</select></label><div class="sp"></div>';
  h += '<span class="badge b-pr">مدت: ' + fmt(res.duration) + ' روز</span>';
  h += '<button class="btn sm p" data-act="prj-act" data-id="' + p.id + '">ویرایش فعالیت‌ها</button>';
  h += '</div></div>';
  
  /* KPI */
  var A = res.activities;
  var totalProgress = 0, totalWeight = 0;
  var criticalCount = 0;
  A.forEach(function(a){
    var w = num(a.dur) || 1;
    var auto = window.ManaActMat.progressFor(p.id, a.id);
    var prog = auto > 0 ? auto : num(a.progress);
    totalProgress += w * prog;
    totalWeight += w;
    if(a.critical) criticalCount++;
  });
  var weightedProgress = totalWeight ? totalProgress / totalWeight : 0;
  
  h += '<div class="grid g4 mb">';
  h += '<div class="kpi k-info"><div class="lbl">پیشرفت کل پروژه</div><div class="val">' + fmt(weightedProgress, 1) + '٪</div><div class="sub">وزنی بر اساس مدت</div></div>';
  h += '<div class="kpi"><div class="lbl">مدت پروژه</div><div class="val">' + fmt(res.duration) + '</div><div class="sub">روز</div></div>';
  h += '<div class="kpi k-bad"><div class="lbl">فعالیت بحرانی</div><div class="val">' + fmt(criticalCount) + ' از ' + fmt(A.length) + '</div></div>';
  h += '<div class="kpi k-ok"><div class="lbl">مصالح ثبت‌شده</div><div class="val">' + fmt(DB.activityMaterials.filter(function(m){ return m.projectId === p.id; }).length) + '</div></div>';
  h += '</div>';
  
  /* گانت */
  var total = Math.max(res.duration, 1);
  var dayW = 20;
  var chartW = total * dayW;
  var todayOffset = daysBetween(p.start || todayISO(), todayISO());
  
  h += '<div class="card"><div class="card-h"><h3>📊 گانت (پیشرفت واقعی)</h3>';
  h += '<span class="legend" style="margin-inline-start:12px">';
  h += '<span><i style="background:#C0392B"></i>بحرانی</span>';
  h += '<span><i style="background:#0F5C4E"></i>عادی</span>';
  h += '<span><i style="background:#C9A227"></i>امروز</span>';
  h += '<span><i style="background:rgba(255,255,255,.4)"></i>پیشرفت خودکار</span>';
  h += '</span></div>';
  
  h += '<div style="overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff">';
  h += '<table style="min-width:' + (chartW + 220) + 'px;border-collapse:collapse">';
  h += '<thead><tr>';
  h += '<th style="width:200px;position:sticky;right:0;background:#f8fafc;z-index:3;border-bottom:1px solid var(--line);text-align:right;padding:8px 10px;font-size:12px">فعالیت</th>';
  for(var d = 0; d <= total; d += 5){
    h += '<th style="width:' + (dayW * 5) + 'px;text-align:center;font-size:10px;padding:4px 0;background:#f8fafc;border-bottom:1px solid var(--line)">' + fmt(d) + '</th>';
  }
  h += '</tr></thead><tbody>';
  
  A.forEach(function(a){
    var autoProg = window.ManaActMat.progressFor(p.id, a.id);
    var matCount = window.ManaActMat.list(p.id, a.id).length;
    var hasAuto = autoProg > 0;
    var prog = hasAuto ? autoProg : num(a.progress);
    
    h += '<tr style="height:40px">';
    h += '<td style="position:sticky;right:0;background:#fff;z-index:2;border-bottom:1px solid #f1f4f8;padding:6px 10px;font-size:12px">';
    h += '<div style="font-weight:600">' + esc(a.name) + '</div>';
    h += '<div class="small muted" style="font-size:10px">';
    if(hasAuto) h += '📊 خودکار';
    else h += fmt(a.dur) + ' روز';
    if(matCount) h += ' — 📦 ' + matCount;
    h += '</div>';
    h += '</td>';
    h += '<td colspan="999" style="position:relative;border-bottom:1px solid #f1f4f8;padding:0;height:40px;background:#fff">';
    
    for(var g = 0; g < total; g += 5){
      h += '<div style="position:absolute;top:0;bottom:0;right:' + (g * dayW) + 'px;width:' + (dayW * 5) + 'px;border-right:1px dashed #eef1f5;pointer-events:none"></div>';
    }
    
    var leftPx2 = a.ES * dayW;
    var w = Math.max(a.dur * dayW, 10);
    var bg = a.critical ? 'linear-gradient(90deg,#e06a5c,#C0392B)' : 'linear-gradient(90deg,#2f9078,#0F5C4E)';
    
    h += '<div style="position:absolute;top:9px;right:' + leftPx2 + 'px;width:' + w + 'px;height:22px;border-radius:6px;background:' + bg + ';overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer" onclick="window.__ganttActMat(\'' + p.id + '\',\'' + a.id + '\')" title="' + esc(a.name) + ' — ' + fmt(a.dur) + ' روز — پیشرفت: ' + fmt(prog, 1) + '٪">';
    
    /* پیشرفت خودکار از صورت‌وضعیت */
    var progW = w * (Math.min(prog, 100) / 100);
    h += '<div style="position:absolute;top:0;bottom:0;right:0;width:' + progW + 'px;background:rgba(255,255,255,.4);border-radius:0"></div>';
    h += '<div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3)">' + fmt(prog, 0) + '٪</div>';
    h += '</div>';
    
    if(todayOffset >= 0 && todayOffset <= total){
      h += '<div style="position:absolute;top:0;bottom:0;right:' + (todayOffset * dayW) + 'px;width:2px;background:#C9A227;opacity:.9;pointer-events:none;z-index:1"></div>';
    }
    h += '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  
  /* جدول تفصیلی */
  h += '<div class="card mt"><div class="card-h"><h3>جزئیات فعالیت‌ها + مصالح</h3></div>';
  h += '<div class="tbl-wrap"><table><thead><tr>';
  h += '<th>فعالیت</th><th>مدت</th><th>پیشرفت دستی</th><th>پیشرفت خودکار</th><th>مصالح</th><th>هزینه صورت‌وضعیت</th><th></th>';
  h += '</tr></thead><tbody>';
  A.forEach(function(a){
    var auto = window.ManaActMat.progressFor(p.id, a.id);
    var mats = window.ManaActMat.list(p.id, a.id);
    var cost = window.ManaActMat.costFor(p.id, a.id);
    h += '<tr>';
    h += '<td><b>' + esc(a.name) + '</b>' + (a.critical ? ' <span class="badge b-bad">بحرانی</span>' : '') + '</td>';
    h += '<td class="num">' + fmt(a.dur) + '</td>';
    h += '<td class="num">' + fmt(num(a.progress)) + '٪</td>';
    h += '<td class="num" style="color:' + (auto > 0 ? '#0F5C4E' : '#888') + '">' + (auto > 0 ? fmt(auto, 1) + '٪' : '—') + '</td>';
    h += '<td class="num">' + fmt(mats.length) + ' قلم</td>';
    h += '<td class="num">' + nfl(cost) + '</td>';
    h += '<td><button class="btn sm p" onclick="window.__ganttActMat(\'' + p.id + '\',\'' + a.id + '\')">📦 مصالح</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  
  return h;
};

<script>
/* ============ MANA APPROVAL WORKFLOW ============ */
(function(){
'use strict';
if(window.__manaApproval) return;
window.__manaApproval = true;

function nfa(n, d){ n = Number(n) || 0; return n.toLocaleString('en-US', {minimumFractionDigits: d||0, maximumFractionDigits: d||0}); }

/* ============================================================
   وضعیت‌ها
   ============================================================ */
var INV_STATUS = {
  draft:    { t: 'پیش‌نویس',    icon: '📝', cls: 'b-mut',  affect: false },
  pending:  { t: 'در انتظار تأیید', icon: '🕐', cls: 'b-warn', affect: false },
  approved: { t: 'تأییدشده',   icon: '✅', cls: 'b-ok',  affect: true },

};

/* ============================================================
   ۱) به‌روزرسانی وضعیت صورت‌وضعیت‌های موجود
   ============================================================ */
(function(){
  var changed = false;
  DB.invoices.forEach(function(inv){
    if(!inv.status){
      /* صورت‌وضعیت‌های قدیمی = approved (چون قبلاً استفاده شدن) */
      inv.status = 'approved';
      inv.approvedDate = inv.date;
      inv.approvedBy = 'سیستم';
      changed = true;

})();

/* ============================================================
   ۲) تابع کمکی: آیا این صورت‌وضعیت اثر داره؟
   ============================================================ */
window.isInvoiceEffective = function(inv){
  return inv && inv.status === 'approved';
};

/* ============================================================
   ۳) به‌روزرسانی محاسبه مصرف مصالح — فقط صورت‌وضعیت‌های تأییدشده
   ============================================================ */
window.ManaActMat = window.ManaActMat || {};

var _origConsumedFor = window.ManaActMat.consumedFor;
window.ManaActMat.consumedFor = function(projectId, activityId){
  var invoices = DB.invoices.filter(function(inv){
    return inv.projectId === projectId && window.isInvoiceEffective(inv);
  });
  var total = 0;
  invoices.forEach(function(inv){
    (inv.items || []).forEach(function(item){
      if(item.activityId === activityId){
        total += num(item.qty) * (num(item.coef) || 1);
      }
    });
  });
  return total;
};

var _origCostFor = window.ManaActMat.costFor;
window.ManaActMat.costFor = function(projectId, activityId){
  var invoices = DB.invoices.filter(function(inv){
    return inv.projectId === projectId && window.isInvoiceEffective(inv);
  });
  var total = 0;
  invoices.forEach(function(inv){
    (inv.items || []).forEach(function(item){
      if(item.activityId === activityId){
        total += num(item.qty) * num(item.price) * (num(item.coef) || 1);
      }
    });
  });
  return total;
};

/* ============================================================
   ۴) محاسبه‌ی مجدد خودکار مصالح فعالیت (فقط از تأییدشده‌ها)
   ============================================================ */
window.recalcActivityMaterials = function(projectId, activityId){
  DB.activityMaterials.filter(function(m){
    return m.projectId === projectId && (activityId ? m.activityId === activityId : true);
  }).forEach(function(m){
    var invs = DB.invoices.filter(function(inv){
      return inv.projectId === m.projectId && window.isInvoiceEffective(inv);
    });
    var consumed = 0;
    invs.forEach(function(inv){
      (inv.items || []).forEach(function(item){
        if(item.activityId === m.activityId && item.materialId === m.id){
          consumed += num(item.qty) * (num(item.coef) || 1);
        }
      });
    });
    /* اگه materialId نبود، با نام تطبیق بده */
    if(consumed === 0){
      invs.forEach(function(inv){
        (inv.items || []).forEach(function(item){
          if(item.activityId === m.activityId && !item.materialId){
            if(item.desc && m.name && (item.desc === m.name || item.desc.indexOf(m.name) > -1 || m.name.indexOf(item.desc) > -1)){
              consumed += num(item.qty) * (num(item.coef) || 1);
            }
          }
        });
      });
    }
    m.consumed = consumed;
  });
  save();
};

/* ============================================================
   ۵) صفحه‌ی تأیید صورت‌وضعیت‌ها (مرکز تأیید)
   ============================================================ */

    h += '<div class="kpi k-bad"><div class="lbl">❌ رد شده</div><div class="val">' + fmt(rejected.length) + '</div></div>';
    h += '<div class="kpi"><div class="lbl">📝 پیش‌نویس</div><div class="val">' + fmt(draft.length) + '</div></div>';
    h += '</div>';
    
    h += '<div class="card mb" style="background:#fffaf0;border-color:#f4dcb4">';
    h += '<b>💡 چطور کار می‌کنه؟</b>';
    h += '<div class="small muted mt">';

    h += '❌ صورت‌وضعیت <b>رد شده</b>: هیچ تأثیری نداره.<br>';
    h += '📝 <b>پیش‌نویس</b>: هنوز کامل نشده، فقط ذخیره شده.';
    h += '</div></div>';
    
    /* لیست در انتظار */
    if(pending.length){
      h += '<div class="card mb">';
      h += '<div class="card-h"><h3>🕐 در انتظار تأیید (' + pending.length + ')</h3></div>';
      pending.forEach(function(inv){
        var p = DB.projects.find(function(x){ return x.id === inv.projectId; }) || {};
        var c = invoiceCalc(inv);
        var itemsWithAct = (inv.items || []).filter(function(it){ return it.activityId; }).length;
        h += '<div class="card mb" style="padding:12px;background:#fffaf0;border-color:#f4dcb4">';
        h += '<div class="row" style="justify-content:space-between;align-items:start">';
        h += '<div style="flex:1">';
        h += '<div style="font-weight:700">صورت‌وضعیت ' + esc(inv.no || '—') + '</div>';
        h += '<div class="small muted">' + esc(p.name || '') + ' — ' + jStr(inv.date, true) + '</div>';
        h += '<div class="small muted">' + (inv.items || []).length + ' ردیف، ' + itemsWithAct + ' مرتبط با فعالیت</div>';
        h += '<div style="font-size:15px;font-weight:700;color:var(--primary);margin-top:4px">' + money(c.net) + ' ' + esc(DB.settings.currency || '') + '</div>';
        h += '</div>';
        h += '<div class="row" style="gap:4px;flex-wrap:wrap">';
        h += '<button class="btn sm g" data-act="inv-approve" data-id="' + inv.id + '">✅ تأیید</button>';
        h += '<button class="btn sm d" data-act="inv-reject" data-id="' + inv.id + '">❌ رد</button>';
        h += '<button class="btn sm" data-act="inv-view" data-id="' + inv.id + '">👁</button>';
        h += '</div>';
        h += '</div>';
        h += '</div>';
      });
      h += '</div>';
    }
    
    /* لیست تأییدشده‌ها */
    if(approved.length){
      h += '<div class="card">';
      h += '<div class="card-h"><h3>✅ تأییدشده (' + approved.length + ')</h3></div>';
      h += '<div class="tbl-wrap"><table><thead><tr>';
      h += '<th>شماره</th><th>پروژه</th><th>تاریخ</th><th>تأیید</th><th>مبلغ</th><th></th>';
      h += '</tr></thead><tbody>';
      approved.slice().reverse().slice(0, 30).forEach(function(inv){
        var p = DB.projects.find(function(x){ return x.id === inv.projectId; }) || {};
        var c = invoiceCalc(inv);
        h += '<tr>';
        h += '<td class="num">' + esc(inv.no || '—') + '</td>';
        h += '<td>' + esc(p.name || '—') + '</td>';
        h += '<td class="num">' + jStr(inv.date) + '</td>';
        h += '<td class="num">' + jStr(inv.approvedDate || inv.date) + '</td>';
        h += '<td class="num">' + money(c.net) + '</td>';
        h += '<td class="row" style="gap:3px">';
        h += '<button class="btn sm" data-act="inv-view" data-id="' + inv.id + '">👁</button>';
        h += '<button class="btn sm d" data-act="inv-unapprove" data-id="' + inv.id + '" title="لغو تأیید">↩</button>';
        h += '</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div></div>';
    }
    
    /* رد شده‌ها */
    if(rejected.length){
      h += '<div class="card mt">';
      h += '<div class="card-h"><h3>❌ رد شده (' + rejected.length + ')</h3></div>';
      rejected.slice().reverse().slice(0, 10).forEach(function(inv){
        var p = DB.projects.find(function(x){ return x.id === inv.projectId; }) || {};
        h += '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">';
        h += '<div><b>' + esc(inv.no || '—') + '</b> <span class="small muted">' + esc(p.name || '') + '</span></div>';
        h += '<button class="btn sm" data-act="inv-unreject" data-id="' + inv.id + '">↩ بازگردانی</button>';
        h += '</div>';
      });
      h += '</div>';
    }
    
    return h;
  }
});

/* ============================================================
   ۶) اقدامات تأیید
   ============================================================ */
ACT['inv-approve'] = function(t){
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  if(inv.status === 'approved') return toast('قبلاً تأیید شده', 'err');
  
  var approveBy = prompt('نام تأییدکننده (اختیاری):', DB.settings.signer || 'ناظر');
  if(approveBy === null) return;
  
  pushUndo('inv-approve');
  inv.status = 'approved';
  inv.approvedDate = todayISO();
  inv.approvedBy = approveBy || 'ناظر';
  save();
  
  /* محاسبه‌ی مجدد مصالح */
  window.recalcActivityMaterials(inv.projectId);
  
  /* پیشرفت فعالیت‌های مرتبط رو آپدیت کن */
  updateActivityProgress(inv.projectId);
  
  render();
  toast('✅ صورت‌وضعیت تأیید شد — اثرش اعمال شد', 'ok');
  
  /* اعلان */
  if(window.ManaNotifyReal && DB.settings.notifications){
    window.ManaNotifyReal.send('✅ تأیید شد', 'صورت‌وضعیت ' + (inv.no || '') + ' تأیید شد و در گانت اثر گذاشت');
  }
};

ACT['inv-reject'] = function(t){
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  var reason = prompt('دلیل رد (اختیاری):', '');
  if(reason === null) return;
  pushUndo('inv-reject');
  inv.status = 'rejected';
  inv.rejectReason = reason || '';
  inv.rejectedDate = todayISO();
  save();
  
  /* محاسبه‌ی مجدد */
  window.recalcActivityMaterials(inv.projectId);
  updateActivityProgress(inv.projectId);
  
  render();
  toast('❌ صورت‌وضعیت رد شد', 'err');
};

ACT['inv-unapprove'] = function(t){
  if(!confirm('لغو تأیید؟ این صورت‌وضعیت دوباره در انتظار می‌ره و اثرش حذف می‌شه.')) return;
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  pushUndo('inv-unapprove');
  inv.status = 'pending';
  inv.approvedDate = null;
  save();
  window.recalcActivityMaterials(inv.projectId);
  updateActivityProgress(inv.projectId);
  render();
  toast('↩ به حالت انتظار برگشت', 'ok');
};

ACT['inv-unreject'] = function(t){
  if(!confirm('بازگردانی به حالت انتظار؟')) return;
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  pushUndo('inv-unreject');
  inv.status = 'pending';
  inv.rejectReason = '';
  save();
  render();
  toast('↩ بازگردانی شد', 'ok');
};

/* ============================================================
   ۷) آپدیت پیشرفت فعالیت‌ها بر اساس صورت‌وضعیت‌های تأییدشده
   ============================================================ */
function updateActivityProgress(projectId){
  var p = DB.projects.find(function(x){ return x.id === projectId; });
  if(!p) return;
  (p.activities || []).forEach(function(a){
    var auto = window.ManaActMat.progressFor(projectId, a.id);
    if(auto > 0){
      a.progress = Math.round(auto * 10) / 10;
      a.progressSource = 'auto';
      a.progressUpdated = todayISO();
    }
  });
  /* پیشرفت کل پروژه */
  var totalWeight = 0, weightedProgress = 0;
  (p.activities || []).forEach(function(a){
    var w = num(a.dur) || 1;
    totalWeight += w;
    weightedProgress += w * num(a.progress);
  });
  if(totalWeight) p.progress = Math.round((weightedProgress / totalWeight) * 10) / 10;
  save();
}

/* ============================================================
   ۸) صورت‌وضعیت جدید — همیشه پیش‌نویس شروع می‌شه
   ============================================================ */
var _origInvSaveFinal = ACT['inv-save'];
ACT['inv-save'] = function(t){
  var res = _origInvSaveFinal.apply(this, arguments);
  /* بعد از ذخیره، وضعیت رو draft بذار */
  setTimeout(function(){
    var last = DB.invoices[DB.invoices.length - 1];
    if(last && !last.status){
      last.status = 'draft';
      save();
    }
  }, 100);
  return res;
};

/* ============================================================
   ۹) دکمه‌ی "ثبت برای تأیید" در فرم صورت‌وضعیت
   ============================================================ */
var _origInvFormFinal = invForm;
invForm = function(inv){
  inv = inv || {};
  var h = _origInvFormFinal.apply(this, arguments);
  
  /* اگه صورت‌وضعیت موجوده، وضعیتش رو نشون بده */
  if(inv.id && inv.status){
    var st = INV_STATUS[inv.status] || INV_STATUS.draft;
    var banner = '<div class="card mb" style="background:' + (inv.status === 'approved' ? '#f0f8f3' : inv.status === 'rejected' ? '#fdeceb' : inv.status === 'pending' ? '#fffaf0' : '#f8fafc') + ';border-color:var(--line)">';
    banner += '<div class="row" style="justify-content:space-between;align-items:center">';
    banner += '<div><span class="badge ' + st.cls + '">' + st.icon + ' ' + st.t + '</span>';
    if(inv.status === 'approved' && inv.approvedDate){
      banner += '<div class="small muted mt">تأیید شده در ' + jStr(inv.approvedDate, true) + ' توسط ' + esc(inv.approvedBy || '—') + '</div>';
    }
    if(inv.status === 'rejected' && inv.rejectReason){
      banner += '<div class="small muted mt">دلیل رد: ' + esc(inv.rejectReason) + '</div>';
    }
    banner += '</div>';
    if(inv.status === 'draft' || inv.status === 'pending'){
      banner += '<button class="btn sm p" data-act="inv-submit-for-approval" data-id="' + inv.id + '">📤 ثبت برای تأیید</button>';
    }
    banner += '</div></div>';
    h = banner + h;
  }
  
  return h;
};

/* ============================================================
   ۱۰) اقدام ثبت برای تأیید
   ============================================================ */
ACT['inv-submit-for-approval'] = function(t){
  var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
  if(!inv) return;
  
  /* بررسی ردیف‌های مرتبط */
  var itemsWithAct = (inv.items || []).filter(function(it){ return it.activityId; });
  if(!itemsWithAct.length){
    if(!confirm('هیچ ردیفی به فعالیت گانت وصل نیست. با این حال ثبت کنم؟')) return;
  }
  
  pushUndo('inv-submit');
  inv.status = 'pending';
  inv.submittedDate = todayISO();
  save();
  closeModal();
  render();
  toast('📤 ثبت شد — منتظر تأیید', 'ok');
  
  /* اعلان */
  if(window.ManaNotifyReal && DB.settings.notifications){
    window.ManaNotifyReal.send('📤 در انتظار تأیید', 'صورت‌وضعیت ' + (inv.no || '') + ' برای تأیید ارسال شد');
  }
};

/* ============================================================
   ۱۱) صفحه‌ی صورت‌وضعیت — نمایش وضعیت
   ============================================================ */
var _origInvRenderFinal = ROUTES.invoices.render;
ROUTES.invoices.render = function(){
  var h = _origInvRenderFinal.apply(this, arguments);
  
  /* بعد از رندر، به هر ردیف ستون وضعیت اضافه کن */
  setTimeout(function(){
    var tables = document.querySelectorAll('#view .tbl-wrap table');
    tables.forEach(function(tbl){
      var thead = tbl.querySelector('thead tr');
      var tbody = tbl.querySelector('tbody');
      if(!thead || !tbody) return;
      if(thead.querySelector('.inv-status-th')) return;
      
      /* هدر */
      var th = document.createElement('th');
      th.className = 'inv-status-th';
      th.textContent = 'وضعیت';
      var lastTh = thead.querySelector('th:last-child');
      if(lastTh) thead.insertBefore(th, lastTh);
      
      /* هر ردیف */
      var rows = tbody.querySelectorAll('tr');
      Array.prototype.forEach.call(rows, function(tr, i){
        var inv = DB.invoices.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; })[i];
        if(!inv) return;
        var st = INV_STATUS[inv.status] || INV_STATUS.draft;
        var td = document.createElement('td');
        td.innerHTML = '<span class="badge ' + st.cls + '">' + st.icon + ' ' + st.t + '</span>';
        var lastTd = tr.querySelector('td:last-child');
        if(lastTd) tr.insertBefore(td, lastTd);
      });
    });
  }, 200);
  
  return h;
};

/* ============================================================
   ۱۲) به‌روزرسانی گانت — فقط تأییدشده‌ها رو نشون بده
   ============================================================ */
var _origGanttRenderFinal = ROUTES.gantt.render;
ROUTES.gantt.render = function(){
  var h = _origGanttRenderFinal.apply(this, arguments);
  
  /* اضافه کردن بنر هشدار اگه صورت‌وضعیت در انتظار هست */
  var p = DB.projects.find(function(x){ return x.id === currentProjectId(); }) || DB.projects[0];
  if(p){
    var pending = DB.invoices.filter(function(inv){
      return inv.projectId === p.id && inv.status === 'pending';
    });
    if(pending.length){
      var warn = '<div class="card mb" style="background:#fffaf0;border-color:#f4dcb4">';
      warn += '<div class="row" style="justify-content:space-between;align-items:center">';
      warn += '<div><b>🕐 ' + pending.length + ' صورت‌وضعیت در انتظار تأیید</b>';
      warn += '<div class="small muted mt">تا تأیید نشه، پیشرفت گانت آپدیت نمی‌شه</div></div>';
      warn += '<button class="btn sm p" onclick="location.hash=\'#/approvals\'">مشاهده</button>';
      warn += '</div></div>';
      h = warn + h;
    }
  }
  
  return h;
};

/* ============================================================
   ۱۳) اضافه به منو
   ============================================================ */
if(!NAV.some(function(n){ return n && n.k === 'approvals'; })){
  var idx = NAV.findIndex(function(n){ return n && n.k === 'invoices'; });
  if(idx > -1){
    NAV.splice(idx + 1, 0, { k: 'approvals', t: 'مرکز تأیید', i: '✅' });
  }
}

/* ============================================================
   ۱۴) شماره‌ی در انتظار روی نوار بالا
   ============================================================ */
(function(){
  function updateBadge(){
    var box = document.querySelector('.top-actions');
    if(!box) return;
    var pending = DB.invoices.filter(function(i){ return i.status === 'pending'; }).length;
    var existing = box.querySelector('.approval-badge');
    if(!pending){
      if(existing) existing.remove();
      return;
    }
    if(!existing){
      existing = document.createElement('button');
      existing.className = 'btn sm approval-badge';
      existing.style.cssText = 'background:#E68600;color:#fff;border-color:#E68600;position:relative';
      existing.innerHTML = '✅ <span>تأیید</span>';
      existing.onclick = function(){ location.hash = '#/approvals'; };
      var first = box.firstChild;
      box.insertBefore(existing, first);
    }
    var sp = existing.querySelector('.approval-count');
    if(!sp){
      sp = document.createElement('span');
      sp.className = 'approval-count';
      sp.style.cssText = 'background:#fff;color:#E68600;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px;margin-inline-start:4px';
      existing.appendChild(sp);
    }
    sp.textContent = pending;
  }
  updateBadge();
  setInterval(updateBadge, 10000);
})();

/* ============================================================
   ۱۵) دکمه‌های سریع در صورت‌وضعیت
   ============================================================ */
var _origInvViewFinal = ACT['inv-view'];
ACT['inv-view'] = function(t){
  var res = _origInvViewFinal.apply(this, arguments);
  setTimeout(function(){
    var inv = DB.invoices.find(function(x){ return x.id === t.dataset.id; });
    if(!inv) return;
    var foot = document.querySelector('#overlay .modal-f');
    if(!foot) return;
    if(foot.querySelector('.inv-approval-actions')) return;
    
    var box = document.createElement('div');
    box.className = 'inv-approval-actions';
    box.style.cssText = 'display:flex;gap:6px;margin-inline-start:auto';
    
    if(inv.status === 'draft' || inv.status === 'pending'){
      box.innerHTML = 
        '<button class="btn sm g" data-act="inv-approve" data-id="' + inv.id + '">✅ تأیید</button>' +
        '<button class="btn sm d" data-act="inv-reject" data-id="' + inv.id + '">❌ رد</button>';
    } else if(inv.status === 'approved'){
      box.innerHTML = '<span class="badge b-ok">✅ تأیید شده</span>';
    } else if(inv.status === 'rejected'){
      box.innerHTML = '<span class="badge b-bad">❌ رد شده</span>';
    }
    
    foot.appendChild(box);
  }, 150);
  return res;
};

/* ============================================================
   ۱۶) اجرای اولیه: به‌روزرسانی همه چیز
   ============================================================ */
setTimeout(function(){
  /* بازمحاسبه همه‌ی مصالح */
  DB.projects.forEach(function(p){
    window.recalcActivityMaterials(p.id);
  });
}, 500);

try{ buildNav(); render(); }catch(e){}
console.log('%c[MANA APPROVAL] loaded', 'color:#2fa88f;font-weight:bold');
})();
