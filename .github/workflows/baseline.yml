name: Mana legacy baseline
on:
  pull_request:
  push:
    branches:
      - feature/mana-ai-foundation
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run non-mutating source baseline checks
        run: node --test tests/*.test.cjs
