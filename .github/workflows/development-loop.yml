name: MANA Persian mission staging acceptance
on:
  pull_request:
    paths: ['mana-ai/**', '.github/workflows/development-loop.yml']
permissions:
  contents: read
jobs:
  real-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run CPU regressions
        run: node --test mana-ai/tests/expense-pilot.test.cjs mana-ai/tests/development-loop.test.cjs mana-ai/tests/typed-contracts.test.cjs mana-ai/tests/typed-dependency-contract-v03.test.cjs mana-ai/tests/typed-dependency-acceptance-v01.test.cjs mana-ai/tests/mission-runtime.test.cjs
      - name: Install namespace tool in disposable CI only
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Require real HTTP to native tests in isolated namespaces
        # Privilege creates namespaces only in this disposable runner. bwrap
        # drops all capabilities, clears env, makes sources read-only, isolates network.
        # Never use this sudo command on the user's production server.
        run: |
          # After dropping capabilities, root cannot traverse runner-owned 0700
          # parent directories. Copy only source to a fresh root-owned CI tree.
          stage="$(sudo mktemp -d /tmp/mana-ci-source.XXXXXXXX)"
          sudo cp -R mana-ai "$stage/mana-ai"
          sudo "$(command -v node)" "$stage/mana-ai/development-acceptance.cjs"
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mana-ai/tools/requirements-artifacts.txt
      - run: npm install --prefix tests/browser --ignore-scripts --no-package-lock
      - run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: node mana-ai/tools/development-browser-check.cjs
      - run: node --test mana-ai/tests/jarvis-preview.test.cjs mana-ai/benchmarks/persian-intent.test.cjs
      - run: python -m unittest discover -s mana-ai/tools -p test_schematic_plan.py
      - run: node mana-ai/tools/jarvis-browser-check.cjs
      - run: node mana-ai/tools/expense-browser-check.cjs
      - run: python -m unittest discover -s mana-ai/tools -p 'test_furnished*.py'
      - run: node mana-ai/tools/furnished-browser-check.cjs

      - run: node mana-ai/tools/floor-browser-check.cjs

      - run: node mana-ai/tools/plan-takeoff-browser-check.cjs

      - run: node mana-ai/tools/mana-conversation-browser-check.cjs

      - run: node mana-ai/tools/mana-skill-pilot-browser-check.cjs

      - run: node mana-ai/tools/mana-skill-dependence-browser-check.cjs

      - run: node mana-ai/tools/mana-clearance-browser-check.cjs

      - name: Verify Persian research preview in Chromium with official HTTPS evidence
        run: node mana-ai/tools/queue-research-browser-check.cjs

      - name: Verify offline Persian DXF review and exact CSV download in Chromium
        run: node mana-ai/tools/synthetic-review-browser-check.cjs
