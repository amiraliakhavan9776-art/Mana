name: Mana AI Node tests
on:
  push:
    branches: [feature/mana-ai-foundation]
    paths:
      - 'mana-ai/**'
      - '.github/workflows/mana-ai-tests.yml'
  pull_request:
    paths:
      - 'mana-ai/**'
      - '.github/workflows/mana-ai-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real artifact provider dependencies for Jarvis tests
        run: python -m pip install -r mana-ai/tools/requirements-artifacts.txt
      - name: Syntax check
        run: |
          find mana-ai -type f -name '*.cjs' -print0 | xargs -0 -n 1 node --check
      - name: Node unit and integration tests
        run: node --test mana-ai/tests/*.test.cjs
  native-learning-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify native learning and exact child evidence isolation
        run: node --test mana-ai/tests/mana-rd-native-synthesis.test.cjs
      - name: Test the opt-in research preview and receipt lifecycle
        run: node --test mana-ai/tests/research-preview.test.cjs
      - name: Verify bounded Persian AEC research intake and isolated learner
        run: node --test mana-ai/tests/aec-instruction.test.cjs
