name: Mana AI Node tests
on:
  push:
    branches: [feature/mana-ai-foundation]
    paths:
      - 'mana-ai/**'
      - '.github/workflows/mana-ai-tests.yml'
  pull_request:
    paths:
      - 'mana-ai/**'
      - '.github/workflows/mana-ai-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          find mana-ai -type f -name '*.cjs' -print0 | xargs -0 -n 1 node --check
      - name: Node unit and integration tests
        run: node --test mana-ai/tests/*.test.cjs
